  };
  return {
    id: 'ea', chap: '원리', name: '활성화에너지',
    guide: '<span class="hl">효소를 끌어 언덕 위에 올렸다</span> 다시 눌러 빼면서, ' +
           '그래프에서 무엇이 달라지고 무엇이 그대로인지 보세요.',
    mount: function (stage, panel) {
      /* 효소는 단추가 아니라 무대의 물건이다. 끌어서 언덕(활성화에너지 봉우리)에 올리면 넣은 것,
         언덕 위의 효소를 누르면 빼는 것 */
      var st = { on: false, vis: 0, sp: null, drag: null, tNow: 0, tPut: -9 };
      var cv = E.canvas(stage), M = {};
      /* 효소 — 초록 덩어리에 활성부위 홈. 이 편의 다른 장면과 같은 생김새 */
      function drawEnzymeBlob(c, x, y, r, hi) {
        c.save(); c.translate(x, y);
        c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.arc(4, 5, r, 0, 7); c.fill();
        c.beginPath();
        c.moveTo(-r, -r * .2); c.quadraticCurveTo(-r, -r, -r * .2, -r); c.lineTo(r * .3, -r);
        c.quadraticCurveTo(r, -r, r, -r * .1); c.lineTo(r, r * .3); c.quadraticCurveTo(r, r, r * .2, r);
        c.lineTo(-r * .4, r); c.quadraticCurveTo(-r, r, -r, r * .3); c.closePath();
        c.fillStyle = hi ? '#8ff0c0' : '#5fd68a'; c.fill();
        c.strokeStyle = INK; c.lineWidth = 3; c.lineJoin = 'round'; c.stroke();
        /* 활성부위 홈 */
        c.beginPath(); c.arc(r * .2, -r * .95, r * .34, 0, Math.PI); c.fillStyle = '#eef6fb'; c.fill(); c.stroke();
        c.restore();
      }
      cv.on(function (c, w, h, t) {
        E.dbg = { n: 'ea', st: st.on, M: M };
        st.tNow = t;
        var pad = 56;
        var gx = pad, gy = h - pad, gw = w - pad * 2, gh = h - pad * 2;
        c.save();
        /* 종이 한 장 위에 굵은 축 */
        rr(c, gx - 8, gy - gh - 12, gw + 16, gh + 20, 8);
        c.fillStyle = 'rgba(255,255,255,.75)'; c.fill();
        c.strokeStyle = INK; c.lineWidth = 2.6; c.lineCap = 'round'; c.lineJoin = 'round';
        c.beginPath(); c.moveTo(gx, gy - gh); c.lineTo(gx, gy); c.lineTo(gx + gw, gy); c.stroke();
        c.save(); c.translate(gx - 30, gy - gh / 2); c.rotate(-Math.PI / 2);
        label(c, 0, 0, '에너지', INK, 12); c.restore();
        label(c, gx + gw / 2, gy + 26, '반응의 진행', INK, 12);

        var yR = gy - gh * 0.42;          /* 반응물 */
        var yP = gy - gh * 0.16;          /* 생성물 (이화작용이라 아래) */
        /* 봉우리 높이는 논리값(st.on)이 아니라 그림값(st.vis)이 스프링으로 따라온다 */
        var peakNo = gy - gh * 0.90, peakYes = gy - gh * 0.62;
        function path(peakY, col, wdt, dash) {
          c.save();
          if (dash) c.setLineDash(dash);
          c.beginPath();
          c.moveTo(gx + gw * 0.06, yR);
          c.lineTo(gx + gw * 0.28, yR);
          c.bezierCurveTo(gx + gw * 0.40, yR, gx + gw * 0.42, peakY, gx + gw * 0.50, peakY);
          c.bezierCurveTo(gx + gw * 0.58, peakY, gx + gw * 0.60, yP, gx + gw * 0.72, yP);
          c.lineTo(gx + gw * 0.94, yP);
          c.strokeStyle = col; c.lineWidth = wdt; c.lineCap = 'round'; c.stroke();
          c.restore();
        }
        var peakNow = peakNo + (peakYes - peakNo) * st.vis;
        /* 효소 없는 언덕은 언제나 (효소를 넣으면 점선으로) */
        path(peakNo, st.on ? 'rgba(24,19,34,.35)' : '#ff5c5c', st.on ? 2.4 : 4.2, st.on ? [7, 6] : null);
        if (st.vis > 0.01) path(peakNow, '#12a06a', 4.2);

        /* 활성화에너지 화살표 */
        function arrow(peakY, col, dx, txt) {
          var ax = gx + gw * 0.50 + dx;
          c.save();
          c.strokeStyle = col; c.lineWidth = 2; c.setLineDash([4, 4]);
          c.beginPath(); c.moveTo(gx + gw * 0.06, yR); c.lineTo(ax + 26, yR); c.stroke();
          c.setLineDash([]);
          c.lineWidth = 2.6;
          c.beginPath(); c.moveTo(ax, yR); c.lineTo(ax, peakY); c.stroke();
          [[peakY, 1], [yR, -1]].forEach(function (p) {
            c.beginPath(); c.moveTo(ax, p[0]); c.lineTo(ax - 5, p[0] + 8 * p[1]);
            c.lineTo(ax + 5, p[0] + 8 * p[1]); c.closePath(); c.fillStyle = col; c.fill();
          });
          chip(c, ax + 46, (yR + peakY) / 2, txt, col === '#12a06a' ? '#5fd68a' : '#ffb3b3', 11);
          c.restore();
        }
        arrow(peakNo, st.on ? 'rgba(24,19,34,.45)' : '#ff5c5c', -34, '효소 없음');
        if (st.vis > 0.5) arrow(peakNow, '#12a06a', 40, '효소 있음');

        chip(c, gx + gw * 0.16, yR - 18, '반응물', '#fff8e6', 12);
        chip(c, gx + gw * 0.84, yP - 18, '생성물', '#fff8e6', 12);

        /* 반응물과 생성물의 에너지 차 — 변하지 않는다 */
        c.save();
        c.strokeStyle = 'rgba(24,19,34,.45)'; c.setLineDash([3, 4]); c.lineWidth = 1.4;
        c.beginPath(); c.moveTo(gx + gw * 0.06, yR); c.lineTo(gx + gw * 0.97, yR); c.stroke();
        c.beginPath(); c.moveTo(gx + gw * 0.06, yP); c.lineTo(gx + gw * 0.97, yP); c.stroke();
        c.restore();
        chip(c, gx + gw * 0.90, (yR + yP) / 2, '이 차이는 그대로', '#ffffff', 10.5);
        c.restore();

        /* 효소 — 쉴 때는 그래프 오른쪽 위, 넣으면 언덕 꼭대기에 앉는다 */
        var R = Math.max(18, Math.min(30, gh * .08));
        M.home = { x: gx + gw * 0.86, y: gy - gh * 0.86 };
        M.peak = { x: gx + gw * 0.50, y: peakNow - R - 6 };
        M.r = R;
        var pos = st.drag ? st.drag.p : (st.on ? M.peak : M.home);
        M.ex = pos.x; M.ey = pos.y;
        if (!st.on && !st.drag) {
          E.target(c, gx + gw * 0.50, peakNo - 10, R * 2.6, R * 2.2, t);
          var gp = E.ghost(t, M.home, { x: gx + gw * 0.50, y: peakNo - R - 6 });
          if (gp) { c.save(); c.globalAlpha = gp.a; drawEnzymeBlob(c, gp.x, gp.y, R); c.restore(); }
          E.grab(c, M.home.x, M.home.y, R, t);
        }
        var pk = popK(t - st.tPut);
        c.save(); c.translate(M.ex, M.ey); c.scale(pk, pk); c.translate(-M.ex, -M.ey);
        drawEnzymeBlob(c, M.ex, M.ey, R, !!st.drag);
        c.restore();
        chip(c, M.ex, M.ey + R + 16, st.on ? '효소 — 누르면 뺀다' : '효소', st.on ? '#5fd68a' : '#fff8e6', 11);
        E.hint(stage, st.on ? '효소가 들어 있습니다. 무엇이 그대로인지 보세요 (효소를 누르면 뺍니다)'
          : st.drag ? '언덕 꼭대기에 놓으세요' : '효소를 끌어 언덕 위에 올려 보세요');
      });

      function setOn(on) {
        st.on = on;
        if (st.sp) st.sp.stop();
        st.sp = E.spring(st.vis, on ? 1 : 0, function (v) { st.vis = v; }, { k: 180, d: 11, eps: .002 });
        st.tPut = st.tNow;
        E.beep(on ? 'snap' : 'whoosh'); E.kick();
        if (on) E.burst(M.peak.x, M.peak.y, '#5fd68a', 12, 2.4);
        E.toast(on ? '언덕이 낮아졌다. 넘을 수 있는 반응물이 늘어난다.' : '효소를 뺐다. 언덕이 도로 높다.', on ? 'good' : '');
      }
      /* 손맛 — 끌면 언덕 가까이에서 자석처럼 당기고, 놓으면 찰칵. 언덕 위의 효소를 누르면 빠진다 */
      E.drag(cv.cv, {
        start: function (ev) {
          var p = cv.pt(ev);
          if (M.ex == null || E.dist(p.x, p.y, M.ex, M.ey) > M.r + 14) return;
          if (st.on) { setOn(false); return; }
          st.drag = { p: p, near: 0 };
        },
        move: function (ev) {
          if (!st.drag) return;
          var p = cv.pt(ev);
          var near = M.peak && E.dist(p.x, p.y, M.peak.x, M.peak.y) < M.r * 2.4;
          if (near) p = { x: p.x + (M.peak.x - p.x) * .5, y: p.y + (M.peak.y - p.y) * .5 };
          if (near && !st.drag.near) { E.beep('tick'); E.buzz(8); }
          st.drag.near = near ? 1 : 0;
          st.drag.p = p;
        },
        end: function (ev) {
          if (!st.drag) return;
          var wasNear = st.drag.near; st.drag = null;
          if (wasNear) setOn(true);
          else E.toast('언덕 꼭대기에 올려라.', 'bad');
        }
      });

      var txt = E.el('div', { cls: 'card' });
      txt.innerHTML = '<h3>활성화에너지</h3>' +
        '<p>화학 반응이 일어나려면 반응물이 일정 크기 이상의 에너지를 가져야 합니다. ' +
        '그 <b>최소한의 에너지</b>가 활성화에너지입니다.</p>' +
        '<p>활성화에너지가 낮아지면 그 문턱을 넘을 수 있는 반응물의 수가 늘어나므로 ' +
        '<b>반응 속도가 빨라집니다.</b></p>' +
        '<p class="hl">효소는 활성화에너지를 낮춘다. 반응물과 생성물의 에너지는 변하지 않는다.</p>' +
        '<p class="muted">그래서 효소는 <b>일어날 수 없는 반응을 일어나게 하지는 못합니다.</b> ' +
        '이미 일어날 수 있는 반응을 빠르게 할 뿐입니다.</p>';
      panel.appendChild(txt);
      E.quiz(panel, Q, sync);

      function sync() {
        var ok = !!(D._ans[Q.id] && D._ans[Q.id].ok);
        if (ok) E.note('활성화에너지', '효소는 활성화에너지를 낮춘다. 반응물과 생성물이 가진 에너지, ' +
                       '그리고 그 차이는 변하지 않는다.');
        E.gate(ok, '확인 문항을 풀어야 넘어갑니다');
      }
      sync();
    }
  };
}

/* ================================================================
   장면 7. 효소기질복합체와 기질특이성
   ================================================================ */
function scESC() {
  var STEPS = [
    '활성부위에 들어맞는 기질과 결합한다',
    '효소기질복합체를 형성한다',
    '활성화에너지가 낮아진다',
    '기질이 생성물로 전환된다',
    '효소와 생성물이 분리되고, 효소는 다시 쓰인다'
  ];
  var Q = {
    id: 'q_spec',
    q: '한 가지 효소가 <b>정해진 기질하고만</b> 반응하는 성질을 무엇이라 하며, 그 까닭은 무엇인가?',
    opts: [
      '기질특이성 — 활성부위와 입체 구조가 들어맞는 기질과만 결합하기 때문',
      '기질특이성 — 효소가 기질보다 크기가 커서 큰 분자만 잡을 수 있기 때문',
      '최적조건 — 기질마다 반응이 가장 잘 되는 온도가 다르기 때문',
      '효소억제 — 다른 기질이 활성부위에 먼저 결합해 자리를 막기 때문'
    ],
    a: 0,
    why: '효소가 특정 기질과만 결합하여 촉매 작용을 하는 특성을 <b>기질특이성</b>이라 합니다. ' +
         '까닭은 <b>활성부위와 입체 구조가 들어맞는 기질과만 결합</b>하기 때문입니다. ' +
         '자물쇠와 열쇠의 관계에 비유해 설명합니다. 그래서 우리 몸에는 <b>효소의 종류가 아주 많습니다.</b>',
    bad: {
      1: '크기가 아니라 <b>입체 구조가 들어맞는가</b>가 기준입니다. 작은 기질이라도 모양이 맞지 않으면 결합하지 않습니다.',
      2: '최적온도는 온도 조건에 관한 것입니다. 여기서 묻는 것은 기질을 가려서 결합하는 성질입니다.',
      3: '효소억제제가 활성부위에 결합하는 것은 맞지만, 그것은 반응을 방해하는 별개의 현상입니다.'
    }
  };
  return {
    id: 'esc', chap: '원리', name: '효소기질복합체',
    guide: '기질 세 개 가운데 <span class="hl">활성부위에 들어맞는 것 하나</span>를 끌어다 끼워 보세요. ' +
           '맞는 것만 결합합니다.',
    mount: function (stage, panel) {
      var st = { drag: null, fit: D.escFit ? 1 : 0, step: D.escFit ? 5 : 0, anim: 0,
                 fly: null, back: null, fitAt: null, stepAt: null, tNow: 0 };
      /* 기질 세 종류. shape 0 이 활성부위에 맞는 모양이다 */
      var subs = [
        { shape: 0, x: -190, y: 96, name: '기질 가', ok: true },
        { shape: 1, x: 0, y: 108, name: '기질 나', ok: false },
        { shape: 2, x: 190, y: 96, name: '기질 다', ok: false }
      ];
      var picked = { i: -1, dx: 0, dy: 0 };

      var cv = E.canvas(stage);

      /* 기질 알약 색 — 셋이 같은 색이어야 색으로 답이 안 샌다 */
      var SUB_COL = '#ffd23f';
      function drawSub(c, x, y, s, shape, k) { drawPiece(c, x, y, s, shape, SUB_COL, k); }

      cv.on(function (c, w, h, t) {
        E.dbg = { n: 'esc', st: st.step };
        var s = Math.min(w / 620, h / 420) * 1.05;
        var cx = w / 2, cy = h / 2 - 10 * s;
        st.tNow = t;

        /* 효소 — 납작한 초록 덩어리에 굵은 검은 선. 그림자 한 겹 */
        c.save();
        c.translate(5, 5); enzymePath(c, cx, cy, s); c.fillStyle = INK; c.fill(); c.restore();
        enzymePath(c, cx, cy, s);
        c.fillStyle = st.step >= 2 ? '#5fd68a' : '#a9dcff';
        c.fill();
        c.strokeStyle = INK; c.lineWidth = 3; c.lineJoin = 'round'; c.stroke();
        /* 활성부위 홈 — 자물쇠 구멍처럼 어둡게 */
        if (st.step < 1) {
          subPath(c, cx, cy - 30 * s, s, 0);
          c.fillStyle = 'rgba(24,19,34,.18)'; c.fill();
        }
        chip(c, cx, cy + 20 * s, '효소', '#fff8e6', 13);
        if (st.step < 1) chip(c, cx - 84 * s, cy - 58 * s, '활성부위', '#ffffff', 11.5);

        /* 결합한 기질 또는 생성물 — 막 끼운 것은 스프링으로 자리에 들어가며 0.3초 커진다 */
        if (st.step >= 1 && st.step < 4) {
          var fx = cx, fy = cy - 30 * s;
          if (st.fly) { fx = st.fly.x; fy = st.fly.y; }
          drawSub(c, fx, fy, s, 0, popK(t - (st.fitAt == null ? -9 : st.fitAt)));
          label(c, fx, fy, '기질', INK, 11 * s);
        }
        if (st.step === 4 || st.step === 5) {
          var off = st.step === 5 ? 70 * s : 30 * s;
          var pk = popK(t - (st.stepAt == null ? -9 : st.stepAt));
          [-1, 1].forEach(function (k) {
            c.save();
            c.translate(cx + k * off, cy - 46 * s); c.scale(pk, pk);
            c.beginPath();
            c.ellipse(0, 0, 15 * s, 12 * s, 0, 0, Math.PI * 2);
            c.fillStyle = '#4cc9f0'; c.fill();
            c.strokeStyle = INK; c.lineWidth = 2.6; c.stroke();
            c.restore();
          });
          chip(c, cx, cy - 76 * s, '생성물', '#ffffff', 11.5);
        }

        /* 아직 고르지 않은 기질들 */
        if (st.step < 1) {
          subs.forEach(function (sb, i) {
            var x = cx + sb.x * s * 0.72, y = cy + sb.y * s * 0.72, k = 1;
            if (picked.i === i) {
              x = picked.px; y = picked.py; k = 1.12;
              /* 자석 — 활성부위 가까이면 당겨 온다 */
              var dx = cx - x, dy = (cy - 30 * s) - y, d = Math.sqrt(dx * dx + dy * dy);
              if (d < 60 * s) { x += dx * 0.4; y += dy * 0.4; }
            } else if (st.back && st.back.i === i) { x = st.back.x; y = st.back.y; }
            drawSub(c, x, y, s, sb.shape, k);
            if (picked.i !== i) chip(c, x, y + 54 * s, sb.name, '#ffffff', 11);
          });
          /* ④ **셋 다** 끌 수 있다고 표시한다. 맞는 것 하나에만 표시하면 답을 흘린다.
             유령도 안 띄운다 — 어느 것이 들어맞는지는 학생이 끌어 봐야 안다. */
          if (picked.i < 0) {
            E.target(c, cx, cy - 30 * s, 62 * s, 36 * s, t);
            subs.forEach(function (sb) {
              E.grab(c, cx + sb.x * s * 0.72, cy + sb.y * s * 0.72, 30 * s, t);
            });
          }
        }

        var msg = ['기질 세 개를 하나씩 활성부위에 끌어다 대 보세요',
                   STEPS[0], STEPS[1], STEPS[2], STEPS[3], STEPS[4]][st.step];
        E.hint(stage, msg);
      });

      /* 끌기. E.drag 는 좌표가 아니라 포인터 이벤트를 넘겨주므로 cv.pt 로 바꾼다.
         손맛 — 맞는 기질은 놓으면 스프링으로 홈에 들어가며 찰칵 + 무대가 툭 + 파편.
         안 맞는 기질은 흔들리며(사수의 bad 풍선) 제자리로 튕겨 돌아간다.
         논리값 st.step 은 즉시, 그림(st.fly, st.back)만 따라온다. */
      E.drag(cv.cv, {
        start: function (ev) {
          var p = cv.pt(ev);
          if (st.step >= 1) return;
          var w = cv.cv.clientWidth, h = cv.cv.clientHeight;
          var s = Math.min(w / 620, h / 420) * 1.05;
          var cx = w / 2, cy = h / 2 - 10 * s;
          for (var i = 0; i < subs.length; i++) {
            var x = cx + subs[i].x * s * 0.72, y = cy + subs[i].y * s * 0.72;
            if (Math.abs(p.x - x) < 34 * s && Math.abs(p.y - y) < 26 * s) {
              if (st.back && st.back.sp) { st.back.sp.stop(); st.back = null; }
              picked = { i: i, px: p.x, py: p.y };
              E.beep('pick');
              return;
            }
          }
        },
        move: function (ev) {
          if (picked.i >= 0) { var q = cv.pt(ev); picked.px = q.x; picked.py = q.y; }
        },
        end: function (ev) {
          var p = cv.pt(ev);
          if (picked.i < 0) return;
          var i = picked.i;
          var w = cv.cv.clientWidth, h = cv.cv.clientHeight;
          var s = Math.min(w / 620, h / 420) * 1.05;
          var cx = w / 2, cy = h / 2 - 10 * s;
          var near = Math.abs(p.x - cx) < 60 * s && Math.abs(p.y - (cy - 30 * s)) < 56 * s;
          picked = { i: -1 };
          if (!near) return;
          var hx = cx + subs[i].x * s * 0.72, hy = cy + subs[i].y * s * 0.72;
          if (subs[i].ok) {
            st.step = 1; D.escFit = 1; E.save();
            st.fitAt = st.tNow;
            /* 놓은 자리에서 홈까지 스프링으로 들어간다 */
            var fx0 = p.x, fy0 = p.y, tx = cx, ty = cy - 30 * s;
            st.fly = { x: fx0, y: fy0 };
            E.spring(0, 1, function (v, done) {
              st.fly = done ? null : { x: fx0 + (tx - fx0) * v, y: fy0 + (ty - fy0) * v };
            }, { k: 320, d: 12, eps: .003 });
            E.beep('snap'); E.kick(); E.buzz(20);
            E.burst(tx, ty, null, 12, 2.4);
            E.pop(cx, cy - 90 * s, '찰칵!', '#127a5a', true);
            E.toast('들어맞았다. 열쇠와 자물쇠다.', 'good');
            drawSteps(); sync();
          } else {
            /* 튕겨 돌아간다 */
            var bx0 = p.x, by0 = p.y, back = { i: i, x: bx0, y: by0 };
            st.back = back;
            back.sp = E.spring(0, 1, function (v, done) {
              back.x = bx0 + (hx - bx0) * v; back.y = by0 + (hy - by0) * v;
              if (done && st.back === back) st.back = null;
            }, { k: 200, d: 9, eps: .003 });
            E.beep('thud'); E.buzz(40);
            E.toast('모양이 안 맞는다. 결합하지 않는다. 다른 것을 대 봐라.', 'bad');
          }
        }
      });

      var stepBox = E.el('div', { cls: 'card' });
      panel.appendChild(stepBox);
      var nextBtn;
      function drawSteps() {
        stepBox.innerHTML = '<h3>반응의 다섯 단계</h3>';
        var ul = E.el('div');
        STEPS.forEach(function (s, i) {
          var done = st.step > i;
          var row = E.el('div', { cls: 'kv' });
          row.innerHTML = '<span>' + (i + 1) + '</span><b style="color:' +
            (done ? '#8ff0c0' : 'rgba(170,200,230,.6)') + '">' + s + '</b>';
          ul.appendChild(row);
        });
        stepBox.appendChild(ul);
        if (st.step >= 1 && st.step < 5) {
          nextBtn = E.el('button', { cls: 'btn', type: 'button', text: '다음 단계 보기' });
          nextBtn.addEventListener('click', function () {
            st.step = Math.min(5, st.step + 1);
            st.stepAt = st.tNow;
            E.beep(st.step >= 4 ? 'snap' : 'tick'); if (st.step >= 4) E.kick();
            drawSteps(); sync();
          });
          stepBox.appendChild(E.el('div', { cls: 'btnrow' }, nextBtn));
        } else if (st.step >= 5) {
          stepBox.appendChild(E.el('p', { cls: 'hl',
            html: '효소는 생성물과 분리된 뒤 <b>그대로 남아</b> 다시 쓰입니다. 앞 장면에서 본 그대로입니다.' }));
        }
      }
      drawSteps();

      var txt = E.el('div', { cls: 'card' });
      txt.innerHTML = '<h3>용어</h3>' +
        '<div class="kv"><span>기질</span><b>효소와 결합하는 반응물</b></div>' +
        '<div class="kv"><span>활성부위</span><b>기질이 결합하는 자리</b></div>' +
        '<div class="kv"><span>효소기질복합체</span><b>효소와 기질이 결합한 상태</b></div>' +
        '<p class="muted" style="margin-top:8px">효소의 주성분은 단백질입니다. ' +
        '펩신처럼 단백질로만 이루어진 효소도 있고, 탈수소효소처럼 <b>비단백질 성분(보조인자)</b>이 있어야 ' +
        '작용하는 효소도 있습니다. 이때 전체를 <b>전효소</b>, 단백질 부분을 <b>주효소</b>라고 합니다.</p>';
      panel.appendChild(txt);
      E.quiz(panel, Q, sync);

      function sync() {
        var qok = !!(D._ans[Q.id] && D._ans[Q.id].ok);
        var done = st.step >= 5;
        if (done && qok) {
          E.note('효소기질복합체', STEPS.map(function (s, i) { return (i + 1) + '. ' + s; }).join('\n') +
                 '\n기질특이성 — 활성부위와 입체 구조가 들어맞는 기질과만 결합한다');
        }
        E.gate(done && qok,
               !done ? '맞는 기질을 끼우고 다섯 단계를 끝까지 보세요' : '확인 문항을 풀어야 넘어갑니다');
      }
      sync();
    }
  };
}

/* ================================================================
   장면 8. 온도
   ================================================================ */
function scTemp() {
  var TARGETS = [0, 20, 37, 60, 80];
  var Q = {
    id: 'q_temp',
    q: '효소와 무기 촉매의 <b>온도에 따른 그래프 모양이 다른</b> 까닭으로 가장 알맞은 것은?',
    opts: [
      '무기 촉매는 활성화에너지를 낮추지 않기 때문이다',
      '효소는 주성분이 단백질이라 높은 온도에서 입체 구조가 변하기 때문이다',
      '효소는 온도가 높아져도 분자 운동이 빨라지지 않기 때문이다',
      '무기 촉매는 반응에서 소모되므로 온도의 영향을 받지 않기 때문이다'
    ],
    a: 1,
    why: '온도가 오르면 분자 운동이 활발해져 반응이 빨라지는 것은 <b>둘 다 같습니다.</b> ' +
         '다른 점은 효소가 <b>단백질</b>이라는 데 있습니다. 최적온도를 넘어서면 단백질의 입체 구조가 변해 ' +
         '활성부위가 망가지고, 그래서 반응 속도가 <b>급격히 떨어집니다.</b> ' +
         '무기 촉매는 단백질이 아니므로 그런 일이 없어 온도가 오를수록 계속 빨라집니다.',
    bad: {
      0: '무기 촉매도 촉매이므로 활성화에너지를 낮춥니다. 그래서 반응이 빨라진 것입니다.',
      2: '효소가 든 시험관에서도 온도가 오르면 분자 운동은 빨라집니다. 최적온도까지는 실제로 반응이 빨라집니다.',
      3: '촉매는 효소든 무기 촉매든 반응에서 소모되지 않습니다.'
    }
  };
  return {
    id: 'temp', chap: '탐구 2 조건', name: '온도의 영향',
    guide: '그래프 위를 <span class="hl">끌어 온도를 맞추고, 톡 눌러</span> 다섯 온도에 점을 찍으세요. ' +
           '같은 조건의 무기 촉매도 함께 잽니다.',
    mount: function (stage, panel) {
      /* st.T 논리값(정수 ℃), st.vis 그림값, st.at 찍은 시각 */
      var st = { T: 37, vis: 37, at: {}, tNow: 0 };
      var M = {};
      var cv = E.canvas(stage);
      cv.on(function (c, w, h, t) {
        E.dbg = { n: 'temp', M: M, st: st.T };
        st.tNow = t;
        var half = w / 2;
        /* 왼쪽 — 시험관 두 개 */
        var th = Math.min(h * 0.42, 165), tw = Math.min(46, w * 0.075);
        var ty = Math.min(h / 2 - th * 0.72, h - th - 62);
        var narrow = w < 620;
        var lx1 = half * (narrow ? 0.27 : 0.38), lx2 = half * (narrow ? 0.79 : 0.72);
        var lw = (lx2 - lx1) - 6;
        var Tv = E.clamp(Math.round(st.vis), 0, 80);
        drawTube(c, { x: lx1, y: ty, w: tw, h: th, fill: '#a9dcff',
                      chunk: '#f2e2a8', rate: actTemp(st.T), t: t,
                      label: '생감자 (효소)', tag: Tv + ' ℃', hi: true, lw: lw });
        drawTube(c, { x: lx2, y: ty, w: tw, h: th, fill: '#a9dcff',
                      chunk: '#3f4250', rate: actTempMineral(st.T), t: t,
                      label: '이산화망가니즈', tag: Tv + ' ℃', lw: lw });

        /* 오른쪽 — 그래프 */
        c.save();
        c.translate(half, 0);
        var A = axes(c, half, h, { xl: '온도 (℃)', yl: '반응 속도 (상댓값)', x0: 0, x1: 80, y0: 0, y1: 1 });
        M.g = { ox: half, gx: A.gx, gw: A.gw, gy: A.gy, gh: A.gh, x0: 0, x1: 80 };
        /* 눈금 */
        [0, 20, 40, 60, 80].forEach(function (v) {
          label(c, A.X(v), A.gy + 14, String(v), INK, 10.5);
        });
        curve(c, A, actTempMineral, 0, 80, 'rgba(24,19,34,.55)', 2.4, [7, 5]);
        curve(c, A, actTemp, 0, 80, '#12a06a', 4);
        /* 최적온도 표시 */
        c.save();
        c.strokeStyle = 'rgba(18,160,106,.6)'; c.setLineDash([4, 4]); c.lineWidth = 1.6;
        c.beginPath(); c.moveTo(A.X(T_OPT), A.gy); c.lineTo(A.X(T_OPT), A.Y(1)); c.stroke();
        c.restore();
        chip(c, A.X(T_OPT), Math.max(12, A.Y(1) - 42), '최적온도 ' + T_OPT + ' ℃', '#5fd68a', 10.5);
        /* 찍은 점 — 깃발 + 점. 막 찍은 것은 0.3초 커졌다 제자리 */
        TARGETS.forEach(function (v) {
          if (D.tempPts[v] == null) return;
          var k = popK(t - (st.at[v] == null ? -9 : st.at[v]));
          flag(c, A.X(v), A.Y(actTemp(v)), A.gy, v, k, '#12a06a');
          dot(c, A.X(v), A.Y(actTempMineral(v)), '#ffffff', 5, k);
          dot(c, A.X(v), A.Y(actTemp(v)), '#5fd68a', 6, k);
        });
        /* 지금 온도 — 노란 점이 곡선을 따라 미끄러진다 */
        var vx = A.X(st.vis), vy = A.Y(actTemp(st.vis));
        c.save(); c.strokeStyle = 'rgba(24,19,34,.35)'; c.setLineDash([3, 4]); c.lineWidth = 1.4;
        c.beginPath(); c.moveTo(vx, A.gy); c.lineTo(vx, vy); c.stroke(); c.restore();
        dot(c, vx, vy, '#ffd23f', 7.5);
        /* 지금 값 칩 — 점이 위쪽에 있으면 아래에, 아니면 위에. 위 칩들과 겹치지 않게 */
        chip(c, Math.max(A.gx + 26, Math.min(A.gx + A.gw - 26, vx)), vy < A.gy - A.gh + 44 ? vy + 26 : vy - 24, Tv + ' ℃', '#ffd23f', 11);
        c.restore();
        /* 범례는 시험관 쪽 아래에 — 그래프 위쪽은 깃발과 칩이 차지한다 */
        chip(c, half / 2, h - 14, narrow ? '초록 효소 / 점선 무기 촉매' : '초록 = 효소 / 점선 = 무기 촉매', '#ffffff', 10.5, half - 12);

        var n = TARGETS.filter(function (v) { return D.tempPts[v]; }).length;
        var nextT = TARGETS.filter(function (v) { return !D.tempPts[v]; })[0];
        E.hint(stage, n < TARGETS.length
          ? ('그래프를 끌어 ' + nextT + ' ℃ 에 맞추고 톡 눌러 점을 찍으세요 (' + n + '/5)')
          : '다섯 점을 다 찍었습니다. 확인 문항을 푸세요');
      });

      var sl = slider(panel, {
        id: 'tp', title: '수조 온도', unitLabel: '온도', min: 0, max: 80, step: 1, value: st.T,
        fmt: function (v) { return v + ' ℃'; },
        help: '무대 그래프를 끌어도 되고, 여기서 맞춰 「이 온도로 측정」을 눌러도 됩니다. 0, 20, 37, 60, 80 ℃ 다섯 곳.',
        onInput: function (v) { st.T = v; st.vis = v; upd(); }
      });

      var box = E.el('div', { cls: 'card' });
      box.innerHTML = '<h3>측정</h3>';
      var btn = E.el('button', { cls: 'btn', type: 'button', text: '이 온도로 측정' });
      var tbl = E.el('div');
      function measure(near, px) {
        var fresh = D.tempPts[near] == null;
        D.tempPts[near] = { e: actTemp(near), m: actTempMineral(near) }; E.save();
        st.at[near] = st.tNow;
        E.beep('pick'); E.buzz(14);
        if (px != null && M.g) E.ripple(px, M.g.gy, 'rgba(18,160,106,.9)');
        var n = TARGETS.filter(function (v) { return D.tempPts[v]; }).length;
        if (n === TARGETS.length && fresh) {
          E.beep('good');
          if (M.g) E.pop(M.g.ox + M.g.gx + M.g.gw * 0.5, M.g.gy - M.g.gh * 0.5, '갈렸다!', '#c2410c', true);
          E.toast('다섯 점이 갈렸다. 효소는 꺾이고 무기 촉매는 계속 오른다.', 'good');
        } else {
          E.toast('찍었다. ' + near + ' ℃.', 'good');
        }
        upd(); sync();
      }
      graphHand(cv, st, {
        M: function () { return M.g; },
        area: function (p, g) { return p.x > g.ox + g.gx - 20 && p.x < g.ox + g.gx + g.gw + 20 && p.y > g.gy - g.gh - 30 && p.y < g.gy + 30; },
        get: function () { return st.T; },
        set: function (v) { st.T = v; sl.sync(v); upd(); },
        min: 0, max: 80, step: 1, targets: TARGETS,
        measure: measure,
        miss: '0, 20, 37, 60, 80 ℃ 에서 찍어라. 다른 자리는 점이 안 된다.'
      });
      btn.addEventListener('click', function () {
        var near = TARGETS.filter(function (v) { return Math.abs(v - st.T) <= 1; })[0];
        if (near == null) { E.toast('0, 20, 37, 60, 80 ℃ 중 하나에 맞춰라.', 'bad'); return; }
        measure(near, null);
      });
      box.appendChild(E.el('div', { cls: 'btnrow' }, btn));
      box.appendChild(tbl);
      panel.appendChild(box);

      function upd() {
        var rows = TARGETS.map(function (v) {
          var p = D.tempPts[v];
          return '<tr><td>' + v + ' ℃</td><td>' + (p ? fmt(p.e) : '-') +
                 '</td><td>' + (p ? fmt(p.m) : '-') + '</td></tr>';
        }).join('');
        tbl.innerHTML = '<table class="dat"><tr><th>온도</th><th>효소</th><th>무기 촉매</th></tr>' +
          rows + '</table>';
      }
      upd();

      var txt = E.el('div', { cls: 'card' });
      txt.innerHTML = '<h3>읽는 법</h3>' +
        '<p>온도가 오르면 분자 운동이 활발해져 반응이 빨라집니다. 여기까지는 둘이 같습니다.</p>' +
        '<p><b>최적온도</b>는 활성이 가장 높아 반응 속도가 최대가 될 때의 온도입니다. ' +
        '우리 몸의 효소는 대개 <b>35 ~ 40 ℃</b> 이고, 이를 넘으면 급격하게 느려집니다.</p>' +
        '<p class="muted">온천에 사는 세균처럼 최적온도가 80 ℃ 보다 높은 효소를 가진 생물도 있습니다.</p>';
      panel.appendChild(txt);
      E.quiz(panel, Q, sync);

      function sync() {
        var n = TARGETS.filter(function (v) { return D.tempPts[v]; }).length;
        var qok = !!(D._ans[Q.id] && D._ans[Q.id].ok);
        if (n === TARGETS.length && qok) {
          E.note('온도의 영향',
                 '효소는 37 ℃ 부근에서 가장 빠르고 그 위로는 급격히 느려진다(단백질의 변성).\n' +
                 '무기 촉매는 온도가 오를수록 계속 빨라진다.');
        }
        E.gate(n === TARGETS.length && qok,
               n < TARGETS.length ? ('다섯 온도 중 ' + n + '곳만 측정했습니다') : '확인 문항을 풀어야 넘어갑니다');
      }
      sync();
    }
  };
}

/* ================================================================
   장면 9. 변성은 되돌아오지 않는다
   ================================================================ */
function scDenat() {
  var Q = {
    id: 'q_denat',
    q: '80 ℃ 까지 올렸다가 다시 37 ℃ 로 내렸다. 효소를 넣은 쪽에서 <b>기포가 다시 나지 않은</b> 까닭은?',
    opts: [
      '과산화수소가 높은 온도에서 모두 분해되어 없어졌기 때문이다',
      '온도를 내리는 동안 효소가 시험관 벽에 달라붙었기 때문이다',
      '변성된 단백질의 입체 구조는 온도를 내려도 원래대로 돌아오지 않기 때문이다',
      '37 ℃ 는 이 효소의 최적온도가 아니기 때문이다'
    ],
    a: 2,
    why: '높은 온도에서 단백질의 입체 구조가 한번 변하면, 온도를 다시 낮추어도 <b>원래 구조로 돌아오지 않습니다.</b> ' +
         '활성부위가 망가진 채로 남기 때문에 기질과 결합하지 못합니다. ' +
         '삶은 감자에서 기포가 나지 않았던 것과 같은 까닭입니다. ' +
         '반면 무기 촉매는 단백질이 아니므로 온도를 내리면 그 온도에 맞는 속도로 <b>그대로 돌아옵니다.</b>',
    bad: {
      0: '과산화수소는 반응이 멈춘 뒤에도 남아 있습니다. 실제로 무기 촉매 쪽에서는 온도를 내린 뒤에도 기포가 났습니다.',
      1: '효소가 벽에 붙는 것이 아니라 <b>구조 자체가 변한 것</b>입니다.',
      3: '37 ℃ 는 이 효소의 최적온도입니다. 그런데도 반응이 없다는 것이 요점입니다.'
    }
  };
  return {
    id: 'denat', chap: '탐구 2 조건', name: '되돌려 보기',
    guide: '온도를 <b>80 ℃ 로 올렸다가</b> 다시 <b>37 ℃ 로 내려</b> 보세요. ' +
           '<span class="hl">효소 쪽과 무기 촉매 쪽이 어떻게 다른지</span> 보는 것이 목적입니다.',
    mount: function (stage, panel) {
      /* st.T 논리값, st.vis 온도계 그림값(스프링) */
      var st = { T: 37, vis: 37, ruined: !!D.denat.up, sp: null };
      var cv = E.canvas(stage);
      cv.on(function (c, w, h, t) {
        E.dbg = { n: 'denat', st: st };
        var th = Math.min(h * 0.46, 190), tw = Math.min(54, w * 0.10);
        var ty = Math.min(h / 2 - th * 0.66, h - th - 62);
        var eRate = st.ruined ? 0 : actTemp(st.T);
        var Tv = Math.round(st.vis);
        drawTube(c, { x: w * 0.34, y: ty, w: tw, h: th, fill: '#a9dcff',
                      chunk: st.ruined ? '#d3bf8f' : '#f2e2a8',
                      rate: eRate, t: t, label: '생감자 (효소)',
                      tag: st.ruined ? '변성됨' : (Tv + ' ℃'), hi: true, lw: w * 0.28 - 6 });
        drawTube(c, { x: w * 0.62, y: ty, w: tw, h: th, fill: '#a9dcff',
                      chunk: '#3f4250', rate: actTempMineral(st.T), t: t,
                      label: '이산화망가니즈', tag: Tv + ' ℃', lw: w * 0.28 - 6 });
        /* 온도계 — 두 시험관 사이. 붉은 기둥이 스프링으로 오르내린다 */
        var mx = w * 0.48, top = ty + 6, bot = ty + th - 10, len = Math.max(12, bot - top);
        c.save();
        rr(c, mx - 7, top - 4, 14, len + 8, 7); c.fillStyle = '#ffffff'; c.fill();
        c.lineWidth = 2.6; c.strokeStyle = INK; c.stroke();
        var fillH = len * E.clamp(st.vis / 100, 0, 1);
        rr(c, mx - 3.5, bot - fillH, 7, fillH + 2, 3); c.fillStyle = st.vis > 60 ? '#ff5c5c' : '#ff9f43'; c.fill();
        c.beginPath(); c.arc(mx, bot + 4, 9, 0, 7); c.fillStyle = st.vis > 60 ? '#ff5c5c' : '#ff9f43'; c.fill(); c.stroke();
        c.restore();
        chip(c, mx, Math.max(14, top - 22), '수조 ' + Tv + ' ℃', st.vis > 60 ? '#ff5c5c' : '#ffd23f', 11.5);
        E.hint(stage, st.ruined && st.T <= 40
                ? '온도를 내렸는데도 효소 쪽만 조용합니다'
                : (st.ruined ? '효소가 변성되었습니다. 다시 37 ℃ 로 내려 보세요'
                             : (D.denat.up ? '두 시험관 모두 반응하고 있습니다' : '아래 단추로 80 ℃ 로 올려 보세요')));
      });

      var box = E.el('div', { cls: 'card' });
      box.innerHTML = '<h3>온도 바꾸기</h3>';
      var b1 = E.el('button', { cls: 'btn', type: 'button', text: '80 ℃ 로 올리기' });
      var b2 = E.el('button', { cls: 'btn ghost', type: 'button', text: '다시 37 ℃ 로 내리기' });
      var log = E.el('div', { cls: 'muted' });
      function slide(to) {
        if (st.sp) st.sp.stop();
        st.sp = E.spring(st.vis, to, function (v) { st.vis = v; }, { k: 120, d: 12, eps: .01 });
      }
      b1.addEventListener('click', function () {
        st.T = 80; st.ruined = true;
        D.denat.up = 1; E.save();
        slide(80);
        /* 여기서 bad 를 쓰면 시킨 대로 했는데 실수로 세어진다. 소리만 무겁게 */
        E.beep('thud'); E.shake(); E.buzz(30);
        E.toast('80 ℃ 다. 효소 쪽이 멎었다. 이제 식혀 봐라.', '');
        draw();
      });
      b2.addEventListener('click', function () {
        if (!D.denat.up) { E.toast('먼저 80 ℃ 로 올려라.', 'bad'); return; }
        st.T = 37;
        D.denat.down = 1; E.save();
        slide(37);
        E.beep('whoosh'); E.kick();
        E.toast('37 ℃ 다. 무기 촉매는 돌아왔고, 효소 쪽은 그대로다.', '');
        draw();
      });
      box.appendChild(E.el('div', { cls: 'btnrow' }, b1, b2));
      box.appendChild(log);
      panel.appendChild(box);

      function draw() {
        log.innerHTML =
          '<div class="kv"><span>80 ℃ 로 올림</span><b>' + (D.denat.up ? '했음' : '아직') + '</b></div>' +
          '<div class="kv"><span>37 ℃ 로 내림</span><b>' + (D.denat.down ? '했음' : '아직') + '</b></div>';
        sync();
      }
      draw();

      var txt = E.el('div', { cls: 'card' });
      txt.innerHTML = '<h3>낮은 온도는 다르다</h3>' +
        '<p>낮은 온도에서는 분자 운동이 느려 반응이 느릴 뿐, <b>구조가 망가진 것은 아닙니다.</b> ' +
        '그래서 온도를 다시 올리면 활성이 <b>돌아옵니다.</b></p>' +
        '<p class="hl">높은 온도의 변성은 되돌아오지 않고, 낮은 온도의 둔화는 되돌아온다.</p>';
      panel.appendChild(txt);
      E.quiz(panel, Q, sync);

      function sync() {
        var qok = !!(D._ans[Q.id] && D._ans[Q.id].ok);
        var did = D.denat.up && D.denat.down;
        if (did && qok) {
          E.note('변성의 비가역성',
                 '80 ℃ 로 올렸다가 37 ℃ 로 내려도 효소 쪽은 반응하지 않았다. ' +
                 '변성된 단백질의 입체 구조는 원래대로 돌아오지 않는다. ' +
                 '무기 촉매는 온도를 내리면 그 온도에 맞는 속도로 돌아온다.');
        }
        E.gate(!!(did && qok), did ? '확인 문항을 풀어야 넘어갑니다' : '80 ℃ 로 올렸다가 37 ℃ 로 내려 보세요');
      }
    }
  };
}

/* ================================================================
   장면 10. pH
   ================================================================ */
function scPH() {
  var TARGETS = [3, 5, 7, 9, 11];
  var Q = {
    id: 'q_ph',
    q: '위 세 곡선에서 알 수 있는 것으로 <b>옳은 것</b>은?',
    opts: [
      '효소는 산성일수록 잘 작용한다',
      '효소마다 활성이 가장 높은 pH 가 따로 있다',
      '모든 효소는 pH 7 에서 활성이 가장 높다',
      'pH 가 달라져도 효소의 활성은 거의 변하지 않는다'
    ],
    a: 1,
    why: '효소마다 <b>최적 pH</b>가 따로 있습니다. 대부분의 효소는 <b>pH 6 ~ 8</b> 에서 활성이 가장 높지만, ' +
         '위에서 작용하는 <b>펩신은 pH 2</b> 처럼 강한 산성에서 가장 잘 작용합니다. ' +
         '효소가 실제로 일하는 자리의 환경에 맞춰져 있는 것입니다. ' +
         '최적 pH 를 벗어나면 단백질의 구조가 변해 활성이 떨어집니다.',
    bad: {
      0: '펩신은 산성에서 잘 작용하지만, 트립신은 오히려 염기성 쪽에서 가장 잘 작용합니다.',
      2: '카탈레이스는 pH 7 부근이 맞지만 펩신은 pH 2 입니다. 곡선의 봉우리 위치가 서로 다릅니다.',
      3: '세 곡선 모두 봉우리에서 멀어질수록 뚝 떨어집니다. pH 의 영향을 크게 받습니다.'
    }
  };
  return {
    id: 'ph', chap: '탐구 2 조건', name: 'pH의 영향',
    guide: '그래프 위를 <span class="hl">끌어 pH 를 맞추고, 톡 눌러</span> 다섯 곳에 점을 찍으세요. ' +
           '그래프에는 다른 효소 두 가지도 함께 그려집니다.',
    mount: function (stage, panel) {
      var st = { pH: 7, vis: 7, at: {}, tNow: 0 };
      var M = {};
      var cv = E.canvas(stage);
      cv.on(function (c, w, h, t) {
        E.dbg = { n: 'ph', M: M, st: st.pH };
        st.tNow = t;
        var half = w / 2;
        var th = Math.min(h * 0.42, 165), tw = Math.min(50, w * 0.085);
        var ty = Math.min(h / 2 - th * 0.72, h - th - 62);
        var pv = E.clamp(Math.round(st.vis), 1, 11);
        drawTube(c, { x: half * 0.55, y: ty, w: tw, h: th,
                      fill: pv < 5 ? '#ffc4b3' : (pv > 9 ? '#c3c9ff' : '#a9dcff'),
                      chunk: '#f2e2a8', rate: actPH(st.pH), t: t,
                      label: '생감자 (카탈레이스)', tag: 'pH ' + pv, hi: true, lw: half - 12 });

        c.save(); c.translate(half, 0);
        var A = axes(c, half, h, { xl: 'pH', yl: '반응 속도 (상댓값)', x0: 1, x1: 11, y0: 0, y1: 1 });
        M.g = { ox: half, gx: A.gx, gw: A.gw, gy: A.gy, gh: A.gh, x0: 1, x1: 11 };
        [1, 3, 5, 7, 9, 11].forEach(function (v) {
          label(c, A.X(v), A.gy + 14, String(v), INK, 10.5);
        });
        curve(c, A, function (p) { return actPH(p, 2, 1.0); }, 1, 11, '#ff5c5c', 2.6, [7, 5]);
        curve(c, A, function (p) { return actPH(p, 8, 1.2); }, 1, 11, '#4c7cf0', 2.6, [7, 5]);
        curve(c, A, function (p) { return actPH(p, 7, 1.3); }, 1, 11, '#12a06a', 4);
        /* 좁은 화면(폰)에서는 그래프가 80px 남짓이라 이름만 짧게, 카탈레이스 칩은 뺀다(시험관 이름표에 있다) */
        var narrow = half < 260;
        chip(c, A.X(2) + (narrow ? 6 : 12), Math.max(12, A.Y(1) - 40), narrow ? '펩신' : '펩신 pH 2', '#ffb3b3', 10.5);
        chip(c, A.X(9) + (narrow ? -2 : 6), Math.max(12, A.Y(1) - 40), narrow ? '트립신' : '트립신 pH 8', '#c3c9ff', 10.5);
        if (!narrow) chip(c, A.X(7) - 40, A.Y(0.62), '카탈레이스', '#5fd68a', 10.5);
        TARGETS.forEach(function (v) {
          if (D.phPts[v] == null) return;
          var k = popK(t - (st.at[v] == null ? -9 : st.at[v]));
          flag(c, A.X(v), A.Y(actPH(v)), A.gy, v, k, '#12a06a');
          dot(c, A.X(v), A.Y(actPH(v)), '#5fd68a', 6, k);
        });
        var vx = A.X(st.vis), vy = A.Y(actPH(st.vis));
        c.save(); c.strokeStyle = 'rgba(24,19,34,.35)'; c.setLineDash([3, 4]); c.lineWidth = 1.4;
        c.beginPath(); c.moveTo(vx, A.gy); c.lineTo(vx, vy); c.stroke(); c.restore();
        dot(c, vx, vy, '#ffd23f', 7.5);
        chip(c, Math.max(A.gx + 26, Math.min(A.gx + A.gw - 26, vx)), vy < A.gy - A.gh + 44 ? vy + 26 : vy - 24, 'pH ' + pv, '#ffd23f', 11);
        c.restore();

        var n = TARGETS.filter(function (v) { return D.phPts[v] != null; }).length;
        var nextP = TARGETS.filter(function (v) { return D.phPts[v] == null; })[0];
        E.hint(stage, n < TARGETS.length
          ? ('그래프를 끌어 pH ' + nextP + ' 에 맞추고 톡 눌러 점을 찍으세요 (' + n + '/5)')
          : '다섯 점을 다 찍었습니다. 확인 문항을 푸세요');
      });

      var sl = slider(panel, {
        id: 'ph', title: '완충 용액의 pH', unitLabel: 'pH', min: 1, max: 11, step: 1, value: st.pH,
        fmt: function (v) { return String(v); },
        help: '무대 그래프를 끌어도 되고, 여기서 맞춰 「이 pH 로 측정」을 눌러도 됩니다. pH 3, 5, 7, 9, 11 다섯 곳.',
        onInput: function (v) { st.pH = v; st.vis = v; upd(); }
      });

      var box = E.el('div', { cls: 'card' });
      box.innerHTML = '<h3>측정</h3>';
      var btn = E.el('button', { cls: 'btn', type: 'button', text: '이 pH 로 측정' });
      var tbl = E.el('div');
      function measure(v, px) {
        var fresh = D.phPts[v] == null;
        D.phPts[v] = actPH(v); E.save();
        st.at[v] = st.tNow;
        E.beep('pick'); E.buzz(14);
        if (px != null && M.g) E.ripple(px, M.g.gy, 'rgba(18,160,106,.9)');
        var n = TARGETS.filter(function (x) { return D.phPts[x] != null; }).length;
        if (n === TARGETS.length && fresh) {
          E.beep('good');
          if (M.g) E.pop(M.g.ox + M.g.gx + M.g.gw * 0.5, M.g.gy - M.g.gh * 0.5, '봉우리!', '#c2410c', true);
          E.toast('다섯 점이 봉우리를 그린다. pH 7 이 꼭대기다.', 'good');
        } else {
          E.toast('찍었다. pH ' + v + '.', 'good');
        }
        upd(); sync();
      }
      graphHand(cv, st, {
        M: function () { return M.g; },
        area: function (p, g) { return p.x > g.ox + g.gx - 20 && p.x < g.ox + g.gx + g.gw + 20 && p.y > g.gy - g.gh - 30 && p.y < g.gy + 30; },
        get: function () { return st.pH; },
        set: function (v) { st.pH = v; sl.sync(v); upd(); },
        min: 1, max: 11, step: 1, targets: TARGETS,
        measure: measure,
        miss: 'pH 3, 5, 7, 9, 11 에서 찍어라. 다른 자리는 점이 안 된다.'
      });
      btn.addEventListener('click', function () {
        if (TARGETS.indexOf(st.pH) < 0) { E.toast('pH 3, 5, 7, 9, 11 중 하나에 맞춰라.', 'bad'); return; }
        measure(st.pH, null);
      });
      box.appendChild(E.el('div', { cls: 'btnrow' }, btn));
      box.appendChild(tbl);
      panel.appendChild(box);

      function upd() {
        tbl.innerHTML = '<table class="dat"><tr><th>pH</th><th>반응 속도</th></tr>' +
          TARGETS.map(function (v) {
            return '<tr><td>' + v + '</td><td>' + (D.phPts[v] != null ? fmt(D.phPts[v]) : '-') + '</td></tr>';
          }).join('') + '</table>';
      }
      upd();

      var txt = E.el('div', { cls: 'card' });
      txt.innerHTML = '<h3>최적 pH</h3>' +
        '<p>활성이 가장 높아 반응 속도가 최대가 될 때의 pH 를 <b>최적 pH</b> 라고 합니다.</p>' +
        '<div class="kv"><span>대부분의 효소</span><b>pH 6 ~ 8</b></div>' +
        '<div class="kv"><span>펩신 (위)</span><b>pH 2</b></div>' +
        '<div class="kv"><span>트립신 (소장)</span><b>pH 8 부근</b></div>' +
        '<p class="muted" style="margin-top:8px">효소가 일하는 자리의 환경에 맞춰져 있습니다. ' +
        '위는 강한 산성이고 소장은 약한 염기성입니다.</p>';
      panel.appendChild(txt);
      E.quiz(panel, Q, sync);

      function sync() {
        var n = TARGETS.filter(function (v) { return D.phPts[v] != null; }).length;
        var qok = !!(D._ans[Q.id] && D._ans[Q.id].ok);
        if (n === TARGETS.length && qok) {
          E.note('pH의 영향', '카탈레이스는 pH 7 부근에서 가장 빠르다. 효소마다 최적 pH 가 다르다. ' +
                 '대부분 pH 6~8, 펩신은 pH 2, 트립신은 pH 8 부근.');
        }
        E.gate(n === TARGETS.length && qok,
               n < TARGETS.length ? ('다섯 곳 중 ' + n + '곳만 측정했습니다') : '확인 문항을 풀어야 넘어갑니다');
      }
      sync();
    }
  };
}

/* ================================================================
   장면 11. 농도
   ================================================================ */
function scConc() {
  var SUB_T = [1, 3, 6, 10, 16];
  var ENZ_T = [1, 2, 3, 4, 5];
  var Q = {
    id: 'q_conc',
    q: '기질 농도를 계속 높였더니 어느 지점부터 반응 속도가 <b>더 이상 빨라지지 않았다.</b> 그 까닭은?',
    opts: [
      '기질이 너무 많아져 서로 부딪혀 반응을 방해하기 때문이다',
      '기질과 결합할 수 있는 효소가 더 남아 있지 않기 때문이다',
      '기질 농도가 높아지면 효소의 구조가 변성되기 때문이다',
      '남은 기질이 효소억제제처럼 활성부위를 막기 때문이다'
    ],
    a: 1,
    why: '효소의 양은 정해져 있습니다. 기질이 늘어나면 처음에는 빈 효소가 계속 붙잡아 반응이 빨라지지만, ' +
         '어느 지점을 넘으면 <b>모든 효소가 이미 기질과 결합한 상태</b>가 됩니다. ' +
         '그 뒤로는 기질을 더 넣어도 기다리는 기질만 늘 뿐이라 속도가 더 오르지 않습니다. ' +
         '이때 <b>효소를 더 넣으면</b> 반응 속도는 다시 올라갑니다.',
    bad: {
      0: '기질끼리 부딪혀 방해하는 것이 아닙니다. 붙잡아 줄 효소가 남아 있지 않은 것입니다.',
      2: '기질 농도는 효소를 변성시키지 않습니다. 변성은 온도나 pH 에서 일어납니다.',
      3: '효소억제제는 기질과 다른 물질입니다. 기질 자신은 억제제로 작용하지 않습니다.'
    }
  };
  return {
    id: 'conc', chap: '탐구 3 농도', name: '농도의 영향',
    guide: '두 그래프 위를 <span class="hl">끌어 농도를 맞추고, 톡 눌러</span> 점을 찍으세요. ' +
           '<span class="hl">두 그래프의 모양이 왜 다른지</span> 생각해 보세요.',
    mount: function (stage, panel) {
      /* st.S, st.Ec 논리값. 그림값은 sv, ev (두 그래프가 따로 논다) */
      var st = { S: 6, Ec: 3, sv: 6, ev: 3, atS: {}, atE: {}, tNow: 0 };
      var M = {};
      var cv = E.canvas(stage);
      cv.on(function (c, w, h, t) {
        E.dbg = { n: 'conc', M: M, st: st };
        st.tNow = t;
        var half = w / 2;
        /* 왼쪽 — 기질 농도 */
        c.save();
        var A = axes(c, half, h, { xl: '기질 농도', yl: '반응 속도 (상댓값)', x0: 0, x1: 16, y0: 0, y1: 1.15 });
        M.gS = { ox: 0, gx: A.gx, gw: A.gw, gy: A.gy, gh: A.gh, x0: 0, x1: 16 };
        curve(c, A, velSub, 0, 16, '#12a06a', 4);
        c.save();
        /* 더 못 올라가는 선 — 곡선이 기질 농도 10 에서 여기에 닿고 그 뒤로 평평하다 */
        c.strokeStyle = 'rgba(24,19,34,.4)'; c.setLineDash([4, 4]); c.lineWidth = 1.4;
        c.beginPath(); c.moveTo(A.X(0), A.Y(1)); c.lineTo(A.X(16), A.Y(1)); c.stroke();
        c.setLineDash([]); c.strokeStyle = 'rgba(24,19,34,.28)';
        c.beginPath(); c.moveTo(A.X(SUB_SC), A.Y(0)); c.lineTo(A.X(SUB_SC), A.Y(1)); c.stroke();
        c.restore();
        chip(c, A.X(0) + 46, A.Y(1) - 13, '더 못 올라가는 선', '#ffffff', 10, half * .52);
        SUB_T.forEach(function (v) {
          if (D.subPts[v] == null) return;
          var k = popK(t - (st.atS[v] == null ? -9 : st.atS[v]));
          flag(c, A.X(v), A.Y(velSub(v)), A.gy, v, k, '#12a06a');
          dot(c, A.X(v), A.Y(velSub(v)), '#5fd68a', 6, k);
        });
        var sx = A.X(st.sv), sy = A.Y(velSub(st.sv));
        dot(c, sx, sy, '#ffd23f', 7.5);
        chip(c, Math.max(A.gx + 20, Math.min(A.gx + A.gw - 20, sx)), sy < A.gy - A.gh + 44 ? sy + 26 : sy - 24, '기질 ' + E.clamp(Math.round(st.sv), 0, 16), '#ffd23f', 11);
        chip(c, half / 2, 11, '효소의 양은 고정', '#ffffff', 10.5, half - 12);
        c.restore();

        /* 오른쪽 — 효소 농도 */
        c.save();
        c.translate(half, 0);
        var B = axes(c, half, h, { xl: '효소 농도', yl: '반응 속도 (상댓값)', x0: 0, x1: 5, y0: 0, y1: 1.15 });
        M.gE = { ox: half, gx: B.gx, gw: B.gw, gy: B.gy, gh: B.gh, x0: 0, x1: 5 };
        curve(c, B, velEnz, 0, 5, '#2f7de1', 4);
        ENZ_T.forEach(function (v) {
          if (D.enzPts[v] == null) return;
          var k = popK(t - (st.atE[v] == null ? -9 : st.atE[v]));
          flag(c, B.X(v), B.Y(velEnz(v)), B.gy, v, k, '#2f7de1');
          dot(c, B.X(v), B.Y(velEnz(v)), '#7fc4ff', 6, k);
        });
        var ex = B.X(st.ev), ey = B.Y(velEnz(st.ev));
        dot(c, ex, ey, '#ffd23f', 7.5);
        chip(c, Math.max(B.gx + 20, Math.min(B.gx + B.gw - 20, ex)), ey < B.gy - B.gh + 44 ? ey + 26 : ey - 24, '효소 ' + E.clamp(Math.round(st.ev), 0, 5), '#ffd23f', 11);
        chip(c, half / 2, 11, '기질은 충분히 많은 상태', '#ffffff', 10.5, half - 12);
        c.restore();

        var a = SUB_T.filter(function (v) { return D.subPts[v] != null; }).length;
        var b = ENZ_T.filter(function (v) { return D.enzPts[v] != null; }).length;
        var nS = SUB_T.filter(function (v) { return D.subPts[v] == null; })[0];
        var nE = ENZ_T.filter(function (v) { return D.enzPts[v] == null; })[0];
        E.hint(stage, a < SUB_T.length ? ('왼쪽 그래프를 끌어 기질 농도 ' + nS + ' 에 맞추고 톡 눌러 찍으세요 (' + a + '/5)')
                    : b < ENZ_T.length ? ('오른쪽 그래프를 끌어 효소 농도 ' + nE + ' 에 맞추고 톡 눌러 찍으세요 (' + b + '/5)')
                    : '열 점을 다 찍었습니다. 확인 문항을 푸세요');
      });

      var slS = slider(panel, {
        id: 'sc', title: '기질 농도 (효소의 양은 고정)', unitLabel: '농도', min: 1, max: 16, step: 1, value: st.S,
        fmt: function (v) { return String(v); },
        help: '무대의 왼쪽 그래프를 끌어도 됩니다. 1, 3, 6, 10, 16 다섯 곳에서 「기질 쪽 측정」.',
        onInput: function (v) { st.S = v; st.sv = v; upd(); }

/* ================================================================
   장면 12. 억제제의 자리
   교과서 71쪽 — 경쟁적 억제제는 기질 대신 활성부위에 결합하고,
   비경쟁적 억제제는 활성부위가 아닌 다른 부위에 결합해 활성부위의 구조를 변형한다.
   그 둘을 손으로 붙여 보고, 그때마다 기질이 들어가는지 대 보는 장면이다.
   ================================================================ */
function inhGeom(w, h) {
  var colW = Math.max(56, Math.min(94, w * 0.17));
  var colX = w - colW / 2 - 8;
  var ps = Math.min(1.45, (colW - 12) / 56);
  var right = colX - colW / 2 - 12;
  var s = Math.max(0.5, Math.min((right - 24) / 250, (h - 96) / 130));
  var cx = right / 2 + 8, cy = h / 2 - 2 * s;
  return {
    s: s, ps: ps, colX: colX, colW: colW, cx: cx, cy: cy,
    ys: [h * 0.19, h * 0.50, h * 0.81],
    slot: { x: cx, y: cy - 30 * s },
    pocket: { x: cx - 58 * s, y: cy + 4 * s }
  };
}

function scInhib() {

    ],
    a: 0,
    why: '교과서는 「<b>비경쟁적 억제제</b>는 효소의 활성부위가 아닌 다른 부위에 결합하여 ' +
         '<b>활성부위의 구조를 변형</b>함으로써 효소의 작용을 억제한다」고 적고 있습니다. ' +
         '㉡이 옆구리에 붙는 순간 홈이 비뚤어진 것이 그것입니다.',
    bad: {

  var Q3 = {

    q: '교과서는 효소억제제를 「효소와 결합하여 (　　　)의 형성을 방해함으로써 효소의 작용을 억제하는 물질」이라고 한다. ' +
       '괄호에 알맞은 말은?',
    opts: ['활성화에너지', '단백질로 된 주효소', '효소기질복합체', '생성물과 효소의 결합'],
    a: 2,
    why: '경쟁적이든 비경쟁적이든, 막는 것은 결국 <b>효소와 기질이 결합한 상태</b>가 만들어지는 일입니다. ' +
         '그것을 7장면에서 <b>효소기질복합체</b>라고 불렀습니다.',
    bad: {
      0: '활성화에너지는 효소가 <b>낮추는</b> 것입니다. 형성한다고 하지 않습니다.',
      1: '주효소는 효소 자체의 한 부분입니다. 억제제가 그 형성을 막는 것이 아닙니다.',
      3: '효소는 생성물과 결합한 채로 있지 않고 <b>분리되어</b> 떨어져 나옵니다.'
    }
  };

  return {
    id: 'inhib', chap: '탐구 4 억제제', name: '억제제의 자리',
    guide: '오른쪽 기둥의 <span class="hl">억제제 ㉠과 ㉡을 하나씩 효소에 끌어다 붙이고</span>, ' +
           '그때마다 <span class="hl">기질이 들어가는지 대 보세요.</span>',
    mount: function (stage, panel) {
      var PIECES = [
        { k: 'sub', shape: 0, col: '#ffd23f', n: '기질' },
        { k: 'c', shape: 0, col: '#ff5c5c', n: '억제제 ㉠' },
        { k: 'n', shape: 1, col: '#a97bd6', n: '억제제 ㉡' }

      var st = { pick: -1, px: 0, py: 0, back: null, warp: 0, warpSp: null,
                 on: null, subIn: 0, subAt: -9, bindAt: -9, tNow: 0 };
      var M = {};
      var cv = E.canvas(stage);

      function piecePos(g, i) {
        var k = PIECES[i].k;
        if (k === st.on) return k === 'c' ? g.slot : g.pocket;
        if (k === 'sub' && st.subIn) return g.slot;
        return { x: g.colX, y: g.ys[i] };
      }
      function setWarp(to) {
        if (st.warpSp) { st.warpSp.stop(); st.warpSp = null; }
        var from = st.warp;
        st.warpSp = E.spring(from, to, function (v) { st.warp = v; }, { k: 210, d: 13, eps: .003 });

      cv.on(function (c, w, h, t) {
        var g = inhGeom(w, h);

        M.pos = [piecePos(g, 0), piecePos(g, 1), piecePos(g, 2)];
        E.dbg = { n: 'inhib', st: st, M: M };
        st.tNow = t;
        if (st.subIn && t - st.subAt > 1.4) st.subIn = 0;
        var s = g.s, cx = g.cx, cy = g.cy, wp = st.warp;

        /* 효소 — 그림자 한 겹 + 납작한 색 + 굵은 검은 선 */
        c.save(); c.translate(5, 5); enzymePath(c, cx, cy, s, wp); c.fillStyle = INK; c.fill(); c.restore();
        enzymePath(c, cx, cy, s, wp);
        c.fillStyle = '#5fd68a'; c.fill();
        c.strokeStyle = INK; c.lineWidth = 3; c.lineJoin = 'round'; c.stroke();
        /* 홈 — 비어 있으면 어둡게 */
        if (st.on !== 'c' && !st.subIn) {
          groovePath(c, cx, cy, s, wp);
          c.fillStyle = wp > .35 ? 'rgba(169,123,214,.30)' : 'rgba(24,19,34,.18)'; c.fill();

        chip(c, cx, cy + 22 * s, '효소', '#fff8e6', 12);
        chip(c, cx, Math.max(16, cy - 62 * s), wp > .5 ? '활성부위 (모양이 달라짐)' : '활성부위',

        /* 붙어 있는 것과 기둥의 조각들 */
        PIECES.forEach(function (pc, i) {
          var pos = piecePos(g, i), k = 1, sc = g.ps;
          var bound = pc.k === st.on || (pc.k === 'sub' && st.subIn);
          if (st.pick === i) { pos = { x: st.px, y: st.py }; k = 1.12; }
          else if (st.back && st.back.i === i) pos = { x: st.back.x, y: st.back.y };

          if (bound && st.pick !== i) {
            /* 기둥 자리는 빈 채로 남겨 둔다 */
            c.save(); c.setLineDash([5, 4]); c.strokeStyle = 'rgba(24,19,34,.28)'; c.lineWidth = 2;
            subPath(c, g.colX, g.ys[i], g.ps, pc.shape); c.stroke(); c.restore();
          }
          drawPiece(c, pos.x, pos.y, sc, pc.shape, pc.col, k);
          if (st.pick !== i) {
            var cy2 = Math.min(pos.y + (bound ? 30 * sc : 39 * sc), h - 24);

        });

        /* 끌고 있을 때만 놓을 자리를 보여 준다 */
        if (st.pick >= 0) {
          var kk = PIECES[st.pick].k;

          else if (kk !== 'n' && kk !== st.on) E.target(c, g.slot.x, g.slot.y, 60 * s, 34 * s, t);
        } else {
          PIECES.forEach(function (pc, i) {
            var pos = piecePos(g, i);
            E.grab(c, pos.x, pos.y, (pc.k === st.on ? 28 * s : 24 * g.ps), t);
          });
        }

        var msg;
        if (!D.inhBind.c && !D.inhBind.n)
          msg = (st.on === 'c' || st.on === 'n') ? '이제 기질을 끌어다 활성부위에 대 보세요'
              : '억제제 ㉠을 효소에 끌어다 붙여 보세요';
        else if (!D.inhBind.c)
          msg = st.on === 'c' ? '이제 기질을 끌어다 대 보세요' : '남은 ㉠을 붙이고 기질을 대 보세요';
        else if (!D.inhBind.n)
          msg = st.on === 'n' ? '이제 기질을 끌어다 대 보세요'
              : st.on === 'c' ? '㉠을 효소 밖으로 끌어내고 ㉡을 붙여 보세요'
              : '남은 ㉡을 붙이고 기질을 대 보세요';
        else msg = '둘 다 확인했습니다. 확인 문항을 푸세요';
        E.hint(stage, msg);
      });

      function backTo(i, from, to) {
        var b = { i: i, x: from.x, y: from.y };
        st.back = b;
        b.sp = E.spring(0, 1, function (v, done) {
          b.x = from.x + (to.x - from.x) * v; b.y = from.y + (to.y - from.y) * v;
          if (done && st.back === b) st.back = null;
        }, { k: 220, d: 10, eps: .003 });
      }

      E.drag(cv.cv, {
        start: function (ev) {
          var p = cv.pt(ev);

          for (var i = 0; i < PIECES.length; i++) {
            var pos = piecePos(g, i);
            var bound = PIECES[i].k === st.on;
            var rx = Math.max(26, (bound ? 34 * g.s : 32 * g.ps));
            var ry = Math.max(22, (bound ? 26 * g.s : 26 * g.ps));
            if (Math.abs(p.x - pos.x) < rx && Math.abs(p.y - pos.y) < ry) {
              if (st.back && st.back.sp) { st.back.sp.stop(); st.back = null; }
              st.pick = i; st.px = p.x; st.py = p.y; E.beep('pick');
              return;
            }
          }
        },
        move: function (ev) {
          if (st.pick < 0) return;
          var q = cv.pt(ev); st.px = q.x; st.py = q.y;
        },
        end: function (ev) {
          if (st.pick < 0) return;
          var p = cv.pt(ev), i = st.pick, k = PIECES[i].k;
          st.pick = -1;
          var g = inhGeom(cv.cv.clientWidth, cv.cv.clientHeight);
          var home = { x: g.colX, y: g.ys[i] };
          var dS = E.dist(p.x, p.y, g.slot.x, g.slot.y), onSlot = dS < 62 * g.s;
          var onEnz = Math.abs(p.x - g.cx) < 106 * g.s && p.y > g.cy - 62 * g.s && p.y < g.cy + 48 * g.s;

          /* 붙어 있던 것을 끌어냈다 */
          if (k === st.on) {
            if (onEnz) { backTo(i, p, k === 'c' ? g.slot : g.pocket); return; }
            st.on = null;
            if (k === 'n') setWarp(0);
            E.beep('thud'); E.buzz(12);
            E.toast(k === 'c' ? '㉠을 떼어 냈다. 활성부위가 다시 비었다.'
                              : '㉡을 떼어 냈다. 활성부위 모양이 되돌아왔다.', '');
            backTo(i, p, home); drawCards(); sync(); return;
          }
          /* 기질을 대 본다 */
          if (k === 'sub') {
            if (!onSlot) { backTo(i, p, home); return; }
            if (st.on == null) {
              st.subIn = 1; st.subAt = st.tNow; st.bindAt = st.tNow;
              E.beep('snap'); E.kick(); E.buzz(16); E.burst(g.slot.x, g.slot.y, null, 10, 2.2);
              E.toast('막는 것이 없으니 기질이 잘 들어간다. 반응이 일어난다.', 'good');
              return;
            }
            var was = st.on;
            backTo(i, p, home);
            E.beep('thud'); E.buzz(40);
            if (was === 'c') {
              D.inhBind.c = 1; E.save();
              E.pop(g.slot.x, g.slot.y - 66 * g.s, '자리가 찼다!', '#b91c1c', true);
              E.toast('㉠이 활성부위를 차지하고 있어 기질이 들어갈 자리가 없다.', 'bad');
            } else {
              D.inhBind.n = 1; E.save();
              E.pop(g.slot.x, g.slot.y - 66 * g.s, '모양이 안 맞는다!', '#6d28d9', true);
              E.toast('활성부위 모양이 달라져 기질이 들어맞지 않는다.', 'bad');
            }
            drawCards(); sync(); return;
          }
          /* 억제제를 붙인다 */
          if (st.on != null) {
            E.toast('먼저 붙어 있는 것을 효소 밖으로 끌어내야 한다.', '');
            backTo(i, p, home); return;
          }
          if (k === 'c') {
            if (!onSlot) {
              if (onEnz) E.toast('㉠은 활성부위에만 붙는다. 홈에 대 봐라.', '');
              backTo(i, p, home); return;
            }
            st.on = 'c'; st.bindAt = st.tNow;
            E.beep('snap'); E.kick(); E.buzz(18); E.burst(g.slot.x, g.slot.y, null, 12, 2.4);
            E.toast('㉠이 활성부위에 들어맞았다. 기질이 앉을 자리다.', 'good');
            drawCards(); sync(); return;
          }
          /* ㉡ — 활성부위에 대면 미끄러져 다른 자리로 간다 */
          if (!onEnz) { backTo(i, p, home); return; }
          st.on = 'n'; st.bindAt = st.tNow; setWarp(1);
          E.beep('snap'); E.kick(); E.buzz(22); E.burst(g.pocket.x, g.pocket.y, null, 12, 2.4);
          E.pop(g.slot.x, g.slot.y - 66 * g.s, '홈이 비뚤어졌다!', '#6d28d9', true);
          E.toast(onSlot ? '㉡은 활성부위에 안 붙는다. 옆의 다른 자리에 붙었다. 홈 모양을 봐라.'
                         : '㉡이 활성부위가 아닌 다른 자리에 붙었다. 홈 모양이 달라졌다.', 'good');
          drawCards(); sync();
        }
      });

      var cardBox = E.el('div');
      panel.appendChild(cardBox);
      var qWrap = E.el('div');
      panel.appendChild(qWrap);
      var built = 0;
      function drawCards() {
        cardBox.innerHTML =
          '<div class="card"><h3>해 본 것</h3>' +
          '<div class="kv"><span>㉠을 붙이고 기질 대 보기</span><b style="color:' +
          (D.inhBind.c ? '#8ff0c0' : 'rgba(170,200,230,.6)') + '">' + (D.inhBind.c ? '했다' : '아직') + '</b></div>' +
          '<div class="kv"><span>㉡을 붙이고 기질 대 보기</span><b style="color:' +
          (D.inhBind.n ? '#8ff0c0' : 'rgba(170,200,230,.6)') + '">' + (D.inhBind.n ? '했다' : '아직') + '</b></div>' +
          '<p class="muted">붙어 있는 것은 <b>효소 밖으로 끌어내면</b> 떨어집니다.</p></div>';
        if (D.inhBind.c && D.inhBind.n) {
          cardBox.innerHTML +=
            '<div class="card"><h3>교과서가 말하는 것</h3>' +
            '<div class="kv"><span>효소억제제</span><b>효소와 결합해 효소기질복합체의 형성을 방해한다</b></div>' +
            '<div class="kv"><span>경쟁적 억제제</span><b>기질 대신 활성부위에 결합한다</b></div>' +
            '<div class="kv"><span>비경쟁적 억제제</span><b>활성부위가 아닌 다른 부위에 결합해 활성부위의 구조를 변형한다</b></div></div>';
          if (!built) {
            built = 1;
            var h1 = E.el('div'); qWrap.appendChild(h1); E.quiz(h1, Q1, sync);
            var h2 = E.el('div'); qWrap.appendChild(h2); E.quiz(h2, Q2, sync);
            var h3 = E.el('div'); qWrap.appendChild(h3); E.quiz(h3, Q3, sync);
          }
        }
      }
      drawCards();

      function sync() {
        var did = !!(D.inhBind.c && D.inhBind.n);
        var qok = [Q1, Q2, Q3].every(function (q) { return !!(D._ans[q.id] && D._ans[q.id].ok); });
        if (did && qok) {
          E.note('억제제의 자리',
                 '효소억제제 — 효소와 결합하여 효소기질복합체의 형성을 방해함으로써 효소의 작용을 억제한다.\n' +
                 '경쟁적 억제제(㉠) — 기질 대신 활성부위에 결합한다. 자리가 차서 기질이 못 들어간다.\n' +
                 '비경쟁적 억제제(㉡) — 활성부위가 아닌 다른 부위에 결합해 활성부위의 구조를 변형한다. 모양이 안 맞아 기질이 못 들어간다.');
        }
        E.gate(did && qok,
               !did ? ('㉠ ' + (D.inhBind.c ? '했다' : '아직') + ', ㉡ ' + (D.inhBind.n ? '했다' : '아직') +
                       ' — 둘 다 붙여 보고 기질을 대 봐야 넘어갑니다')
                    : '확인 문항 세 개를 모두 풀어야 넘어갑니다');
      }
      sync();
    }
  };
}

/* ================================================================
   장면 13. 기질을 더 넣으면
   교과서 71쪽 그림 Ⅱ-12, Ⅱ-13 — 경쟁적 억제제는 기질 농도가 높아지면 효과가 줄고,
   비경쟁적 억제제는 높아져도 줄지 않는다. 81쪽 08번의 실험 Ⅰ, Ⅱ, Ⅲ 짜임을 그대로 쓴다.
   ================================================================ */
var INH_T = [3, 10, 20];
function inhcGeom(w, h) {
  var colW = Math.max(54, Math.min(92, w * 0.16));
  var gw = w - colW;
  var th = Math.min(54, h * 0.19), tw = th * 0.46;
  var bh = Math.min(32, h * 0.12), bw = bh * 0.55;
  return { colW: colW, gw: gw, colX: w - colW / 2 - 4, th: th, tw: tw, bh: bh, bw: bw,
           ys: [h * 0.13, h * 0.36, h * 0.59], by: h * 0.84 };
}

function scInhCurve() {
  var Q4 = {
    id: 'i4',
    q: '기질 농도를 3에서 20까지 올리는 동안, <b>Ⅱ(㉠을 넣은 것)</b>의 반응 속도는 Ⅰ과 비교해 어떻게 되었는가?',
    opts: [
      '처음부터 끝까지 Ⅰ의 절반으로 똑같이 유지되었다',
      '차이가 점점 줄어들어 농도 20에서 Ⅰ과 같아졌다',
      '차이가 점점 벌어져 마지막에는 Ⅰ의 절반에도 못 미치게 되었다',
      '처음에는 Ⅰ보다 빨랐다가 나중에 Ⅰ보다 느려졌다'
    ],
    a: 1,
    why: '표의 비율을 보면 <b>54 % → 75 % → 100 %</b> 입니다. 교과서의 ' +
         '「경쟁적 억제제는 기질의 농도가 낮을 때 효소의 작용을 억제하는 효과가 크며, ' +
         '기질의 농도가 높아지면 그 효과가 감소한다」가 이것입니다. ' +
         '기질이 많아지면 <b>같은 자리를 두고 벌이는 다툼에서 기질이 이기기</b> 때문입니다.',
    bad: {
      0: '어느 농도에서나 일정한 비율로 눌린 것은 <b>Ⅲ</b> 입니다.',
      2: '차이는 벌어진 것이 아니라 <b>줄어들었습니다.</b> 비율이 54 % 에서 100 % 로 커졌습니다.',
      3: 'Ⅱ 가 Ⅰ 보다 빨랐던 자리는 없습니다. 억제제를 넣은 쪽이 더 빠를 수는 없습니다.'
    }
  };
  var Q5 = {
    id: 'i5',
    q: '<b>Ⅲ(㉡을 넣은 것)</b>은 기질 농도를 20까지 올려도 Ⅰ의 40 % 에 머물렀다. 그 까닭으로 옳은 것은?',
    opts: [
      '기질이 많아지면 ㉡과 다투어 활성부위를 차지할 수 있지만 그 속도가 느리기 때문이다',
      '㉡ 때문에 효소가 모두 분해되어 없어졌기 때문이다',
      '기질 농도 20 이 아직 충분히 높지 않기 때문이다',
      '㉡은 활성부위에 붙어 있지 않아 기질이 많아져도 밀어낼 수 없기 때문이다'
    ],
    a: 3,
    why: '경쟁적 억제제는 기질과 <b>같은 자리</b>를 두고 다투므로 기질을 늘리면 밀어낼 수 있습니다. ' +
         '비경쟁적 억제제는 <b>아예 다른 자리</b>에 붙어 있어 기질이 아무리 많아도 상관이 없습니다. ' +
         '그래서 교과서는 「비경쟁적 억제제는 기질의 농도가 높아져도 그 효과가 감소하지 않는다」고 적었습니다.',
    bad: {
      0: '다툴 수 있는 쪽은 <b>㉠</b> 입니다. ㉡은 활성부위에 있지 않습니다.',
      1: '효소가 없어졌다면 반응이 아예 일어나지 않았을 것입니다. Ⅲ 에서도 반응은 일어났습니다.',
      2: '더 올려도 마찬가지입니다. Ⅲ 은 이미 기질 농도 10 에서 천장에 닿아 더 오르지 않았습니다.'
    }
  };

  return {
    id: 'inhcurve', chap: '탐구 4 억제제', name: '기질을 더 넣으면',
    guide: '억제제 병을 <span class="hl">Ⅱ 와 Ⅲ 시험관에 끌어다 붓고</span>, ' +
           '그래프를 끌어 기질 농도를 맞춘 뒤 <span class="hl">잴 시험관을 톡 누르세요.</span>',
    mount: function (stage, panel) {
      var st = { S: 3, sv: 3, tNow: 0, at: { c: {}, n: {} }, pick: null, px: 0, py: 0, back: null };
      var M = {};
      var cv = E.canvas(stage);
      var COL = { I: 'rgba(24,19,34,.45)', c: '#ff5c5c', n: '#a97bd6' };

      function poured(k) { return !!D.inhPour[k]; }
      function nPts(k) { return INH_T.filter(function (v) { return D.inhPts[k][v] != null; }).length; }
      function vel(k, S) { return k === 'c' ? velSubC(S) : velSubN(S); }

      cv.on(function (c, w, h, t) {
        var g = inhcGeom(w, h);
        st.tNow = t;
        c.save();
        var A = axes(c, g.gw, h, { xl: '기질 농도', yl: '반응 속도 (상댓값)', x0: 0, x1: SUB_XMAX, y0: 0, y1: 1.15 });
        M.g = { ox: 0, gx: A.gx, gw: A.gw, gy: A.gy, gh: A.gh, x0: 0, x1: SUB_XMAX };
        M.geo = g;
        /* 기준치 세로선 — Ⅰ 이 천장에 닿는 자리, 그리고 Ⅱ 가 닿는 자리 */
        c.save(); c.setLineDash([5, 5]); c.lineWidth = 1.4; c.strokeStyle = 'rgba(24,19,34,.34)';
        c.beginPath(); c.moveTo(A.X(SUB_SC), A.Y(0)); c.lineTo(A.X(SUB_SC), A.Y(1.05)); c.stroke();
        if (poured('c')) {
          c.strokeStyle = 'rgba(255,92,92,.6)';
          c.beginPath(); c.moveTo(A.X(SUB_SC_C), A.Y(0)); c.lineTo(A.X(SUB_SC_C), A.Y(1.05)); c.stroke();
        }
        c.restore();
        if (poured('c') && nPts('c') === INH_T.length) {
          c.save(); c.fillStyle = 'rgba(95,214,138,.16)';
          c.fillRect(A.X(SUB_SC_C), A.Y(1.12), A.X(SUB_XMAX) - A.X(SUB_SC_C), A.Y(0) - A.Y(1.12));
          c.restore();
        }
        /* 세 곡선 */
        curve(c, A, velSub, 0, SUB_XMAX, COL.I, 3.4);
        if (poured('c')) curve(c, A, velSubC, 0, SUB_XMAX, COL.c, 3.2);
        if (poured('n')) curve(c, A, velSubN, 0, SUB_XMAX, COL.n, 3.2);
        /* 찍은 점 */
        ['c', 'n'].forEach(function (k) {
          if (!poured(k)) return;
          INH_T.forEach(function (v) {
            if (D.inhPts[k][v] == null) return;
            var kk = popK(t - (st.at[k][v] == null ? -9 : st.at[k][v]));
            dot(c, A.X(v), A.Y(vel(k, v)), k === 'c' ? '#ffb3b3' : '#d7bdf2', Math.max(4.6, Math.min(6.5, h / 60)), kk);
          });
        });
        /* 지금 맞춰 둔 기질 농도 */
        var sx = A.X(st.sv);
        c.save(); c.strokeStyle = '#ffd23f'; c.lineWidth = 2.4; c.setLineDash([3, 3]);
        c.beginPath(); c.moveTo(sx, A.Y(0)); c.lineTo(sx, A.Y(1.12)); c.stroke(); c.restore();
        dot(c, sx, A.Y(velSub(st.sv)), '#ffd23f', 5.5);
        chip(c, E.clamp(sx, A.gx + 34, A.gx + A.gw - 34), A.gy + 15,
             '기질 ' + Math.round(st.sv), '#ffd23f', 11);
        /* 이름표는 모서리에 */
        var lx = A.gx + A.gw - 44, ly = A.gy - 16, row = 0;
        chip(c, lx, ly, 'Ⅰ 없음', '#ffffff', 10);
        if (poured('c')) { row++; chip(c, lx, ly - row * 20, 'Ⅱ ㉠', '#ffc9c9', 10); }
        if (poured('n')) { row++; chip(c, lx, ly - row * 20, 'Ⅲ ㉡', '#e6d6fb', 10); }
        c.restore();

        /* 오른쪽 기둥 — 시험관 셋과 병 둘 */
        M.tubes = []; M.bots = [];
        ['I', 'c', 'n'].forEach(function (k, i) {
          var x = g.colX, y = g.ys[i];
          M.tubes.push({ k: k, x: x, y: y });
          var liq = k === 'I' ? '#bfe9d2' : k === 'c' ? (poured('c') ? '#ffb3b3' : '#bfe9d2')
                                                     : (poured('n') ? '#d7bdf2' : '#bfe9d2');
          c.save();
          rr(c, x - g.tw / 2, y - g.th / 2, g.tw, g.th, g.tw * 0.32);
          c.fillStyle = '#f2f8ff'; c.fill();
          c.save(); rr(c, x - g.tw / 2, y - g.th / 2, g.tw, g.th, g.tw * 0.32); c.clip();
          c.fillStyle = liq; c.fillRect(x - g.tw / 2, y + g.th / 2 - g.th * 0.6, g.tw, g.th * 0.6);
          c.restore();
          rr(c, x - g.tw / 2, y - g.th / 2, g.tw, g.th, g.tw * 0.32);
          c.strokeStyle = INK; c.lineWidth = 2.6; c.stroke();
          c.restore();
          label(c, x, y - g.th * 0.22, k === 'I' ? 'Ⅰ' : k === 'c' ? 'Ⅱ' : 'Ⅲ', INK, Math.min(17, g.tw * 0.72));
          label(c, x, y + g.th * 0.2, k === 'I' ? '비움' : k === 'c' ? '㉠' : '㉡',
                k === 'I' ? 'rgba(24,19,34,.6)' : INK,
                k === 'I' ? Math.min(9.5, g.tw * 0.38) : Math.min(13, g.tw * 0.52));
        });
        ['c', 'n'].forEach(function (k, i) {
          if (poured(k)) return;
          var x = g.colX + (i === 0 ? -g.bw * 1.2 : g.bw * 1.2), y = g.by;
          if (st.pick === k) { x = st.px; y = st.py; }
          else if (st.back && st.back.k === k) { x = st.back.x; y = st.back.y; }
          M.bots.push({ k: k, x: x, y: y });
          c.save();
          rr(c, x - g.bw / 2, y - g.bh / 2, g.bw, g.bh, 4);
          c.fillStyle = k === 'c' ? '#ff5c5c' : '#a97bd6'; c.fill();
          c.strokeStyle = INK; c.lineWidth = 2.4; c.stroke();
          c.fillStyle = INK; c.fillRect(x - g.bw * 0.16, y - g.bh / 2 - g.bh * 0.16, g.bw * 0.32, g.bh * 0.18);
          c.restore();
          label(c, x, y, k === 'c' ? '㉠' : '㉡', '#ffffff', Math.min(13, g.bw * 0.7));
          if (st.pick !== k) E.grab(c, x, y, g.bw * 0.8, t);
        });

        E.dbg = { n: 'inhcurve', st: st, M: M };

        var msg;
        if (!poured('c')) msg = '㉠ 병을 Ⅱ 시험관에 끌어다 부으세요';
        else if (!poured('n')) msg = '㉡ 병을 Ⅲ 시험관에 끌어다 부으세요';
        else if (nPts('c') + nPts('n') < 6) {
          var need = INH_T.filter(function (v) { return D.inhPts.c[v] == null || D.inhPts.n[v] == null; })[0];
          msg = '그래프를 끌어 기질 농도를 ' + need + ' 에 맞추고, 잴 시험관을 톡 누르세요 (' +
                (nPts('c') + nPts('n')) + '/6)';
        } else msg = '여섯 점을 다 찍었습니다. 확인 문항을 푸세요';
        E.hint(stage, msg);
      });

      /* 그래프 위에서 농도 잡기. 여기서는 톡 눌러도 안 재고, 잴 시험관을 누르게 한다 */
      var stG = { get vis() { return st.sv; }, set vis(v) { st.sv = v; } };
      graphHand(cv, stG, {
        M: function () { return M.g; },
        area: function (p, g) {
          return p.x > g.gx - 20 && p.x < g.gx + g.gw + 14 && p.y > g.gy - g.gh - 30 && p.y < g.gy + 30;
        },
        get: function () { return st.S; },
        set: function (v) { st.S = E.clamp(v, 0, SUB_XMAX); },
        min: 0, max: SUB_XMAX, step: 1, targets: INH_T,
        measure: function () { E.toast('농도를 맞췄다. 이제 잴 시험관(Ⅱ 또는 Ⅲ)을 눌러라.', ''); },
        miss: '기질 농도는 3, 10, 20 에서 잰다.'
      });

      function meas(k, v) {
        var fresh = D.inhPts[k][v] == null;
        D.inhPts[k][v] = vel(k, v); E.save(); st.at[k][v] = st.tNow;
        E.beep('pick'); E.buzz(14);
        if (!fresh) { E.toast('이미 잰 자리다.', ''); upd(); sync(); return; }
        var r = Math.round(100 * vel(k, v) / velSub(v));
        if (nPts('c') + nPts('n') === 6) {
          E.beep('good');
          E.toast('여섯 점을 다 찍었다. 두 곡선의 오른쪽 끝을 봐라.', 'good');
        } else E.toast('찍었다. ' + (k === 'c' ? 'Ⅱ' : 'Ⅲ') + ' 는 기질 ' + v + ' 에서 Ⅰ 의 ' + r + ' %.', 'good');
        upd(); sync();
      }

      E.drag(cv.cv, {
        start: function (ev) {
          var p = cv.pt(ev); st.pick = null;
          for (var i = 0; i < M.bots.length; i++) {
            var b = M.bots[i];
            if (E.dist(p.x, p.y, b.x, b.y) < Math.max(26, M.geo.bw)) {
              if (st.back && st.back.sp) { st.back.sp.stop(); st.back = null; }
              st.pick = b.k; st.px = p.x; st.py = p.y; st.moved = 0; E.beep('pick'); return;
            }
          }
          /* 시험관 톡 — 끌기 아님 */
          st.tapAt = p; st.moved = 0;
        },
        move: function (ev) {
          var q = cv.pt(ev);
          if (st.tapAt) st.moved += Math.abs(q.x - st.tapAt.x) + Math.abs(q.y - st.tapAt.y);
          if (st.pick) { st.moved += 1; st.px = q.x; st.py = q.y; }
        },
        end: function (ev) {
          var p = cv.pt(ev), g = M.geo;
          if (st.pick) {
            var k = st.pick; st.pick = null;
            var hit = null;
            M.tubes.forEach(function (tb) {
              if (Math.abs(p.x - tb.x) < g.tw * 1.5 + 14 && Math.abs(p.y - tb.y) < g.th * 0.68) hit = tb;
            });
            var i = k === 'c' ? 0 : 1;
            var home = { x: g.colX + (i === 0 ? -g.bw * 1.2 : g.bw * 1.2), y: g.by };
            var b = { k: k, x: p.x, y: p.y }; st.back = b;
            b.sp = E.spring(0, 1, function (v, done) {
              b.x = p.x + (home.x - p.x) * v; b.y = p.y + (home.y - p.y) * v;
              if (done && st.back === b) st.back = null;
            }, { k: 220, d: 10, eps: .003 });
            if (!hit) return;
            if (hit.k === 'I') {
              E.beep('thud'); E.buzz(40);
              E.toast('Ⅰ 은 비교하려고 비워 두는 대조군이다. 아무것도 안 넣는다.', 'bad'); return;
            }
            if (hit.k !== k) {
              E.beep('thud'); E.buzz(40);
              E.toast((k === 'c' ? '㉠' : '㉡') + ' 은 ' + (k === 'c' ? 'Ⅱ' : 'Ⅲ') + ' 시험관에 넣는다.', 'bad'); return;
            }
            st.back = null;
            D.inhPour[k] = 1; E.save();
            E.beep('snap'); E.kick(); E.buzz(18);
            E.burst(hit.x, hit.y, null, 12, 2.2);
            E.toast((k === 'c' ? 'Ⅱ 에 ㉠' : 'Ⅲ 에 ㉡') + ' 을 넣었다. 이제 기질 농도를 바꿔 가며 재 보자.', 'good');
            upd(); sync(); return;
          }
          if (!st.tapAt || st.moved > 10) { st.tapAt = null; return; }
          st.tapAt = null;
          var tube = null;
          M.tubes.forEach(function (tb) {
            if (Math.abs(p.x - tb.x) < g.tw + 12 && Math.abs(p.y - tb.y) < g.th * 0.62) tube = tb;
          });
          if (!tube) return;
          if (tube.k === 'I') { E.toast('Ⅰ 은 앞 장면에서 이미 쟀다. 회색 곡선이 그것이다.', ''); return; }
          if (!poured(tube.k)) { E.toast('먼저 병을 끌어다 부어야 잴 수 있다.', 'bad'); return; }
          if (INH_T.indexOf(st.S) < 0) {
            E.toast('기질 농도를 3, 10, 20 중 하나에 맞춰라. 지금 ' + Math.round(st.S) + '.', 'bad'); return;
          }
          meas(tube.k, st.S);
        }
      });

      var box = E.el('div', { cls: 'card' });
      box.innerHTML = '<h3>측정</h3>';
      var tbl = E.el('div');
      box.appendChild(tbl);
      panel.appendChild(box);
      function upd() {
        tbl.innerHTML =
          '<div class="scroll"><table class="dat">' +
          '<tr><th>기질 농도</th><th>Ⅰ 없음</th><th>Ⅱ ㉠</th><th>Ⅲ ㉡</th></tr>' +
          INH_T.map(function (v) {
            function cell(k) {
              if (D.inhPts[k][v] == null) return '-';
              return fmt(vel(k, v)) + '<br><span class="muted">' +
                     Math.round(100 * vel(k, v) / velSub(v)) + ' %</span>';
            }
            return '<tr><td>' + v + '</td><td>' + fmt(velSub(v)) + '</td><td>' +
                   cell('c') + '</td><td>' + cell('n') + '</td></tr>';
          }).join('') + '</table></div>' +
          '<p class="muted">괄호 안은 <b>같은 농도에서 Ⅰ 과 비교한 비율</b>입니다. ' +
          '여섯 칸을 다 채우면 두 줄의 흐름이 갈립니다.</p>';
      }
      upd();

      var qWrap = E.el('div');
      panel.appendChild(qWrap);
      var built = 0;
      var ta = null;
      function buildQ() {
        if (built) return; built = 1;
        var h1 = E.el('div'); qWrap.appendChild(h1); E.quiz(h1, Q4, sync);
        var h2 = E.el('div'); qWrap.appendChild(h2); E.quiz(h2, Q5, sync);
        ta = E.write(qWrap, {
          id: 'iw',
          title: '내 생각 쓰기',
          q: '㉠ 과 ㉡ 가운데 어느 쪽이 <b>경쟁적 억제제</b>인지, ' +
             '<b>그래프의 어느 자리</b>를 보고 그렇게 판단했는지 써 보세요.',
          ph: '「기질 농도 ○○ 에서 …」처럼 그래프에서 읽은 자리를 들어 두 문장 이상으로 적어 보세요',
          model: '㉠ 이 경쟁적 억제제다. 기질 농도 3 에서는 Ⅱ 가 Ⅰ 의 54 % 로 눌렸지만, ' +
                 '기질 농도를 20 까지 올리자 Ⅱ 가 Ⅰ 과 같은 높이에 닿아 억제 효과가 사라졌기 때문이다. ' +
                 '㉡ 은 기질 농도를 아무리 올려도 Ⅲ 이 Ⅰ 의 40 % 에 그대로 머물렀으므로 비경쟁적 억제제다.',
          onchange: function () { sync(); }
        });
      }

      function sync() {
        var six = nPts('c') + nPts('n') === 6;
        if (six) buildQ();
        var a = !!(D._ans[Q4.id] && D._ans[Q4.id].ok);
        var b = !!(D._ans[Q5.id] && D._ans[Q5.id].ok);
        var txt = ((D._ans.iw && D._ans.iw.text) || '').trim();
        var w3 = txt.length >= 25;
        if (six && a && b && w3) {
          E.note('기질을 더 넣으면',
                 '경쟁적 억제제(㉠) — 기질 농도가 낮을 때 억제 효과가 크고, 높아지면 효과가 줄어든다. ' +
                 '기질 농도 20 부터는 억제제가 없을 때와 같은 높이에 닿는다 (54 % → 75 % → 100 %).\n' +
                 '비경쟁적 억제제(㉡) — 기질 농도가 높아져도 억제 효과가 줄지 않는다 (40 % → 40 % → 40 %).\n' +
                 '내 답 — ' + txt);
        }
        E.gate(!!(six && a && b && w3),
               !six ? ('Ⅱ ' + nPts('c') + '/3, Ⅲ ' + nPts('n') + '/3 측정했습니다')
                    : (a && b) ? ('서술을 25자 이상 써 주세요 (지금 ' + txt.length + '자)')
                               : '확인 문항 두 개를 모두 풀어야 넘어갑니다');
      }
      sync();
    }
  };
}

    var dn = doneOf(j), st = startedOf(j);
    var cls = 'hjob' + (dn ? ' done' : '') + (!dn && next === j ? ' now' : '');
    return '<button type="button" class="' + cls + '" data-go="' + j.id + '" style="--jc:' + j.acc + '">' +
      '<span class="hno">' + j.no + '</span>' +
      '<span class="hstate">' + (dn ? '마침' : st ? '하는 중' : '시작 전') + '</span>' +
      '<b class="hn">' + esc(j.n) + '</b>' +
      '<span class="hfrom">의뢰 — ' + esc(j.from) + '</span>' +
      '<span class="hwhat">' + esc(j.what) + '</span>' +
      (dn ? '<span class="hstamp">승인</span>' : '') +
      '</button>';
  }).join('');

  var sumCls = 'hsum' + (all ? ' open' : '') + (sumDone() ? ' done' : '');
  app.innerHTML =
    '<div id="hub">' +
    '  <header class="hbar">' +
    '    <span id="badge">루키랩 시리즈</span>' +
    '    <h1>정석 <b>세포편</b></h1>' +
    '    <nav class="hmenu">' +
    '      <button type="button" id="hAbout">이 편은</button>' +
    '      <button type="button" id="hNote">실험노트</button>' +
    '    </nav>' +
    '  </header>' +
    '  <div class="hwrap">' +
    (seam ? '<div class="hseam"><div class="hface">' +
              (window.STORY && STORY.faceOf ? STORY.faceOf(SUP, 'serious') : '') +
            '</div><div class="hsay"><b>' + esc(SUP.n) + '</b><p>' + seam.q + '</p>' +
            '<button type="button" class="hok" data-seam="' + seam.id + '">알겠습니다</button></div></div>' : '') +
    '    <section class="hcard hid">' +
    '      <div class="hidl">' +
    '        <span class="hidk">사원증</span>' +
    '        <b>' + esc(rank) + '</b>' +
    '        <span class="hidsub">마친 의뢰 ' + doneN + ' / ' + JOBS.length + '</span>' +
    '      </div>' +
    '      <div class="hlics">' + (lic || '<span class="licnone">아직 딴 면허가 없습니다</span>') +
    '        <span class="licn">' + licN + ' / ' + licTotal + '</span>' +
    '      </div>' +
    '    </section>' +
    '    <div class="hjobs">' + cards + '</div>' +
    '    <button type="button" class="' + sumCls + '" data-go="sum"' + (all ? '' : ' disabled') + '>' +
    '      <b>종합 보고서</b>' +
    '      <span>' + (all ? (sumDone() ? '다시 보기' : '세 편을 다 마쳤습니다. 한 장으로 묶으세요')
                          : '세 편을 모두 마치면 열립니다') + '</span>' +
    '    </button>' +
    '    <p class="hnote">잠그지 않았습니다. <b>어느 편부터 해도 됩니다.</b> ' +
    '      다만 <b>막 → 방 → 일</b> 의 차례로 하면 세 편이 한 질문의 세 조각으로 읽힙니다.</p>' +
    '    <button type="button" id="hWipe" class="hwipe">처음부터 다시</button>' +
    '  </div>' +
    '</div>';

  /* 듣는 것은 **한 번만** 건다. paintHub 는 이음매를 지울 때마다 다시 그리는데,
     그때마다 걸면 처리기가 쌓여 단추 한 번에 모달이 여러 겹 열린다 */
  if (!app._hubBound) {
    app._hubBound = 1;
    app.addEventListener('click', function (ev) {
      var b = ev.target.closest ? ev.target.closest('[data-go],[data-seam],#hAbout,#hNote,#hWipe') : null;
      if (!b) return;
      if (b.hasAttribute('data-seam')) {
        var hh = hub(); hh.seams = hh.seams || {}; hh.seams[b.getAttribute('data-seam')] = 1; hubSave(hh);
        paintHub(); return;
      }
      if (b.id === 'hWipe') {
        /* 세 편과 종합의 저장 칸이 따로라 하나씩 지운다 */
        if (!confirm('세 편의 진행과 기록을 모두 지우고 처음 상태로 돌립니다. 계속할까요?')) return;
        JOBS.forEach(function (jj) { try { localStorage.removeItem(jj.key); } catch (e) {} });
        try { localStorage.removeItem(HKEY); } catch (e) {}
        location.reload(); return;
      }
      if (b.id === 'hAbout') { modal(aboutHtml()); return; }
      if (b.id === 'hNote') { modal(noteHtml()); return; }
      if (b.disabled) return;
      go(b.getAttribute('data-go'));
    });
  }
}

/* ---------------- 허브의 작은 모달 ---------------- */
function modal(html) {
  var old = document.querySelector('.hveil'); if (old) old.remove();
  var v = document.createElement('div');
  v.className = 'hveil';
  v.innerHTML = '<div class="hsheet"><button type="button" class="hclose">닫기</button>' + html + '</div>';
  v.addEventListener('click', function (ev) {
    if (ev.target === v || (ev.target.className === 'hclose')) v.remove();
  });
  document.body.appendChild(v);
}
function aboutHtml() {
  return '<h3>루키랩 정석 「세포편」</h3>' +
    '<p>세 실험이 한 질문의 세 조각입니다. <b>세포가 살아 있다는 것은 무엇인가.</b></p>' +
    '<div class="habt"><b>1부 삼투</b> 세포에는 안과 밖을 가르는 <b>막</b>이 있고 막이 물의 출입을 고른다. ' +
    '— 그럼 막 안쪽은 한 칸인가?</div>' +
    '<div class="habt"><b>2부 세포분획법</b> 안은 여러 <b>방(소기관)</b>으로 나뉘고 방마다 하는 일이 다르다. ' +
    '— 소기관이 일을 하나, 그 안의 무엇이 하나?</div>' +
    '<div class="habt"><b>3부 효소</b> 방 안에서 <b>일을 굴리는 것은 효소</b>이고 조건이 속도를 정한다.</div>' +
    '<p class="muted">교과서는 미래엔 『세포와 물질대사』입니다. 삼투 40~43쪽, 세포분획법 25쪽과 86쪽, ' +
    '효소 67~73쪽(억제제는 71쪽). 진행은 이 브라우저에만 저장되고, 편마다 저장 칸이 따로입니다.</p>' +
    '<p class="muted">처음 상태로 되돌리려면 연구소 화면 맨 아래 <b>「처음부터 다시」</b>를 누르거나, ' +
    '주소 뒤에 <b>?new</b> 를 붙여 여십시오(예: <code>…/rookielab-cell/?new</code>). ' +
    '한 번 지운 뒤에는 주소에서 표가 저절로 떨어지므로 그 뒤로는 평소처럼 저장됩니다.</p>';
}
function noteHtml() {
  var out = '';
  JOBS.concat([{ id: 'sum', key: HKEY, n: '종합 보고서' }]).forEach(function (j) {
    var d = readLab(j.key);
    var ns = (d && d._notes) || [];
    out += '<h4>' + esc(j.n) + '</h4>';
    out += ns.length
      ? ns.map(function (n) { return '<div class="hnoteit"><b>' + esc(n.t) + '</b><pre>' + esc(n.x) + '</pre></div>'; }).join('')
      : '<p class="muted">아직 기록이 없습니다.</p>';
  });
  return '<h3>실험노트 — 세포편 전체</h3>' + out +
    '<button type="button" class="hcopy">전체 복사</button>';
}

/* ---------------- 편 켜기 ---------------- */
function labBar(id) {
  /* 편 안에서 허브로 돌아가는 단추를 머리띠에 끼운다 */
  var menu = document.getElementById('menu');
  if (!menu) return;
  var b = document.createElement('button');
  b.type = 'button'; b.id = 'btnHub'; b.title = '연구소로';
  b.innerHTML = '<span class="mi">←</span><span class="ml">연구소</span>';
  b.addEventListener('click', function () { go(''); });
  menu.insertBefore(b, menu.firstChild);
}

function boot() {
  var id = (location.hash || '').replace('#', '');
  var j = null;
  for (var i = 0; i < JOBS.length; i++) if (JOBS[i].id === id) j = JOBS[i];
  if (id === 'sum' && VLAB.has('sum')) {
    document.body.classList.add('inlab');
    VLAB.start({ key: HKEY, lab: 'sum' });
    labBar('sum');
    return;
  }
  if (j && VLAB.has(j.id)) {
    document.body.classList.add('inlab');
    VLAB.start({ key: j.key, lab: j.id });
    labBar(j.id);
    return;
  }
  paintHub();
  document.addEventListener('click', function (ev) {
    var c = ev.target;
    if (c && c.className === 'hcopy') {
      var txt = '[루키랩 정석 세포편]\n\n';
      JOBS.concat([{ key: HKEY, n: '종합 보고서' }]).forEach(function (jj) {
        var d = readLab(jj.key), ns = (d && d._notes) || [];
        if (!ns.length) return;
        txt += '== ' + jj.n + ' ==\n' + ns.map(function (n) { return '■ ' + n.t + '\n' + n.x; }).join('\n\n') + '\n\n';
      });
      try {
        navigator.clipboard.writeText(txt);
        c.textContent = '복사했습니다';
      } catch (e) { c.textContent = '복사하지 못했습니다'; }
    }
  });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();

</script>
</body>
</html>
