  /* 조작판이 지금 어느 쪽에 있는가.
     넓은 화면에서는 무대 **오른쪽**에 붙고, 900 px 아래에서는 무대 **아래**로 내려간다
     (공용.css 의 @media max-width:900px). 그런데 안내문에 「오른쪽에서 …」라고 박아 두면
     **휴대폰에서는 틀린 말이 된다.** 아이들은 오른쪽을 찾다가 못 찾는다.
     무대 안내는 매 프레임 다시 그리므로, 이 함수를 부르면 화면을 돌려도 말이 따라 바뀐다. */
  /* ---- ④ 끌기 표시 ----
     「끌어서 …하세요」라고 써 놓고 끌 물건에 아무 표시가 없으면 아이들은 못 찾는다.
     (접안렌즈가 회색 알약처럼 놓여 있기만 했다.)
       grab   끌 것 — 맥박처럼 커졌다 작아지는 점선 고리 + 손 모양
       target 놓을 자리 — 진한 점선 상자 + 위에서 톡톡 뛰는 화살표
       ghost  처음 몇 초, 반투명 유령이 「여기서 여기로」 움직인다. 말 없이도 안다.
     장면은 그리기 콜백 안에서 한 줄씩 부른다. t 는 장면이 뜬 뒤 초. */
  grab: function (c, x, y, r, t) {
    t = t || 0;
    var ph = (Math.sin(t * 3.2) + 1) / 2;            /* 0..1 맥박 */
    c.save();
    c.setLineDash([7, 6]); c.lineDashOffset = -t * 30;
    c.strokeStyle = 'rgba(255,92,92,.9)'; c.lineWidth = 3;
    c.beginPath(); c.arc(x, y, r + 7 + ph * 5, 0, 6.283); c.stroke();
    c.setLineDash([]);
    /* 손 — 오른쪽 아래에 작게. 검지 하나 세운 모양 */
    /* 손은 오른쪽 **위**에. 아래에 두면 물건 밑에 붙는 이름표를 가린다. */
    var hx = x + r * 0.75 + 6, hy = y - r * 0.75 - 4 + ph * 3;
    c.fillStyle = '#fff8e6'; c.strokeStyle = '#181322'; c.lineWidth = 2.2; c.lineJoin = 'round';
    c.beginPath();
    c.moveTo(hx - 9, hy + 2); c.lineTo(hx - 9, hy + 12); c.quadraticCurveTo(hx - 9, hy + 20, hx, hy + 20);
    c.lineTo(hx + 8, hy + 20); c.quadraticCurveTo(hx + 14, hy + 20, hx + 14, hy + 12);
    c.lineTo(hx + 14, hy + 4); c.lineTo(hx + 4, hy + 4);
    c.lineTo(hx + 4, hy - 12); c.quadraticCurveTo(hx + 4, hy - 17, hx - 1, hy - 17);
    c.quadraticCurveTo(hx - 6, hy - 17, hx - 6, hy - 12); c.lineTo(hx - 6, hy + 2); c.closePath();
    c.fill(); c.stroke();
    c.restore();
  },
  target: function (c, x, y, w, h, t) {
    t = t || 0;
    var ph = (Math.sin(t * 3.2) + 1) / 2;
    c.save();
    c.fillStyle = 'rgba(95,214,138,.16)';
    c.strokeStyle = 'rgba(24,19,34,.85)'; c.lineWidth = 2.6;
    c.setLineDash([8, 6]); c.lineDashOffset = -t * 30;
    c.beginPath(); c.rect(x - w / 2, y - h / 2, w, h); c.fill(); c.stroke();
    c.setLineDash([]);
    /* 위에서 톡톡 뛰는 화살표. **놓을 자리가 캔버스 위 끝에 붙어 있으면** 화살표가 잘리므로
       아래에서 위를 가리키게 뒤집는다(삼투 잎 장면의 맨 위 받침 유리에서 잘렸다). */
    c.fillStyle = '#ff5c5c'; c.strokeStyle = '#181322'; c.lineWidth = 2; c.lineJoin = 'round';
    if (y - h / 2 - 36 >= 0) {
      var ay = y - h / 2 - 12 - ph * 6;
      c.beginPath(); c.moveTo(x, ay); c.lineTo(x - 9, ay - 12); c.lineTo(x - 4, ay - 12);
      c.lineTo(x - 4, ay - 22); c.lineTo(x + 4, ay - 22); c.lineTo(x + 4, ay - 12); c.lineTo(x + 9, ay - 12);
      c.closePath(); c.fill(); c.stroke();
    } else {
      /* 아래에 두면 다음 칸 안에 들어가 **그 칸을 가리키는 것처럼** 보였다(삼투 받침 유리 B).
         왼쪽 옆에서 오른쪽을 가리키게 한다. 끌어오는 물건이 대개 왼쪽에 있다. */
      var ax = x - w / 2 - 12 - ph * 6;
      c.beginPath(); c.moveTo(ax, y); c.lineTo(ax - 12, y - 9); c.lineTo(ax - 12, y - 4);
      c.lineTo(ax - 22, y - 4); c.lineTo(ax - 22, y + 4); c.lineTo(ax - 12, y + 4); c.lineTo(ax - 12, y + 9);
      c.closePath(); c.fill(); c.stroke();
    }
    c.restore();
  },
  /* 유령 자리. 장면이 뜬 뒤 delay 초 쉬었다가 dur 초 동안 from→to 로 loops 번 움직인다.
     그 뒤에는 null — 유령이 영영 떠다니면 진짜 물건과 헷갈린다. */
  ghost: function (t, from, to, opt) {
    opt = opt || {};
    var delay = opt.delay == null ? 0.7 : opt.delay, dur = opt.dur || 1.5, loops = opt.loops || 2, gap = 0.5;
    var u = (t || 0) - delay;
    if (u < 0) return null;
    var per = dur + gap, n = Math.floor(u / per);
    if (n >= loops) return null;
    var k = (u - n * per) / dur;
    if (k >= 1) return null;                          /* 쉬는 틈 */
    var e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;   /* 부드럽게 */
    var a = k < .15 ? k / .15 : k > .85 ? (1 - k) / .15 : 1;
    return { x: from.x + (to.x - from.x) * e, y: from.y + (to.y - from.y) * e, a: 0.5 * a };
  },

  /* ---- 안전 장비 무대 (2026-09-09) ----
     「단순 체크가 아니라 옆에 귀여운 캐릭터를 그리고, 누르면 캐릭터에게 장갑이 끼워지고
     마스크가 씌워지게」. 여섯 편의 안전 장면이 이 하나를 부른다.
       왼쪽 — 연구원 캐릭터. 오른쪽 — 장비 카드. 카드를 누르면 캐릭터가 그 자리에서 입는다.
     opts = { items:[{k,n}], gear:D.gear, onToggle:fn(k,on) }.  E.dbg 에 hit 을 남긴다(검사용) */
  gearStage: function (host, opts) {
    var items = opts.items, g = opts.gear, cv = E.canvas(host);
    var hit = [], pt = {}, tNow = 0, waveAt = -9;
    function pk(dt) { return dt < 0 ? 1 : dt < .12 ? 0.5 + dt / .12 * 0.85 : dt < .32 ? 1.35 - (dt - .12) / .2 * .35 : 1; }
    cv.on(function (c, w, h, t) {
      tNow = t;
      var n = items.length, done = items.filter(function (it) { return g[it.k]; }).length;
      var narrow = w < 560;
      /* 캐릭터 — 왼쪽. 키는 국소 6.4단위 */
      var ax = narrow ? w * .27 : w * .30, u = Math.min((h - 76) / 6.6, (narrow ? w * .22 : w * .26) / 3.2);
      drawAvatar(c, ax, h - 16, u / 20, g, pt, t, done === n, waveAt);
      chipText(c, ax, Math.max(16, h - 16 - u * 6.6 - 22), done === n ? '준비 끝!' : '신입 연구원', done === n ? '#5fd68a' : '#fff8e6', 12);
      /* 장비 카드 — 오른쪽에 격자로 */
      var cols = n >= 3 ? 2 : 1, rows = Math.ceil(n / cols);
      var gx0 = narrow ? w * .50 : w * .50, gw = w - gx0 - 8;
      var cellW = gw / cols, cellH = (h - 36) / rows;
      var R = Math.min(narrow ? 34 : 50, cellW * .34, cellH * .30);
      hit = [];
      items.forEach(function (it, i) {
        var col = i % cols, row = Math.floor(i / cols);
        var bx = gx0 + cellW * (col + .5), by = 10 + cellH * (row + .5) - 4;
        hit.push({ k: it.k, x: bx, y: by, r: R });
        var on = !!g[it.k];
        c.save();
        if (!on) c.translate(0, Math.sin(t * 2 + i) * 3);
        var k = pk(pt[it.k] == null ? -9 : t - pt[it.k]);
        c.translate(bx, by); c.scale(k, k); c.translate(-bx, -by);
        c.fillStyle = 'rgba(0,0,0,.30)';
        c.beginPath(); c.arc(bx + 4, by + 4, R, 0, 6.283); c.fill();
        c.beginPath(); c.arc(bx, by, R, 0, 6.283);
        c.fillStyle = on ? '#bff0d4' : '#fff8e6'; c.fill();
        c.lineWidth = 3; c.strokeStyle = '#181322';
        c.setLineDash(on ? [] : [7, 6]); c.stroke(); c.setLineDash([]);
        drawGearIcon(c, it.k, bx, by, R * .9, on);
        c.restore();
        chipText(c, bx, by + R + 18, it.n, on ? '#5fd68a' : '#fff8e6', R < 40 ? 10.5 : 12);
        if (on) {
          c.save(); c.beginPath(); c.arc(bx + R * .7, by - R * .7, 11, 0, 6.283);
          c.fillStyle = '#5fd68a'; c.fill(); c.strokeStyle = '#181322'; c.lineWidth = 2.4; c.stroke();
          c.strokeStyle = '#181322'; c.lineWidth = 3; c.lineCap = 'round'; c.lineJoin = 'round';
          c.beginPath(); c.moveTo(bx + R * .7 - 5, by - R * .7); c.lineTo(bx + R * .7 - 1, by - R * .7 + 4); c.lineTo(bx + R * .7 + 6, by - R * .7 - 4); c.stroke();
          c.restore();
        } else E.grab(c, bx, by, R, t + i);
      });
      E.hint(host, done === n ? '다 갖췄습니다' : '장비를 눌러 입혀 주세요 (' + done + '/' + n + ')');
      /* 검사용 자리는 다 잰 **뒤에** 남긴다. 앞에서 남기면 한 프레임 전 자리가 남는다 */
      E.dbg = { n: 'safety', hit: hit, M: { hit: hit } };
    });
    E.drag(cv.cv, {
      start: function (ev) {
        var p = cv.pt(ev);
        for (var i = 0; i < hit.length; i++) {
          var tg = hit[i];
          if (dist(p.x, p.y, tg.x, tg.y) < tg.r + 6) {
            g[tg.k] = g[tg.k] ? 0 : 1; save(); E.buzz(14);
            pt[tg.k] = tNow;
            if (g[tg.k]) {

/* ---------------- 진행 레일 ---------------- */
function drawRail() {
  var r = $('#rail'); r.innerHTML = '';
  var chaps = [], seen = {};
  SC.forEach(function (s, i) {
    if (!seen[s.chap]) { seen[s.chap] = { name: s.chap, from: i, to: i }; chaps.push(seen[s.chap]); }
    else seen[s.chap].to = i;
  });
  chaps.forEach(function (c, n) {
    var st = idx > c.to ? 'fin' : (idx >= c.from ? 'on' : '');
    var b = el('button', { cls: 'rl ' + st, type: 'button' },
      el('span', { cls: 'dot' }, el('span', { text: String(n + 1) })),
      el('span', { text: c.name }));
    b.addEventListener('click', function () {
      if (c.from <= maxSeen()) go(c.from);
      else E.toast('앞 단계를 먼저 마쳐야 해요', 'bad');
    });
    r.appendChild(b);
  });
  var on = $('.rl.on', r);
  if (on) { var l = on.offsetLeft - r.clientWidth / 2 + on.offsetWidth / 2; r.scrollTo({ left: Math.max(0, l), behavior: 'smooth' }); }
}
function maxSeen() { D._max = Math.max(D._max || 0, idx); return D._max; }

/* 지금 무대에 살아 있는 캔버스들 */
var LIVE = [];
function refitAll() { LIVE.forEach(function (c) { try { c.refit && c.refit(); } catch (e) {} }); }
/* 검사용 — 살아 있는 캔버스를 지금 크기로 한 번 다시 그린다. 헤드리스 크롬은 rAF 가 거의 안 돌아
   장면이 상태를 바꾼 뒤의 좌표(연필 자리 등)가 안 잡힌다. 검사가 누른 뒤에 이걸 부른다 */
E.repaint = refitAll;

/* ---------------- 장면 전환 ---------------- */
function go(n) {
  n = clamp(n, 0, SC.length - 1);
  if (cur && cur.unmount) { try { cur.unmount(); } catch (e) {} }
  loops.forEach(function (o) { o.stop(); }); loops = [];
  idx = n; cur = SC[idx]; maxSeen();
  funReset();
  var stage = $('#stage'), panel = $('#panel');
  stage.innerHTML = ''; panel.innerHTML = '';
  panel.scrollTop = 0;
  /* 무대는 이제 **세로 두 칸**이다 — 위 #play(그림), 아래 #ctrl(조작판).
     장면에는 #play 를 「무대」로 넘긴다. 캔버스도 안내 띠도 그 안에 담긴다.
     브라우저가 한 번에 자리를 잡으므로 캔버스 크기가 도중에 흔들리지 않는다. */
  /* 무대를 비우면 지난 장면의 캔버스는 그냥 버려진다(stop 을 안 부르는 장면도 있다).
     목록에 남겨 두면 없는 것을 다시 재려 든다. 여기서 비운다. */
  LIVE.length = 0;
  var play = el('div'); play.id = 'play';
  stage.appendChild(play);
  makeCtrl(stage);
  qzMake(stage);
  E.gate(true);
  E.guide(cur.guide || '');
  E.sceneId = cur.id; E.sceneIdx = idx; E.sceneCount = SC.length; E.drawError = null;
  $('#stepno').textContent = (idx + 1) + ' / ' + SC.length;
  $('#btnPrev').disabled = idx === 0;
  $('#btnNext').textContent = idx === SC.length - 1 ? '마침' : '다음 →';
  try {
    cur.mount(play, panel);
    /* **첫 가르기는 기다리지 않고 바로 한다.**
       지켜보다 다음 프레임에 가르면, 그 한 프레임 동안 조작판이 비어 있어 그림이 무대를 다 쓰다가
       카드가 들어오는 순간 줄어든다. 그 틈에 장면이 잡아 둔 hit 상자는 **줄기 전 크기**라
       거기를 누르면 빗나간다. 검사가 돌릴 때마다 됐다 안 됐다 한 까닭이 이것이었고,
       학생에게도 첫 손짓이 한 번 헛나가는 것으로 나타난다. */
    splitPanel(true);
    sizeCtrlOnce();
    /* 카드가 무대 안으로 들어오며 캔버스가 줄었다. **줄어든 크기로 다시 재게 한다.**
       안 그러면 장면이 옛 크기로 그려 누르는 자리가 어긋난다. */
    refitAll();
    funScene(play, panel);
  } catch (e) {
    panel.innerHTML = '<div class="card"><h3>이 단계를 그리지 못했습니다</h3><p class="muted">' + esc(e.message) + '</p></div>';
    if (global.console) console.error(e);
  }
  drawRail(); save();
  storyBits();
}

/* ---------------- 조작판을 무대 안으로 ----------------
   **루키랩은 무대 하나 안에서 다 끝난다.** 판이 무대 위에 겹쳐 뜨고, 옆 날개는 읽는 것만 담는다.
   가상실험은 조작이 오른쪽 날개에 있어서 「눈은 무대, 손은 날개」로 갈라졌다.

   장면 열두 개 × 여섯 편의 mount() 를 뜯지 않고 이 문제를 없애려고,
   **엔진이 카드를 갈라 놓는다.** 장면은 예전처럼 #panel 에만 담으면 되고,
   그중 **누를 것이 든 카드만** 무대 안 조작판(#ctrl)으로 옮긴다. 나머지 읽는 카드는 날개에 남는다.

   [주의] 장면이 render() 로 #panel 을 다시 그리는 일이 잦다. 그래서 지켜보다가 다시 가른다.
   - 우리가 옮기느라 생긴 변화까지 보면 끝없이 돈다 → takeRecords 로 버린다
   - #panel 에서 무언가 **빠진** 변화면 장면이 다시 그리는 중이므로 조작판도 비우고 새로 담는다
     (그냥 두면 지난 판의 카드가 남는다) */
var ctrlObs = null, ctrlMoving = false, ctrlQueued = false, ctrlHard = false;

/* 누를 것이 들어 있는가. 이게 「조작」과 「읽는 것」을 가르는 기준이다.
   **체크리스트(.chk)도 조작판으로 보낸다.** 누를 것은 없지만 「지금 무엇을 해야 하는지」를
   말해 주는 길잡이라, 날개로 밀려나면 학생이 못 본다. 실제로 그랬다. */
var CTRL_SEL = 'button,input,select,textarea,.opt,.tool,.qz,[data-op],[data-dep],[data-keep],[data-fill],[data-read]';
function isCtrlCard(card) {
  /* 결과 카드(.result)는 누를 것이 없지만 무대 안 조작판에 둔다 — 폭죽 바로 아래,
     폰에서도 화면을 안 내려도 보이게. */
  return !!card.querySelector(CTRL_SEL) || !!card.querySelector('.chk') || card.classList.contains('result');
}
/* 든 조작이 **전부 잠겨 있는** 카드인가. 그러면 지금 단계 것이 아니다. */
function isLaterCard(card) {
  var ctl = card.querySelectorAll(CTRL_SEL);
  if (!ctl.length) return false;
  for (var i = 0; i < ctl.length; i++) if (!ctl[i].disabled) return false;
  return true;
}

function makeCtrl(stage) {
  if (ctrlObs) { ctrlObs.disconnect(); ctrlObs = null; }
  var oldc = $('#ctrl'); if (oldc && oldc._ao) { try { oldc._ao.disconnect(); } catch (e) {} }
  var c = el('div', { cls: '' });
  c.id = 'ctrl';
  stage.appendChild(c);
  var panel = $('#panel');
  ctrlObs = new MutationObserver(function (recs) {
    if (ctrlMoving) return;
    for (var i = 0; i < recs.length; i++) if (recs[i].removedNodes.length) ctrlHard = true;
    if (ctrlQueued) return;
    ctrlQueued = true;
    requestAnimationFrame(function () {
      ctrlQueued = false;
      var hard = ctrlHard; ctrlHard = false;
      splitPanel(hard);
    });
  });
  ctrlObs.observe(panel, { childList: true });
  /* 조작이 잠기거나 풀리면(disabled 가 바뀌면) 차례와 접기를 다시 매긴다. 높이는 안 건드린다. */
  var ao = new MutationObserver(function () { if (!ctrlMoving) orderCtrl(); });
  ao.observe(c, { attributes: true, attributeFilter: ['disabled'], subtree: true });
  c._ao = ao;
}

function splitPanel(hard) {
  var panel = $('#panel'), ctrl = $('#ctrl');
  if (!panel || !ctrl) return;
  ctrlMoving = true;
  if (hard) ctrl.innerHTML = '';
  Array.prototype.slice.call(panel.children).forEach(function (card) {
    if (isCtrlCard(card)) ctrl.appendChild(card);
  });
  /* 확인 문항 길잡이 카드는 장면 카드가 아니라 엔진 것이다. hard 로 비웠으면 다시 넣는다
     (정리 장면에서 이 카드가 사라져 「정리 문항 풀기」가 안 보였다) */
  if (QZ.card && qzHas() && QZ.card.parentNode !== ctrl) ctrl.appendChild(QZ.card);
  orderCtrl();
  if (ctrlObs) ctrlObs.takeRecords();     /* 우리가 만든 변화는 버린다 */
  ctrlMoving = false;
}

/* ② 조작판 안 차례와 접기.
   체크리스트(길잡이) → 지금 쓸 수 있는 조작 → 아직 못 쓰는 조작(접힘) 순서다.
   「접안렌즈를 끼우세요」 단계에 초점 막대가 맨 위에 크게 떠 있던 것을 이걸로 고쳤다. */
function orderCtrl() {
  var ctrl = $('#ctrl'); if (!ctrl) return;
  ctrlMoving = true;
  var cards = Array.prototype.slice.call(ctrl.children);
  cards.forEach(function (c) {
    if (c.classList.contains('qzcard')) return;
    var steps = !!c.querySelector('.chk');
    c.classList.toggle('steps', steps);
    c.classList.toggle('later', !steps && isLaterCard(c));
  });
  /* 확인 문항 길잡이 카드 — 풀 차례면 맨 위, 아니면 맨 아래 */
  var rank = function (c) {
    if (c.classList.contains('qzcard')) return c.classList.contains('pend') ? -1 : 1.5;
    return c.classList.contains('steps') ? 0 : c.classList.contains('later') ? 2 : 1;
  };
  var sorted = cards.slice().sort(function (a, b) { return rank(a) - rank(b); });
  var changed = sorted.some(function (c, i) { return c !== cards[i]; });
  if (changed) sorted.forEach(function (c) { ctrl.appendChild(c); });
  ctrlMoving = false;
}

/* 조작판 높이를 **장면마다 한 번** 정한다.
   내용을 따라가게 두면 단추를 누를 때마다 판이 커졌다 작아지고 위 그림이 튄다.
   그렇다고 늘 40% 로 박아 두면 막대 하나뿐인 장면에서 자리를 버린다.
   그래서 **접힌 카드까지 다 편 높이**를 재서 그 크기로 고정한다. 나중에 카드가 펴져도 자리가 있다. */
function sizeCtrlOnce() {
  var stage = $('#stage'), ctrl = $('#ctrl'); if (!stage || !ctrl) return;
  if (!ctrl.children.length) { ctrl.style.flexBasis = ''; return; }
  var laters = Array.prototype.slice.call(ctrl.querySelectorAll('.card.later'));
  laters.forEach(function (c) { c.classList.remove('later'); });
  /* 확인 문항 길잡이 카드(qzcard)는 자리를 미리 잡지 않는다 — 폰에서 70px 을 그림에서 뺏는다.
     손일이 끝나 나타날 때는 맨 위에 오므로 판이 굴러가도 그 카드는 보인다 */
  ctrl.style.flexBasis = 'auto';
  var need = ctrl.scrollHeight + 2;
  laters.forEach(function (c) { c.classList.add('later'); });
  var H = stage.getBoundingClientRect().height || 1;
  /* max-height 를 % 로 두면 getComputedStyle 이 「46%」라는 **글자**를 돌려준다.
     parseFloat 하면 46(px) 이 되어 상한이 46px 로 잡힌다. 실제로 그래서 판이 최소치에 붙었다.
     % 면 무대 높이에 곱해서 px 로 만든다. */
  var mh = getComputedStyle(ctrl).maxHeight, cap;
  if (/%$/.test(mh)) cap = H * parseFloat(mh) / 100;
  else cap = parseFloat(mh) || H * 0.4;
  var lo = Math.round(H * 0.18);
  ctrl.style.flexBasis = Math.max(lo, Math.min(cap, need)) + 'px';
}

/* ==================== 재미 층 ====================
   「첫 버전(루키랩)만큼 재미가 없다」 — 맞는 말이었다. 절차만 있고 **되돌아오는 것**이 없었다.
   루키랩에서 재미를 만들던 것 다섯을 엔진 한 곳에 넣어 여섯 편이 다 받게 한다.
     소리      맞으면 띵, 틀리면 부웅, 장면을 마치면 팡파르 (루키랩 beep 이식, ♪ 로 끈다)
     폭죽      무대 위 투명 캔버스 한 장. 장면을 마치면 터지고 「+50」이 떠오른다
     점수      상단바 칩. 장면 완료 +50, 문항 첫 번 정답 +30(아니면 +10), 실수 -5
     선임 반응  맞으면 얼굴이 통통 튀고 틀리면 흔들린다
     결과 카드  마지막 장면에 등급 S/A/B/C, 실수, 걸린 시간, 선임 한마디
   목숨과 제한 시간은 넣지 않았다. 이쪽은 「정석 실험」이라 서두르게 하면 안 된다. */
var AC = null, sndOn = true, gateWasLocked = false, funBound = false;
var fxCv = null, fxCtx = null, parts = [], fxRaf = 0, fxLast = 0, lastGoAt = 0;
try { sndOn = localStorage.getItem('vlab_snd') !== '0'; } catch (e) {}

function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') { try { AC.resume(); } catch (e) {} }
  return AC;
}
/* pick · good · bad · clear(팡파르 짧게) · fanfare(끝) */
function beep(type) {
  if (!sndOn) return;
  var c = ac(); if (!c) return;
  var t = c.currentTime;
  function tone(f0, f1, dur, kind, vol, delay) {
    try {
      var o = c.createOscillator(), g = c.createGain();
      o.type = kind || 'triangle';
      o.frequency.setValueAtTime(f0, t + (delay || 0));
      o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + (delay || 0) + dur);
      g.gain.setValueAtTime(0.0001, t + (delay || 0));
      g.gain.exponentialRampToValueAtTime(vol || 0.16, t + (delay || 0) + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (delay || 0) + dur);
      o.connect(g); g.connect(c.destination);
      o.start(t + (delay || 0)); o.stop(t + (delay || 0) + dur + 0.02);
    } catch (e) {}
  }
  function noise(dur, vol) {
    try {
      var n = c.sampleRate * dur, buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      var src = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
      src.buffer = buf; f.type = 'bandpass'; f.frequency.value = 1400;
      g.gain.value = vol || 0.10;
      src.connect(f); f.connect(g); g.connect(c.destination); src.start(t);
    } catch (e) {}
  }
  if (type === 'pick') tone(660, 990, 0.10, 'square', 0.11);
  else if (type === 'good') { tone(720, 1080, 0.09, 'triangle', 0.15); tone(1080, 1440, 0.12, 'triangle', 0.12, 0.07); }
  else if (type === 'bad') { tone(220, 90, 0.26, 'sawtooth', 0.14); noise(0.16, 0.09); }
  else if (type === 'clear') { tone(523, 523, 0.10, 'triangle', 0.15); tone(659, 659, 0.10, 'triangle', 0.15, 0.10); tone(784, 1046, 0.22, 'triangle', 0.16, 0.20); }
  else if (type === 'tick') tone(1900, 1500, 0.025, 'square', 0.045);
  else if (type === 'snap') { tone(1400, 800, 0.035, 'square', 0.13); tone(2400, 1700, 0.05, 'square', 0.10, 0.05); }
  else if (type === 'thud') { tone(150, 55, 0.2, 'sine', 0.22); noise(0.09, 0.07); }
  else if (type === 'whoosh') noise(0.2, 0.06);
  else if (type === 'fanfare') {
    [[523, 0], [659, .12], [784, .24], [1046, .36], [1318, .52]].forEach(function (p) { tone(p[0], p[0], 0.18, 'triangle', 0.15, p[1]); });
    tone(1568, 1568, 0.5, 'triangle', 0.12, 0.7);
  }
}
function sndToggle() {
  sndOn = !sndOn;
  try { localStorage.setItem('vlab_snd', sndOn ? '1' : '0'); } catch (e) {}
  sndPaint();
  if (sndOn) beep('pick');
}
function sndPaint() {
  var b = $('#btnSnd'); if (!b) return;
  b.classList.toggle('off', !sndOn);
  b.title = sndOn ? '효과음 끄기' : '효과음 켜기';
}

/* ---- 폭죽 ---- */
function fxAttach(play) {
  parts = [];
  fxCv = el('canvas', { cls: 'fxc' }); fxCtx = fxCv.getContext('2d');
  play.appendChild(fxCv);          /* 장면 캔버스 **뒤에** 붙는다. 검사는 첫 캔버스를 잡는다 */
  fxFit();
}
function fxFit() {
  if (!fxCv) return;

/* ================================================================
   검정말 잎세포 모형
   ----------------------------------------------------------------
   검정말 잎은 세포가 벽돌처럼 규칙적으로 늘어서 있다.
   길이 단위는 마이크로미터(µm). 세포 90 µm × 34 µm, 엽록체 지름 4~7 µm 로 잡은
   학습용 값이다. 시야 지름은 120000/배율 µm 로 두어 다른 실험과 맞췄다
   (100배 1200 µm, 400배 300 µm — 실제 현미경보다 조금 좁게 잡은 학습용 값).
   ================================================================ */
var FIELD_W = 2400, FIELD_H = 1700;
var CW = 90, CH = 34;                      /* 세포 한 개의 길이와 폭 (µm) */
var WALL = 2.2;                            /* 세포벽 두께 (µm) */
function fovUm(mag) { return 120000 / mag; }

var fieldCache = null;
function leafField() {
  if (fieldCache) return fieldCache;
  var r = E.rng(5150), cells = [];
  var ny = Math.ceil(FIELD_H / CH) + 1, nx = Math.ceil(FIELD_W / CW) + 2;
  for (var j = 0; j < ny; j++) {
    var off = (j % 2) * CW * .5;
    for (var i = 0; i < nx; i++) {
      var x = i * CW + off + (r() - .5) * 2.5;
      var y = j * CH + (r() - .5) * 1.6;
      if (x > FIELD_W + CW || y > FIELD_H + CH) continue;
      var chl = [], n = 10 + Math.floor(r() * 5);
      for (var k = 0; k < n; k++) {
        /* 엽록체 자리는 원형질 크기에 대한 비율(-1~1)로 저장한다.
           원형질이 줄어들면 엽록체도 함께 안쪽으로 모인다. */
        var a = r() * 6.2832, d = .45 + r() * .5;
        chl.push({ u: Math.cos(a) * d, v: Math.sin(a) * d * .82, r: 2.1 + r() * 1.4 });
      }
      cells.push({ x: x, y: y, chl: chl });
    }
  }
  fieldCache = cells;
  return cells;
}

/* 분리도 p (0 = 세포막이 세포벽에 붙음, 1 = 최대 원형질분리) 에 대한 원형질 크기 */
function protoW(p) { return (CW - WALL * 2) * (1 - .42 * p); }
function protoH(p) { return (CH - WALL * 2) * (1 - .22 * p); }

/* 시야 한 판을 그린다. 낱개로 칠하면 100배에서 휴대폰이 못 버티므로
   보이는 것만 골라 한 경로에 모아 한 번씩 칠한다. */
function drawField(c, cells, o) {
  var p = o.p, ppu = o.ppu, ox = o.ox, oy = o.oy;
  var vx = o.R / ppu + CW, vy = o.R / ppu + CH;
  var vis = [];
  for (var i = 0; i < cells.length; i++) {
    var cl = cells[i];
    if (Math.abs(cl.x - ox) > vx || Math.abs(cl.y - oy) > vy) continue;
    vis.push(cl);
  }
  /* 세포벽 — 바깥 윤곽 */
  c.beginPath();
  vis.forEach(function (cl) { rrp(c, cl.x - CW / 2, cl.y - CH / 2, CW, CH, 6); });
  c.fillStyle = o.gap || 'rgba(224,236,216,.95)';
  c.fill();
  c.lineWidth = WALL; c.strokeStyle = '#7d9a6a'; c.stroke();

  /* 원형질 — 세포막 안쪽 */
  var pw = protoW(p), ph = protoH(p);
  var rad = 3 + (Math.min(pw, ph) * .45 - 3) * p;
  c.beginPath();
  vis.forEach(function (cl) { rrp(c, cl.x - pw / 2, cl.y - ph / 2, pw, ph, rad); });
  c.fillStyle = o.detail ? 'rgba(212,236,202,.96)' : 'rgba(126,180,116,.96)';
  c.fill();
  c.lineWidth = 1.3; c.strokeStyle = '#2c6b34'; c.stroke();

  /* 엽록체는 알갱이가 충분히 클 때만 낱개로 그린다 */
  if (o.detail) {
    c.beginPath();
    vis.forEach(function (cl) {
      cl.chl.forEach(function (g) {
        var gx = cl.x + g.u * (pw / 2 - g.r - 1.2);
        var gy = cl.y + g.v * (ph / 2 - g.r - 1.2);
        c.moveTo(gx + g.r, gy);
        c.ellipse(gx, gy, g.r, g.r * .82, 0, 0, Math.PI * 2);
      });
    });
    c.fillStyle = '#2f7d3a'; c.fill();
  }
  return vis;
}

/* 크게 그리는 세포에 쓸 엽록체 배치. 시야용 세포를 그대로 키우면 한쪽에 몰려 보여
   따로 고르게 퍼뜨린 것을 쓴다. */
var BIG_CHL = null;
function bigChl() {
  if (BIG_CHL) return BIG_CHL;
  var r = E.rng(2468), g = [], guard = 0;
  while (g.length < 12 && guard++ < 5000) {
    var u = (r() * 2 - 1) * .92, v = (r() * 2 - 1) * .80;
    if (u * u + v * v > 1.05) continue;
    var far = true;
    for (var i = 0; i < g.length; i++) {
      if (Math.abs(g[i].u - u) < .30 && Math.abs(g[i].v - v) < .40) { far = false; break; }
    }
    if (!far) continue;
    g.push({ u: u, v: v, r: 2.3 + r() * 1.2 });
  }
  BIG_CHL = g;
  return g;
}

/* 네 변이 바깥으로 b 만큼 휘는 둥근 네모. 팽압으로 세포벽이 밀리는 것을 보이는 데 쓴다 */
function bowRect(c, x, y, w, h, r, b) {
  b = (b || 0) * 2;
  r = Math.min(r, Math.min(w, h) / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.quadraticCurveTo(x + w / 2, y - b, x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.quadraticCurveTo(x + w + b, y + h / 2, x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.quadraticCurveTo(x + w / 2, y + h + b, x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.quadraticCurveTo(x - b, y + h / 2, x, y + r);
  c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

/* 세포 한 개를 크게 그린다 (결과 정리·원형질복귀 장면용).
   o.bow 를 주면 세포벽과 원형질이 바깥으로 휜다 — 저장액에서 팽압이 벽을 미는 그림 */
function drawBigCell(c, cx, cy, W, H, p, chl, o) {
  o = o || {};
  var sx = W / CW, sy = H / CH;
  var bow = o.bow || 0;
  c.save();
  /* 세포벽 — 굵은 검은 외곽선 안에 벽 색 띠 */
  bowRect(c, cx - W / 2 + 4, cy - H / 2 + 6, W, H, 10 * sx, bow);
  c.fillStyle = 'rgba(24,19,34,.28)'; c.fill();
  bowRect(c, cx - W / 2, cy - H / 2, W, H, 10 * sx, bow);
  c.fillStyle = o.gap || '#dbe9d2'; c.fill();
  c.lineWidth = WALL * sx * 1.1 + 5; c.strokeStyle = INK; c.lineJoin = 'round'; c.stroke();
  c.lineWidth = WALL * sx * 1.1; c.strokeStyle = '#7d9a6a'; c.stroke();
  /* 원형질 */
  var pw = protoW(p) * sx, ph = protoH(p) * sy;
  var rad = (3 + (Math.min(protoW(p), protoH(p)) * .45 - 3) * p) * sx;
  bowRect(c, cx - pw / 2, cy - ph / 2, pw, ph, rad, bow);
  c.fillStyle = '#d3ecca'; c.fill();
  c.lineWidth = Math.max(1.8, 1.3 * sx); c.strokeStyle = '#2c6b34'; c.stroke();
  /* 엽록체 */
  var pts = [];
  c.beginPath();
  chl.forEach(function (g) {
    var gx = cx + g.u * (pw / 2 - g.r * sx - 3);
    var gy = cy + g.v * (ph / 2 - g.r * sx - 3);
    var rr2 = g.r * sx;
    pts.push({ x: gx, y: gy, r: rr2 });
    c.moveTo(gx + rr2, gy);
    c.ellipse(gx, gy, rr2, rr2 * .82, 0, 0, Math.PI * 2);
  });
  c.fillStyle = '#2f7d3a'; c.fill();
  c.restore();
  return { pw: pw, ph: ph, chl: pts };
}

/* ---------------- 데이터 기본값 ---------------- */
function prep() {
  if (D.gear === undefined) D.gear = { coat: 0, glove: 0 };
  if (D.leaf === undefined) D.leaf = { A: 0, B: 0, C: 0 };     /* 받침 유리에 올린 잎 */
  if (D.sol === undefined) D.sol = { B: 0, C: 0 };             /* 떨어뜨린 방울 수 */
  if (D.solBad === undefined) D.solBad = 0;                    /* 엉뚱한 곳에 떨어뜨렸는지 */
  if (D.dirty === undefined) D.dirty = 0;                      /* 스포이트에 묻은 용액 'W' 'S' 또는 0 */
  if (D.waited === undefined) D.waited = 0;
  if (D.cover === undefined) D.cover = { B: -1, C: -1 };       /* -1 아직 안 덮음, 그 밖은 기포 수 */
  if (D.blot === undefined) D.blot = 0;
  /* 거름종이를 B 와 C 따로 닦는다. 옛 저장값(D.blot === 1)은 「둘 다 닦음」으로 읽는다 */
  if (D.blotN === undefined) D.blotN = D.blot ? { B: 1, C: 1 } : { B: 0, C: 0 };
  if (D.seen === undefined) D.seen = { A: 0, B: 0, C: 0 };
  if (D.marks === undefined) D.marks = 0;
  if (D.markPts === undefined) D.markPts = [];               /* 표시한 세포의 좌표 */
  if (D.mag === undefined) D.mag = 100;
  if (D.tags === undefined) D.tags = {};                       /* 이름표 붙이기 결과 */
  if (D.rec === undefined) D.rec = 0;                          /* 원형질복귀 진행 0~1 */
  if (D.press === undefined) D.press = { turgor: 0, zero: 0 }; /* 그래프에서 읽은 값 */
  if (D.tonic === undefined) D.tonic = {};                     /* 살펴본 용액 */
  if (D.para === undefined) D.para = {};                       /* 짚신벌레를 살펴본 환경 */
}

function drawGear(c, k, x, y, r, on) {

    c.quadraticCurveTo(18, -13, 18, -9); c.lineTo(18, 18); c.lineTo(-18, 18);
    c.lineTo(-18, -9); c.quadraticCurveTo(-18, -13, -15, -14); c.closePath();
    c.fillStyle = '#f2f6fb'; c.fill(); c.strokeStyle = '#181322'; c.lineWidth = 1.6; c.stroke();
    c.beginPath(); c.moveTo(0, -13); c.lineTo(0, 18); c.stroke();
    c.beginPath(); c.moveTo(-6, -18); c.lineTo(0, -4); c.lineTo(6, -18); c.stroke();
  } else {
    [-1, 1].forEach(function (s) {
      c.save(); c.scale(s, 1); c.translate(9, 0);
      c.beginPath();
      c.moveTo(-8, 18); c.lineTo(-8, -2);
      c.quadraticCurveTo(-8, -6, -5, -6); c.quadraticCurveTo(-2, -6, -2, -2);
      c.lineTo(-2, -10); c.quadraticCurveTo(-2, -14, 1, -14); c.quadraticCurveTo(4, -14, 4, -10);
      c.lineTo(4, -6); c.quadraticCurveTo(4, -10, 7, -10); c.quadraticCurveTo(10, -10, 10, -6);
      c.lineTo(10, 18); c.closePath();
      c.fillStyle = '#dff0ff'; c.fill(); c.strokeStyle = '#181322'; c.lineWidth = 1.5; c.stroke();
      c.restore();

}

/* ================================================================
   장면 3. 검정말 잎 3개를 받침 유리에 올리기
   ================================================================ */
function scLeaf() {
  return {
    id: 'leaf', chap: '표본 만들기', name: '잎 떼어 올리기',
    guide: '검정말 줄기에서 <span class="hl">깜박이는 잎</span>을 핀셋으로 끌어 ' +
           '받침 유리 <b>A, B, C</b>에 한 장씩 올립니다.',
    mount: function (stage, panel) {
      var got = ['A', 'B', 'C'].map(function (k) { return !!D.leaf[k]; });
      var st = { taken: [false, false, false], drag: null, pt: {} };
      var used = got.filter(Boolean).length;
      for (var i = 0; i < used; i++) st.taken[i] = true;

      var cv = E.canvas(stage), M = { pts: [], slot: [] };
      cv.on(function (c, w, h, t) {
        E.dbg = { n: 'leaf', M: M, st: st };
        st.tNow = t;
        var s = Math.min(w * .26, h * .88) / 330;
        M.sx = w * .24; M.sy = h * .50; M.s = s;
        drawSprig(c, M.sx, M.sy, s, t, st.taken);

        /* 잡을 수 있는 잎의 화면 좌표 */
        M.pts = [];
        for (var k = 0; k < 3; k++) {
          var yy = M.sy + (120 - (k + 1) * 62) * s;
          M.pts.push({ x: M.sx + 34 * s + 26 * s, y: yy - 6 * s });
          if (!st.taken[k]) {
            c.save();
            c.globalAlpha = .3 + .35 * Math.sin(t * 3 + k);
            c.beginPath(); c.arc(M.pts[k].x, M.pts[k].y, 22 * Math.max(.7, s), 0, Math.PI * 2);
            c.strokeStyle = '#c3a8ff'; c.lineWidth = 1.6; c.stroke();
            c.restore();
          }
        }

        /* 받침 유리 3장. **높이에도 맞춘다.** 조작판이 무대 안에 들어온 뒤로 넓고 낮은 화면
           (가로 태블릿, 검사 창)에서는 캔버스가 275px 까지 낮아지는데, 180px 짜리 유리 셋을
           30% 간격으로 쌓으면 서로 겹쳐 **A 에 놓은 잎이 B 로 들어갔다.** 세 장이 h 안에 들어오게 잡는다. */
        var sw = Math.min(260, w * .34, h * .46), sh = sw * .60;
        M.slot = [];
        ['A', 'B', 'C'].forEach(function (k, i) {
          var x = w * .68, y = h * (.20 + i * .30);
          M.slot.push({ k: k, x: x, y: y, w: sw, h: sh });
          /* 끌고 있는 잎이 가까이 오면 그 유리만 밝아진다 — 자석이 당기는 자리 */
          var near = st.drag && E.dist(st.drag.p.x, st.drag.p.y, x, y) < sw * .62;
          drawSlide(c, x - sw / 2, y - sh / 2, sw, sh, { hi: !!near });
          /* 글자 칩은 오른쪽에. 왼쪽은 놓을 자리 화살표가 쓰는 자리다 */
          chip(c, x + sw / 2 + 20, y, k, D.leaf[k] ? '#5fd68a' : '#fff8e6', 14);
          if (D.leaf[k]) {
            var kk = popK(t - (st.pt[k] == null ? -9 : st.pt[k]));
            c.save(); c.translate(x, y); c.scale(kk, kk); c.translate(-x, -y);
            drawLeafShape(c, x, y, sw * .55, sh * .17, -.08, '#4aa055');
            c.restore();
          }
        });

        /* ④ 다음에 집을 잎 하나와 빈 받침 유리 하나만 짚어 준다. 셋 다 표시하면 또 헤맨다. */
        if (!st.drag) {
          var nk = -1, ni = -1;
          for (var q = 0; q < 3; q++) if (!st.taken[q]) { nk = q; break; }
          for (var q2 = 0; q2 < 3; q2++) if (!D.leaf[M.slot[q2].k]) { ni = q2; break; }
          if (nk >= 0 && ni >= 0) {
            var sl = M.slot[ni];
            E.target(c, sl.x, sl.y, sl.w, sl.h, t);
            var gl = E.ghost(t, M.pts[nk], { x: sl.x, y: sl.y });
            if (gl) { c.save(); c.globalAlpha = gl.a; drawLeafShape(c, gl.x, gl.y, 70, 14, -.15, '#4aa055'); c.restore(); }
            E.grab(c, M.pts[nk].x, M.pts[nk].y, 26, t);
          }
        }
        if (st.drag) {
          /* 그림은 자석에 끌린 자리(vis)를 따라온다. 판정은 손가락 자리(p)로 한다 */
          var dp = st.drag.vis || st.drag.p;
          drawLeafShape(c, dp.x, dp.y, 70, 14, -.15, '#4aa055');
          drawTweezer(c, dp.x, dp.y - 28);
        }
        var n = ['A', 'B', 'C'].filter(function (k) { return D.leaf[k]; }).length;
        E.hint(stage, n >= 3 ? '잎 3장을 모두 올렸습니다 — 다음은 용액 떨어뜨리기'
          : '잎을 끌어 받침 유리에 올리세요 (' + n + '/3)');
      });

      /* 손맛 — 빈 받침 유리 가까이 가면 자석처럼 당기고, 놓으면 찰칵. 놓인 잎은 0.3초 커졌다 제자리 */
      E.drag(cv.cv, {
        start: function (ev) {
          var p = cv.pt(ev);
          for (var k = 0; k < 3; k++) {
            if (st.taken[k]) continue;

            }

        },
        move: function (ev) {
          if (!st.drag) return;

          var vis = p;
          M.slot.forEach(function (s) {
            if (D.leaf[s.k]) return;

            if (d < s.w * .62) {
              var pull = 1 - d / (s.w * .62);                 /* 가까울수록 세게 */
              vis = { x: E.lerp(p.x, s.x, pull * .7), y: E.lerp(p.y, s.y, pull * .7) };
              if (!st.drag.near) { st.drag.near = s.k; E.beep('tick'); }
            } else if (st.drag.near === s.k) st.drag.near = null;
          });
          st.drag.vis = vis;
        },
        end: function (ev) {
          if (!st.drag) return;
          var g = st.drag; st.drag = null;
          var p = cv.pt(ev), hit = null;
          M.slot.forEach(function (s) {
            if (Math.abs(p.x - s.x) < s.w * .62 && Math.abs(p.y - s.y) < s.h * .85) hit = s;
          });
          if (!hit) { E.toast('받침 유리 위에 놓아라. 바닥에 두면 마른다.', 'bad'); return; }
          if (D.leaf[hit.k]) { E.toast('거긴 이미 한 장 있다. 빈 유리에 놓아라.', 'bad'); return; }

          st.pt[hit.k] = st.tNow || 0;
          D.leaf[hit.k] = 1; E.save(); E.buzz(18);
          E.beep('snap'); E.kick();
          E.burst(hit.x, hit.y, null, 12, 2.4);
          var n = ['A', 'B', 'C'].filter(function (k) { return D.leaf[k]; }).length;
          if (n >= 3) { E.beep('good'); E.pop(hit.x, hit.y - hit.h, '세 장 다!', '#127a5a', true); }
          E.toast(n >= 3 ? '됐다. 같은 줄기에서 세 장. 이제 용액이다.'
            : '받침 유리 ' + hit.k + '. 다음 잎.', 'good');
          sync();
        }
      });

      panel.innerHTML =
        '<div class="card"><h3>과정 1</h3>' +
        '<p>검정말 잎 3개 A~C를 떼어 각각 서로 다른 <b>받침 유리</b> 위에 올려놓는다.</p></div>' +
        '<div class="card"><h3>왜 검정말일까</h3>' +
        '<p>검정말 잎은 <b>두께가 얇아</b> 따로 얇게 자르지 않고 그대로 올려도 빛이 통과합니다. ' +
        '게다가 세포마다 <b>엽록체</b>가 뚜렷해서, 세포질이 어디까지 차 있는지 눈으로 따라가기 쉽습니다. ' +
        '원형질분리가 일어나면 초록색 알갱이가 세포 가운데로 몰리는 것이 그대로 보입니다.</p></div>';
      var ck = E.el('div', { cls: 'card' });
      ck.appendChild(E.el('h3', { text: '진행' }));
      var lines = {};
      ['A', 'B', 'C'].forEach(function (k) {
        var d = E.el('div', { cls: 'chk' }, E.el('span', { cls: 'bx' }),
          E.el('span', { text: '받침 유리 ' + k + ' 에 잎 올리기' }));
        lines[k] = d; ck.appendChild(d);
      });
      panel.appendChild(ck);

      function sync() {
        ['A', 'B', 'C'].forEach(function (k) { lines[k].classList.toggle('done', !!D.leaf[k]); });
        var n = ['A', 'B', 'C'].filter(function (k) { return D.leaf[k]; }).length;
        E.gate(n >= 3, '잎 3장을 각각 다른 받침 유리에 올리세요');

}
function drawTweezer(c, x, y) {

  c.beginPath(); c.moveTo(-7, -30); c.quadraticCurveTo(-3, -8, -1, 4); c.stroke();
  c.beginPath(); c.moveTo(7, -30); c.quadraticCurveTo(3, -8, 1, 4); c.stroke();
  c.restore();
}

/* ================================================================
   장면 4. 용액 처리
   ================================================================ */
function scDrop() {
  var Q = {
    id: 'os_ctrl',
    q: '잎 A에는 <b>아무것도 떨어뜨리지 않는다.</b> 그 까닭으로 가장 알맞은 것은?',
    opts: [
      '잎 A는 실험이 잘못됐을 때 쓰려고 남겨 두는 여분이기 때문에',
      '용액을 처리하기 전 세포의 모습을 그대로 두어 비교 기준으로 삼기 위해서',
      '증류수와 소금물이 섞이면 위험한 물질이 만들어지기 때문에',

    ],
    a: 1,
    why: '잎 A는 <b>비교 기준</b>입니다. 처리하지 않은 세포의 모습을 함께 보아야, ' +
         '잎 B와 잎 C에서 나타난 변화가 <b>떨어뜨린 용액 때문</b>이라고 말할 수 있습니다. ' +
         '비교 기준 없이 잎 C만 보면, 원래 그런 모양이었는지 소금물 때문에 변한 것인지 구별할 수 없습니다.',
    bad: {
      0: '여분이 아니라 <b>비교 대상</b>입니다. 잎 A도 반드시 관찰합니다.',
      2: '증류수와 소금물이 섞여도 위험하지 않습니다. 다만 서로 다른 조건을 섞으면 비교를 할 수 없습니다.',
      3: '모든 세포에는 세포막이 있습니다. 식물세포는 그 바깥에 세포벽까지 있습니다.'
    }
  };
  return {
    id: 'drop', chap: '표본 만들기', name: '용액 떨어뜨리기',
    guide: '시약병을 눌러 스포이트에 담은 뒤 받침 유리를 누릅니다. ' +
           '잎 B에는 <span class="hl">증류수</span>, 잎 C에는 <span class="hl">10 % 소금물</span>을 ' +
           '<b>2방울~3방울</b>씩. 잎 A에는 아무것도 떨어뜨리지 않습니다.',
    mount: function (stage, panel) {
      /* n 은 논리값(즉시), pud 는 웅덩이 그림값(스프링으로 따라온다) */
      var st = { hold: null, n: { B: D.sol.B, C: D.sol.C }, badDrop: D.solBad, anim: [],
                 pud: { B: D.sol.B, C: D.sol.C }, sp: {}, ptr: null, splash: {},
                 dirty: D.dirty || 0, rinse: 0, rinseT: 0, nag: 0 };
      var SOLN = { W: '증류수', S: '10 % 소금물' };
      /* 받침이 있으면 「이」, 없으면 「가」. 「증류수 가」처럼 띄어 찍히던 것 */

        st.tNow = t;

          var near = st.hold && st.ptr && E.dist(st.ptr.x, st.ptr.y, x, y) < Math.max(sw, sh) * .55;
          drawSlide(c, x - sw / 2, y - sh / 2, sw, sh, { hi: !!near });
          /* 용액 웅덩이 — 방울이 닿으면 번진다 */
          var n = k === 'A' ? 0 : st.pud[k];
          if (n > 0.02) {

            c.fillStyle = (k === 'B' ? 'rgba(120,190,240,' : 'rgba(240,200,140,') +

            c.beginPath(); c.ellipse(x, y, Math.max(1, sw * .30 + n * 3.4), Math.max(1, sh * .30 + n * 2.4), 0, 0, Math.PI * 2);
            c.fill();
            c.strokeStyle = k === 'B' ? 'rgba(70,140,200,.8)' : 'rgba(190,140,70,.8)'; c.lineWidth = 1.6; c.stroke();

        if (!st.rinse && st.nag) E.grab(c, M.beaker.x, M.beaker.y, 28 * bs, t);
        [{ k: 'W', x: w * .21, n: '증류수' },
         { k: 'S', x: w * .79, n: '10 % 소금물' }].forEach(function (b) {
          hit.push({ type: 'bot', k: b.k, x: b.x, y: by, r: 36 * bs + 14 });
          var on = st.hold === b.k;
          /* 병 밑에 붙는 칩은 무대 아래 끝(h-7)에 닿으면 안 된다. 칩 바닥 = by+48.5 ≤ h-9.5 */
          drawBottle(c, b.x, by - 4 - (on ? 5 : 0), COL[b.k], on, bs);

        });

        var dx0 = st.rinse ? M.beaker.x : (st.ptr ? st.ptr.x + 22 : 0);
        var dy0 = st.rinse ? M.beaker.y - 26 * bs : (st.ptr ? st.ptr.y - 6 : 0);
        if (st.rinse) {
          var rp = E.clamp((st.tNow - st.rinseT) / 0.6, 0, 1);
          drawDropper(c, dx0, dy0 + Math.abs(Math.sin(rp * Math.PI * 2)) * -6,

        } else if (st.hold && st.ptr) {

        /* 떨어지는 방울 — 닿는 순간 소리와 번짐 */

        st.anim.forEach(function (a) {
          a.p += .07;

          : st.dirty ? '스포이트에 ' + SOLN[st.dirty] + iga(SOLN[st.dirty]) + ' 묻어 있습니다 — 헹굼 비커에 헹구세요'

      });
      /* 방울이 닿았다 — 톡, 물결, 웅덩이가 스프링으로 번진다 */
      function land(a) {

        E.ripple(s2.x, s2.y, a.col);

        if (st.sp[a.k]) st.sp[a.k].stop();
        var from = st.pud[a.k];
        st.sp[a.k] = E.spring(from, st.n[a.k], function (v) { st.pud[a.k] = v; }, { k: 180, d: 9, v: 6, eps: .01 });
      }

      cv.cv.addEventListener('pointermove', function (ev) { st.ptr = cv.pt(ev); });

        '2방울~3방울씩 떨어뜨린다.</p></div>' +
        '<div class="card"><h3>왜 이 두 가지일까</h3>' +

        if (st.slide === 'C') {

            c.restore();
            flag(c, sx, sy - ey - 4, sy - ey + 6, String(n + 1), popK(t - (st.mt[key] == null ? -9 : st.mt[key])));
          });

        /* 경통 — 검은 통, 놋쇠 띠 */

        chip(c, M.cx, M.cy - R + 24, '잎 ' + st.slide + ' · ' + nm + ' · ' + st.mag + '배',
          st.slide === 'C' ? '#fbe8cf' : '#fff8e6', 12.5);

        if (M.knob.x + kr + 6 > w) M.knob.x = w - kr - 6;      /* 좁은 폭에서 잘리지 않게 */
        var hot = !!(st.kdrag);

        c.strokeStyle = INK; c.lineWidth = 3;
        c.beginPath(); c.arc(M.knob.x, M.knob.y, kr, 0, 7); c.fill(); c.stroke();
        c.beginPath(); c.arc(M.knob.x, M.knob.y, kr * .42, 0, 7); c.fillStyle = '#5b6a85'; c.fill(); c.stroke();
        c.translate(M.knob.x, M.knob.y); c.rotate(st.focus * 2.6);
        c.strokeStyle = '#fff8e6'; c.lineWidth = 3; c.lineCap = 'round';
        c.beginPath(); c.moveTo(0, -kr * 0.5); c.lineTo(0, -kr * 0.84); c.stroke();
        c.restore();
        chip(c, M.knob.x, M.knob.y + kr + 18, Math.abs(st.focus) > .12 ? '↕ 미동나사' : '미동나사',

        E.hint(stage, Math.abs(st.focus) > .12 ? '오른쪽 미동나사를 위아래로 끌어 초점을 맞추세요'
          : '시야를 끌어 옮기세요 — 관찰한 표본 ' +
          ['A', 'B', 'C'].filter(function (k) { return D.seen[k]; }).length + '/3, C 표시 ' + st.marks.length + '/3');
      });

          }
          var wx = st.ox + (p.x - M.cx) / M.ppu, wy = st.oy + (p.y - M.cy) / M.ppu;
          var best = null, bd = 1e9;

          });
          if (!best || Math.abs(wx - best.x) > CW / 2 || Math.abs(wy - best.y) > CH / 2) {

          st.mt[best.x + ',' + best.y] = st.tNow || 0;
          D.marks = st.marks.length; D.markPts = st.marks.slice(); E.save();
          E.buzz(16); E.beep('pick');
          E.ripple(p.x, p.y, 'rgba(18,160,106,.9)');
          if (st.marks.length >= 3) {
            E.beep('good');
            E.pop(M.cx, M.cy - M.R * .5, '3개 찾았다!', '#127a5a', true);
            E.toast('셋. 세포막이 벽에서 떨어진 세포다. 「오그라들었다」까지가 본 것이다.', 'good');

        }
      });

      panel.innerHTML =
        '<div class="card"><h3>과정 5</h3>' +
        '<p>잎 A, B, C를 광학 현미경으로 각각 관찰하고 세포의 모습을 비교한다.</p></div>';

      var ctl = E.el('div', { cls: 'card' });
      ctl.appendChild(E.el('h3', { text: '현미경 조작' }));
      var rowS = E.el('div', { cls: 'btnrow' });
      var btns = {};
      [['A', '처리 없음'], ['B', '증류수'], ['C', '10 % 소금물']].forEach(function (o) {
        var b = E.el('button', { cls: 'btn' + (st.slide === o[0] ? ' fill' : ''), type: 'button',
          text: o[0] + ' — ' + o[1] });

        });
        btns[o[0]] = b; rowS.appendChild(b);
      });
      ctl.appendChild(rowS);

      var rowM = E.el('div', { cls: 'btnrow' });
      var fs, fv;
      [100, 400].forEach(function (m) {
        var b = E.el('button', { cls: 'btn' + (st.mag === m ? ' fill' : ''), type: 'button', text: m + '배' });
        b.addEventListener('click', function () {
          st.mag = m; D.mag = m; E.save();
          E.$$('.btn', rowM).forEach(function (x) { x.classList.remove('fill'); });
          b.classList.add('fill');
          st.focus = .3;                       /* 배율을 바꾸면 초점이 흐트러진다 */

        });

      });
      ctl.appendChild(rowM);
      /* **여기는 곁길이다.** 본길은 시야 옆에 그려 둔 나사를 끄는 것이다. */
      ctl.appendChild(E.el('p', { cls: 'muted', html: '<b>시야 옆 미동나사를 위아래로 끌어도 됩니다.</b> ' +
        '가운데(0)에서 가장 선명합니다.', style: 'margin:10px 0 4px' }));
      fs = E.el('input', { type: 'range', min: '-1', max: '1', step: '0.02', cls: 'field' });
      fs.value = st.focus; fs.style.padding = '6px';
      fv = E.el('div', { cls: 'muted' });
      fs.addEventListener('input', function () {
        st.focus = +fs.value;
        fv.textContent = Math.abs(st.focus) < .12 ? '선명합니다' : '흐립니다';
      });
      ctl.appendChild(fs); ctl.appendChild(fv);
      panel.appendChild(ctl);

      var miss = E.el('div', { cls: 'card' });
      miss.appendChild(E.el('h3', { text: '관찰 미션' }));
      var mv = {};
      [['A', '잎 A 관찰하기'], ['B', '잎 B 관찰하기'], ['C', '잎 C 관찰하기']].forEach(function (o) {
        var d = E.el('div', { cls: 'chk' }, E.el('span', { cls: 'bx' }), E.el('span', { text: o[1] }));
        mv[o[0]] = d; miss.appendChild(d);
      });
      var mM = E.el('div', { cls: 'chk' }, E.el('span', { cls: 'bx' }),
        E.el('span', { text: '잎 C에서 원형질분리된 세포 3개 표시' }));
      miss.appendChild(mM);
      miss.appendChild(E.el('p', { cls: 'muted', html:
        '<br>잎 C에서는 초록색 <b>엽록체</b>가 세포 가운데로 몰리고, 세포벽과 세포막 사이에 빈 듯한 ' +
        '공간이 생깁니다. 이것이 <b>원형질분리</b>입니다. 낮은 배율로 넓게 훑어 찾고 높은 배율로 확인하는 것이 ' +
        '현미경 관찰의 순서입니다.' }));
      panel.appendChild(miss);
      E.quiz(panel, Q, sync);

      if (st.bub > 0) {
        var bw = E.el('div', { cls: 'card' });
        bw.innerHTML = '<h3>표본 상태</h3><div class="why bad">잎 C를 덮을 때 기포가 <b>' + st.bub +
          '개</b> 갇혔습니다. 시야에 검은 동그라미로 나타납니다. 앞 단계로 돌아가 다시 덮을 수 있습니다.</div>';
        panel.appendChild(bw);
      }

      function sync() {
        ['A', 'B', 'C'].forEach(function (k) { mv[k].classList.toggle('done', !!D.seen[k]); });
        mM.classList.toggle('done', st.marks.length >= 3);
        var allSeen = D.seen.A && D.seen.B && D.seen.C;
        var qok = !!(D._ans[Q.id] && D._ans[Q.id].ok);
        var ok = allSeen && st.marks.length >= 3 && qok;
        if (allSeen && st.marks.length >= 3) {
          E.note('현미경 관찰',
            '잎 A (처리 없음) — 세포막이 세포벽에 붙어 있음\n' +
            '잎 B (증류수) — 잎 A와 거의 같음. 세포막이 세포벽에 붙어 있음\n' +
            '잎 C (10 % 소금물) — 세포막이 세포벽에서 떨어짐 (원형질분리) · 3개 확인\n' +
            '관찰 배율: ' + st.mag + '배');

    }
  };
}

        }

        var n2 = Object.keys(st.put).length;
        E.hint(stage, n2 >= 3 ? '이름표 3개를 모두 붙였습니다 — 아래 확인 문항을 푸세요' : '이름표를 끌어 빈칸에 넣으세요 (' + n2 + '/3)');
      });
      function nameOf(id) {
        for (var i = 0; i < NAMES.length; i++) if (NAMES[i].id === id) return NAMES[i].t;
        return '';
      }
      /* 이름표 — 보라 알약, 들면 노란 테두리에 그림자가 커진다 */
      function drawTag(c, x, y, w, h, t, hi) {
        c.save();
        rr(c, x - w / 2 + (hi ? 5 : 3), y - h / 2 + (hi ? 7 : 4), w, h, h / 2);
        c.fillStyle = 'rgba(24,19,34,.35)'; c.fill();
        rr(c, x - w / 2, y - h / 2, w, h, h / 2);
        c.fillStyle = hi ? '#c9b6ff' : '#b39bff'; c.fill();
        c.strokeStyle = hi ? '#ffd23f' : INK; c.lineWidth = hi ? 3 : 2.5; c.stroke();
        c.restore();
        label(c, x, y, t, INK, 13);
      }

      /* 손맛 — 빈칸 가까이 가면 이름표가 당겨 붙고, 맞으면 찰칵. 틀리면 흔들린다 */
      E.drag(cv.cv, {
        start: function (ev) {
          var p = cv.pt(ev);
          for (var i = 0; i < M.tray.length; i++) {
            var tg = M.tray[i];
            if (Math.abs(p.x - tg.x) < tg.w / 2 + 6 && Math.abs(p.y - tg.y) < tg.h / 2 + 8) {
              st.drag = { id: tg.id, p: p, vis: p }; E.beep('pick'); return;
            }
          }
        },
        move: function (ev) {
          if (!st.drag) return;
          var p = cv.pt(ev); st.drag.p = p;
          var vis = p, nearId = null;
          M.box.forEach(function (b) {
            if (st.put[b.id]) return;
            if (Math.abs(p.x - b.x) < b.w / 2 + 12 && Math.abs(p.y - b.y) < b.h / 2 + 14) {
              vis = { x: E.lerp(p.x, b.x, .6), y: E.lerp(p.y, b.y, .6) }; nearId = b.id;
            }
          });
          if (nearId && st.drag.near !== nearId) E.beep('tick');
          st.drag.near = nearId;
          st.drag.vis = vis;
        },
        end: function (ev) {
          if (!st.drag) return;
          var g = st.drag; st.drag = null;
          var p = cv.pt(ev), hit = null;
          M.box.forEach(function (b) {
            if (Math.abs(p.x - b.x) < b.w / 2 + 12 && Math.abs(p.y - b.y) < b.h / 2 + 14) hit = b;
          });
          if (!hit) { E.toast('빈칸에 넣어라. 허공에 붙는 이름표는 없다.', 'bad'); return; }
          if (st.put[hit.id]) { E.toast('그 칸은 찼다.', 'bad'); return; }
          if (hit.id !== g.id) {
            E.buzz(45);
            E.toast('아니다. 그 선은 ' + nameOf(hit.id) + ' 을 가리킨다. 다시 봐라.', 'bad');
            return;
          }
          st.put[hit.id] = 1; D.tags = st.put; E.save();
          st.pt[hit.id] = st.tNow || 0;
          E.buzz(18); E.beep('snap'); E.kick();
          E.burst(hit.x, hit.y, null, 10, 2.2);
          var n2 = Object.keys(st.put).length;
          if (n2 >= 3) {
            E.beep('good'); E.pop(hit.x, hit.y - 40, '다 붙였다!', '#127a5a', true);
            E.toast('셋 다. 움직인 쪽이 세포막, 그 자리 그대로인 쪽이 세포벽이다.', 'good');
          } else E.toast(nameOf(g.id) + '. 맞다.', 'good');
          sync();
        }
      });

      panel.innerHTML =
        '<div class="card"><h3>결과 및 정리 1</h3>' +
        '<p>현미경으로 관찰한 결과를 그리고, <b>세포막과 세포벽</b>을 표시해 보자.</p></div>' +
        '<div class="card"><h3>어디가 어디일까</h3>' +
        '<p><b>세포벽</b> 세포의 가장 바깥을 둘러싼 두껍고 뻣뻣한 벽. 원형질분리가 일어나도 ' +
        '모양이 그대로입니다.</p>' +
        '<p><b>세포막</b> 세포질을 둘러싼 얇은 막. 물이 빠져나가면 세포질과 함께 안쪽으로 물러납니다. ' +
        '원형질분리에서 <b>움직이는 쪽</b>이 세포막입니다.</p>' +
        '<p><b>엽록체</b> 초록색 알갱이. 세포질 안에 있으므로 세포막을 따라 함께 안쪽으로 몰립니다.</p></div>';
      var ck = E.el('div', { cls: 'card' });
      ck.appendChild(E.el('h3', { text: '이름표' }));
      var lines = {};
      NAMES.forEach(function (n) {
        var d = E.el('div', { cls: 'chk' }, E.el('span', { cls: 'bx' }), E.el('span', { text: n.t }));
        lines[n.id] = d; ck.appendChild(d);
      });
      panel.appendChild(ck);
      E.quiz(panel, Q, sync);

      function sync() {
        NAMES.forEach(function (n) { lines[n.id].classList.toggle('done', !!st.put[n.id]); });
        var all = NAMES.every(function (n) { return st.put[n.id]; });
        var qok = !!(D._ans[Q.id] && D._ans[Q.id].ok);
        if (all) E.note('세포막과 세포벽',
          '잎 C의 세포 — 바깥쪽 두꺼운 테두리가 세포벽, 안쪽으로 물러난 얇은 막이 세포막.\n' +
          '세포벽과 세포막 사이는 바깥에 있던 10 % 소금물로 채워진다.');
        E.gate(all && qok, all ? '확인 문항을 풀어야 넘어갑니다' : '이름표 3개를 모두 붙이세요');
      }
      sync();
    }
  };
}

/* ================================================================
   장면 8. 원형질복귀 (더 해 보기)
   ================================================================ */
function scRecover() {
  var Q = {
    id: 'os_rec',
    q: '원형질분리가 일어난 세포를 <b>증류수</b>로 옮겼더니 세포막이 다시 세포벽에 닿았다. ' +
       '이때 세포에서 일어난 일로 옳은 것은?',
    opts: [
      '세포막을 통해 물이 세포 안으로 들어왔다',
      '세포막을 통해 소금이 세포 밖으로 빠져나갔다',
      '세포벽이 안쪽으로 자라 세포막에 닿았다',

    ],
    a: 0,
    why: '증류수는 세포 안보다 물의 농도가 높은 <b>저장액</b>입니다. 삼투가 일어나 물이 세포 안으로 ' +
         '들어오고, 세포질의 부피가 커지면서 세포막이 다시 세포벽에 닿습니다. ' +
         '세포막이 세포벽에 닿으면 더는 원형질분리가 나타나지 않고, 이후에는 <b>팽압</b>이 커지며 팽윤이 일어납니다.',
    bad: {
      1: '소금은 세포막을 그대로 통과하지 못합니다. 이동한 것은 <b>물</b>입니다.',
      2: '세포벽은 이런 짧은 시간에 자라지 않습니다. 자리를 옮긴 쪽은 세포막입니다.',
      3: '물이 빠져나가면 원형질분리가 더 심해집니다. 관찰한 것은 그 반대입니다.'
    }
  };
  return {
    id: 'recover', chap: '더 해 보기', name: '원형질복귀',
    guide: '원형질분리가 일어난 잎 C의 세포에 <span class="hl">증류수</span>를 흘려 넣어 봅시다. ' +
           '스포이트를 눌러 떨어뜨리세요.',
    mount: function (stage, panel) {
      var chl = bigChl();
      var st = { p: D.rec >= 1 ? 0 : .85, run: false, done: D.rec >= 1, t0: 0, dt: -9, drops: [] };
      if (st.done) st.p = 0;
      var cv = E.canvas(stage), M = {};
      var tick = setInterval(function () {
        if (!st.run) return;
        var k = E.clamp((performance.now() - st.t0) / 3600, 0, 1);
        st.p = .85 * (1 - k);
        if (k >= 1) {
          st.run = false; st.done = true; st.p = 0;
          st.dt = st.tNow || 0;
          D.rec = 1; E.save(); E.buzz(20);
          E.beep('good'); E.kick();
          if (M.cx) { E.burst(M.cx, M.cy, null, 16, 3); E.pop(M.cx, M.cy - M.H / 2 - 44, '돌아왔다!', '#127a5a', true); }
          E.toast('돌아왔다. 살아 있다는 뜻이다. 이제 죽었다는 말은 못 쓴다.', 'good');
          sync();
        }
      }, 40);

      cv.on(function (c, w, h, t) {
        E.dbg = { n: 'recover', M: M, st: st };
        st.tNow = t;
        var W = Math.min(w * .52, 360), H = W * (CH / CW) * 1.7;
        var cx = w * .44, cy = h * .42;
        M.cx = cx; M.cy = cy; M.W = W; M.H = H;
        var kk = popK(t - st.dt);
        c.save(); c.translate(cx, cy); c.scale(kk, kk); c.translate(-cx, -cy);
        drawBigCell(c, cx, cy, W, H, st.p, chl, { gap: st.done ? '#dbe9d2' : '#efeccd' });
        c.restore();
        chip(c, cx, cy - H / 2 - 24,
          st.done ? '세포막이 세포벽에 닿았다' : st.run ? '물이 세포 안으로 들어오는 중' : '원형질분리 상태',
          st.done ? '#5fd68a' : st.run ? '#dbeefc' : '#fbe8cf', 12.5);

        /* 물 이동 — 왼쪽에서 세포 안으로 흘러드는 방울들 */
        if (st.run) {
          for (var i = 0; i < 6; i++) {
            var ph = (t * .8 + i / 6) % 1;
            var ax = cx - W / 2 - 40 + ph * 46, ay = cy - H / 3 + (i % 3) * H / 3;
            c.save();
            c.beginPath(); c.arc(ax, ay, 4.5, 0, Math.PI * 2);

          }

        st.drops.forEach(function (d) {
          d.p += .05;
          if (d.p < 0) return;
          var y = E.lerp(M.dy - 60, cy - H / 2, d.p * d.p), x = E.lerp(M.dx, cx + W * .3, d.p);
          c.save(); c.fillStyle = '#6fb6e8'; c.strokeStyle = INK; c.lineWidth = 1.6;
          c.beginPath(); c.ellipse(x, y, 5, 8 - d.p * 2, 0, 0, Math.PI * 2); c.fill(); c.stroke(); c.restore();

        M.dx = w * .84; M.dy = Math.min(h * .78, h - 58);
        var live = !st.done && !st.run;
        drawBottle(c, M.dx, M.dy - (live ? 4 : 0), '#6fb6e8', live, 1.15);
        if (live) E.grab(c, M.dx, M.dy - 10, 34, t);
        chip(c, M.dx, M.dy + 42, '증류수', live ? '#ffd23f' : '#e9e4f7', 11.5);

        E.hint(stage, st.done ? '원형질복귀가 일어났습니다 — 아래 확인 문항을 푸세요'
          : st.run ? '물이 들어오는 중…' : '증류수병을 눌러 떨어뜨리세요');
      });

      cv.cv.addEventListener('pointerdown', function (ev) {

      panel.innerHTML =
        '<div class="card"><h3>더 해 보기 — 원형질복귀</h3>' +
        '<p>교과서 43쪽 자료실입니다. 고장액에 넣어 <b>원형질분리</b>가 일어난 식물세포를 ' +
        '다시 <b>저장액</b>으로 옮기면, 세포 안으로 물이 들어와 세포의 부피가 커집니다.</p>' +
        '<p class="muted">세포막이 세포벽에 닿으면 더는 원형질분리가 나타나지 않습니다. ' +
        '그 뒤로도 물이 더 들어오면 세포 안의 용액이 세포벽을 밀어내는 <b>팽압</b>이 커집니다.</p></div>';
      var ck = E.el('div', { cls: 'card' });
      ck.appendChild(E.el('h3', { text: '진행' }));
      var l1 = E.el('div', { cls: 'chk' }, E.el('span', { cls: 'bx' }), E.el('span', { text: '증류수 떨어뜨리기' }));
      var l2 = E.el('div', { cls: 'chk' }, E.el('span', { cls: 'bx' }), E.el('span', { text: '세포막이 세포벽에 닿는 것 확인' }));
      ck.appendChild(l1); ck.appendChild(l2);
      var row = E.el('div', { cls: 'btnrow' });
      var rb = E.el('button', { cls: 'btn ghost', type: 'button', text: '다시 해 보기' });
      rb.addEventListener('click', function () {
        st.p = .85; st.run = false; st.done = false; D.rec = 0; E.save(); sync();
      });
      row.appendChild(rb); ck.appendChild(row);
      panel.appendChild(ck);
      E.quiz(panel, Q, sync);

      function sync() {
        l1.classList.toggle('done', st.run || st.done);
        l2.classList.toggle('done', st.done);

          '세포질의 부피가 커지고 세포막이 다시 세포벽에 닿았다.');
        E.gate(st.done && qok, st.done ? '확인 문항을 풀어야 넘어갑니다' : '증류수를 떨어뜨려 끝까지 관찰하세요');
      }
      sync();
      this.unmount = function () { clearInterval(tick); };
    }
  };

/* ================================================================
   장면 9. 삼투압·팽압·흡수력 (교과서 43쪽 자료실)
   ----------------------------------------------------------------
   경향을 보이기 위한 학습용 모형 곡선이다. 실제 측정값이 아니다.
   삼투압 = 12 / 부피, 팽압은 부피 1.10 부터 생겨 1.50 에서 삼투압과 같아진다.
   흡수력 = 삼투압 - 팽압 이므로 1.50 에서 0 이 된다.
   ================================================================ */
var V_TURGOR = 1.10, V_MAX = 1.50;
function osmo(v) { return 12 / v; }
function turgor(v) { return v <= V_TURGOR ? 0 : 8 * (v - V_TURGOR) / (V_MAX - V_TURGOR); }
function suction(v) { return osmo(v) - turgor(v); }

function scPress() {
  var Q = {
    id: 'os_press',
    q: '이 그래프에서 <b>흡수력이 0</b>이 되었을 때 식물세포의 상태로 옳은 것은?',
    opts: [
      '세포의 부피가 가장 작고 원형질분리가 가장 심하다',
      '삼투압과 팽압이 같아져 물의 순 이동이 없고, 세포의 부피가 최대이다',
      '삼투압이 0이 되어 물이 더는 들어오지 않는다',
      '팽압이 0이 되어 세포막이 세포벽에서 떨어진다'
    ],
    a: 1,
    why: '흡수력은 <b>삼투압과 팽압의 차이</b>입니다. 물이 들어와 팽압이 커지다가 삼투압과 같아지면 ' +
         '흡수력이 0이 되고, 이때 식물세포의 부피가 최대가 됩니다.',
    bad: {
      0: '부피가 가장 작을 때는 팽압이 0이어서 흡수력이 가장 <b>큽니다.</b> 그래프의 왼쪽 끝입니다.',
      2: '삼투압은 0이 되지 않습니다. 세포 안에는 늘 용질이 있습니다. 팽압이 삼투압과 같아진 것입니다.',
      3: '팽압이 0인 곳은 그래프의 왼쪽, 곧 원형질분리 상태인 구간 Ⅰ입니다.'
    }
  };
  return {
    id: 'press', chap: '더 해 보기', name: '삼투압과 팽압',
    guide: '세포의 부피를 바꾸면서 <b>삼투압</b>, <b>팽압</b>, <b>흡수력</b>이 어떻게 변하는지 봅니다. ' +
           '두 지점을 찾아 기록하세요.',
    mount: function (stage, panel) {
      var chl = bigChl();
      var st = { v: 1.0 };
      var cv = E.canvas(stage);
      cv.on(function (c, w, h) {
        E.dbg = { n: 'press', st: st };
        var gw = w * .62;
        /* 아래 안내 띠에 눈금이 가리지 않게 그래프를 위로 올려 잡는다 */
        var A = axes(c, gw, h - 44, { x0: 1.0, x1: 1.5, y0: 0, y1: 13, xl: '세포의 부피(상댓값)', yl: '압력(상댓값)' });
        /* 눈금 */
        [1.0, 1.1, 1.2, 1.3, 1.4, 1.5].forEach(function (v) {
          label(c, A.X(v), A.gy + 14, v.toFixed(1), 'rgba(150,178,210,.7)', 10);
        });
        [0, 4, 8, 12].forEach(function (y) {
          label(c, A.gx - 12, A.Y(y), String(y), 'rgba(150,178,210,.7)', 10);
        });
        /* 구간 나누기 */
        c.save();
        c.fillStyle = 'rgba(122,92,208,.10)';
        c.fillRect(A.X(1.0), A.gy - A.gh, A.X(V_TURGOR) - A.X(1.0), A.gh);
        c.setLineDash([5, 5]);
        c.beginPath(); c.moveTo(A.X(V_TURGOR), A.gy); c.lineTo(A.X(V_TURGOR), A.gy - A.gh);
        c.strokeStyle = 'rgba(180,160,235,.6)'; c.lineWidth = 1.2; c.stroke();
        c.restore();
        label(c, (A.X(1.0) + A.X(V_TURGOR)) / 2, A.gy - A.gh + 14, 'Ⅰ', 'rgba(190,170,240,.9)', 13);

        var p = E.clamp((V_MAX - st.v) / (V_MAX - 1.0), 0, 1) * .85;
        var cx = gw + (w - gw) / 2, cy = h * .42;

        if (W > 40) {

          chip(c, cx, cy + H / 2 + 22, p > .05 ? '원형질분리' : '팽윤', p > .05 ? '#fbe8cf' : '#5fd68a', 11.5);
        }
        E.hint(stage, '부피 ' + st.v.toFixed(2) + ' — 삼투압 ' + osmo(st.v).toFixed(1) +
          ', 팽압 ' + turgor(st.v).toFixed(1) + ', 흡수력 ' + suction(st.v).toFixed(1));
      });

      panel.innerHTML =
        '<div class="card"><h3>더 해 보기 — 자료실</h3>' +
        '<p>교과서 43쪽. 원형질분리 상태의 세포를 저장액으로 옮기면 부피가 커지면서 압력이 변합니다.</p>' +
        '<div class="kv"><span>팽압</span><b>세포 안의 용액이 세포벽을 밀어내는 압력</b></div>' +
        '<div class="kv"><span>흡수력</span><b>삼투압 − 팽압. 세포가 물을 흡수하려는 힘</b></div>' +
        '<p class="muted">구간 Ⅰ 세포 안으로 물이 들어와 세포질의 부피가 커지고 삼투압이 감소한다. ' +
        '세포막이 세포벽에 닿으면 더는 원형질분리가 나타나지 않는다.<br>' +
        '구간 Ⅱ 물이 더 들어와 세포의 부피가 커지고 삼투압은 계속 감소하며 팽압이 커져 팽윤이 일어난다. ' +
        '삼투압과 팽압이 같아져 흡수력이 0일 때 세포의 부피는 최대가 된다.</p>' +
        '<p class="muted"><b>이 곡선은 경향을 보이기 위한 학습용 모형입니다.</b> 실제 측정값이 아니므로 ' +
        '수치를 외우지 마세요.</p></div>';

      slider(panel, {
        title: '세포의 부피', unitLabel: '부피(상댓값)', id: 'vol',
        min: 1.0, max: 1.5, step: 0.01, value: st.v,
        fmt: function (v) { return v.toFixed(2); },
        /* 손맛 — 0.05 마다 딸깍. 팽압이 생기는 자리와 흡수력 0 자리를 지날 때는 한 번 더 */
        onInput: function (v) {
          st.v = v; showNow();
          E.detent(st, 'tk', v, 0.05);
          var atT = Math.abs(v - V_TURGOR) <= 0.005, atZ = Math.abs(v - V_MAX) <= 0.005;
          if ((atT || atZ) && st.lastAt !== v) { st.lastAt = v; E.beep('pick'); }
        }
      });
      var now = E.el('div', { cls: 'card' });
      now.appendChild(E.el('h3', { text: '지금 값' }));
      var nowBody = E.el('div'); now.appendChild(nowBody);
      panel.appendChild(now);
      function showNow() {
        nowBody.innerHTML =
          '<div class="kv"><span>삼투압</span><b style="color:#ff9a92">' + osmo(st.v).toFixed(1) + '</b></div>' +
          '<div class="kv"><span>팽압</span><b style="color:#8fd0ff">' + turgor(st.v).toFixed(1) + '</b></div>' +
          '<div class="kv"><span>흡수력</span><b style="color:#8ff0c0">' + suction(st.v).toFixed(1) + '</b></div>';
      }
      showNow();

      var miss = E.el('div', { cls: 'card' });
      miss.appendChild(E.el('h3', { text: '읽어 내기' }));
      miss.appendChild(E.el('p', { html:
        '슬라이더를 옮겨 아래 두 지점을 찾은 뒤 <b>이 값으로 기록</b>을 누르세요.' }));
      var m1 = E.el('div', { cls: 'chk' }, E.el('span', { cls: 'bx' }),
        E.el('span', { text: '팽압이 0에서 벗어나기 시작하는 부피' }));
      var m2 = E.el('div', { cls: 'chk' }, E.el('span', { cls: 'bx' }),
        E.el('span', { text: '흡수력이 0이 되는 부피' }));
      miss.appendChild(m1); miss.appendChild(m2);
      var row = E.el('div', { cls: 'btnrow' });
      var b1 = E.el('button', { cls: 'btn', type: 'button', text: '팽압 시작점 기록' });
      var b2 = E.el('button', { cls: 'btn', type: 'button', text: '흡수력 0 기록' });
      b1.addEventListener('click', function () {
        if (Math.abs(st.v - V_TURGOR) <= 0.02) {
          D.press.turgor = 1; E.save(); E.buzz(18); E.beep('snap'); E.kick();
          E.toast('맞다. 세포막이 벽에 닿는 순간부터 벽이 밀린다.', 'good');
        } else E.toast('아직 아니다. 팽압 곡선이 0에서 떠오르는 자리를 봐라.', 'bad');
        sync();
      });
      b2.addEventListener('click', function () {
        if (Math.abs(st.v - V_MAX) <= 0.02) {
          D.press.zero = 1; E.save(); E.buzz(18); E.beep('snap'); E.kick();
          E.toast('맞다. 두 곡선이 만나면 물은 더 안 들어온다.', 'good');
        } else E.toast('아직 아니다. 삼투압 곡선과 팽압 곡선이 만나는 자리를 봐라.', 'bad');
        sync();
      });
      row.appendChild(b1); row.appendChild(b2);
      miss.appendChild(row); panel.appendChild(miss);
      E.quiz(panel, Q, sync);

      function sync() {
        m1.classList.toggle('done', !!D.press.turgor);
        m2.classList.toggle('done', !!D.press.zero);
        var both = D.press.turgor && D.press.zero;
        var qok = !!(D._ans[Q.id] && D._ans[Q.id].ok);
        if (both) E.note('삼투압과 팽압 (학습용 모형)',
          '팽압이 생기기 시작하는 부피 ' + V_TURGOR.toFixed(2) + ' — 세포막이 세포벽에 닿는 곳(구간 Ⅰ의 끝)\n' +
          '흡수력이 0이 되는 부피 ' + V_MAX.toFixed(2) + ' — 삼투압 = 팽압, 세포의 부피가 최대');
        E.gate(both && qok, both ? '확인 문항을 풀어야 넘어갑니다' : '두 지점을 찾아 기록하세요');
      }
      sync();
    }
  };
}

/* ================================================================
   장면 10. 동물세포와 비교 (교과서 41쪽 그림 Ⅰ-29)
   ================================================================ */
function scAnimal() {
  var Q = {
    id: 'os_animal',
    q: '같은 <b>저장액</b>에 넣었는데 적혈구는 터지고 식물세포는 터지지 않았다. 그 까닭은?',
    opts: [
      '식물세포의 세포막은 물을 통과시키지 않기 때문에',
      '식물세포에는 세포벽이 있어 부피가 일정 이상 커지지 않기 때문에',
      '식물세포에는 액포가 있어 들어온 물을 모두 없애기 때문에',
      '식물세포는 적혈구보다 작아 들어오는 물의 양이 적기 때문에'
    ],
    a: 1,
    why: '식물세포는 세포막 바깥에 단단한 <b>세포벽</b>이 있어, 물이 들어와도 일정 부피까지만 커지고 ' +
         '터지지 않습니다. 세포벽이 없는 적혈구는 저장액에서 부풀다가 터지는데, 이것을 <b>용혈</b>이라고 합니다.',
    bad: {
      0: '식물세포의 세포막도 물을 통과시킵니다. 그래서 삼투가 일어납니다.',
      2: '액포가 물을 받아들이기는 하지만, 세포가 터지지 않게 버텨 주는 것은 세포벽입니다.',
      3: '크기의 문제가 아닙니다. 실제로는 검정말 잎세포가 적혈구보다 훨씬 큽니다.'
    }
  };
  var SOL = [
    { k: 'hypo', n: '저장액', d: '세포 안보다 삼투압이 낮다' },
    { k: 'iso', n: '등장액', d: '세포 안과 삼투압이 같다' },
    { k: 'hyper', n: '고장액', d: '세포 안보다 삼투압이 높다' }
  ];
  return {
    id: 'animal', chap: '더 해 보기', name: '동물세포와 비교',
    guide: '같은 용액에 <b>적혈구</b>와 <b>식물세포</b>를 넣으면 어떻게 다를까요? ' +
           '<span class="hl">세 용액을 모두</span> 눌러 비교해 보세요.',
    mount: function (stage, panel) {
      var chl = bigChl();
      /* 적혈구는 세 박자다 — 부푼다(1.2초) → 터진다 → 막만 남는다.
         식물세포는 세 용액에서 **모양이 서로 달라야** 한다. 등장액에 얇은 틈을 준다 */
      var st = { sel: 'iso', t0: -99, fired: 0, p: .14, bow: 0, p0: .14, b0: 0, pT: .14, bT: 0 };
      var SW_T = 1.2, AF_T = 0.8;
      function nowS() { return performance.now() / 1000; }
      var cv = E.canvas(stage);
      function pick(k) {
        st.sel = k; st.fired = 0; st.t0 = nowS();
        D.tonic[k] = 1; E.save();
        st.p0 = st.p; st.b0 = st.bow;
        st.pT = k === 'hyper' ? .85 : k === 'iso' ? .14 : 0;
        st.bT = k === 'hypo' ? 1 : 0;
        E.beep('pick');
      }
      cv.on(function (c, w, h, t) {
        E.dbg = { n: 'animal', st: st };
        /* 모양이 바뀌는 것도, 터지는 것도 **벽시계**로 센다.
           쌓아 가며 다가가면 그린 횟수에 따라 값이 달라진다(헤드리스에서 실제로 걸렸다).
           고른 뒤 지난 시간만 보고 **정확히** 정한다 */
        var wn = nowS();
        var mk = E.clamp((wn - st.t0) / .35, 0, 1);
        var me = mk * mk * (3 - 2 * mk);
        st.p = st.p0 + (st.pT - st.p0) * me;
        st.bow = st.b0 + (st.bT - st.b0) * me;
        var cy = h * .42;
        var cx1 = w * .28, cx2 = w * .72;
        /* ---- 적혈구 — 부푼다 → 터진다 → 막만 남는다 ---- */
        var R = Math.min(w * .11, h * .18);
        var ph0 = st.sel === 'hypo' ? Math.max(0, wn - st.t0) : 0;
        var swl = st.sel === 'hypo' ? E.clamp(ph0 / SW_T, 0, 1) : 0;   /* 부푼 정도 */
        var popped = st.sel === 'hypo' && ph0 >= SW_T;
        var af = popped ? E.clamp((ph0 - SW_T) / AF_T, 0, 1) : 0;      /* 터진 뒤 흩어지는 정도 */
        var crn = st.sel === 'hyper' ? 1 : 0;                          /* 쪼그라듦 */
        if (popped && !st.fired) {
          st.fired = 1;
          E.beep('thud'); E.buzz(55); E.kick();
          E.burst(cx1, cy, '#d65656', 18, 3.0);
        }
        c.save();
        c.translate(cx1, cy);
        var Rr = R * (1 + .42 * swl);
        if (popped) {
          /* 흩어지는 헤모글로빈 구름 */
          c.save();
          c.fillStyle = 'rgba(214,86,86,' + ((1 - af) * .30).toFixed(3) + ')';
          c.beginPath(); c.arc(0, 0, Rr * (1 + af * 2.2), 0, Math.PI * 2); c.fill();
          c.restore();
          for (var k = 0; k < 16; k++) {
            var ang = k / 16 * Math.PI * 2 + k * .7;
            var dd = Rr * (.6 + af * 2.6) + Math.sin(t * 2 + k) * 3;
            c.beginPath();
            c.arc(Math.cos(ang) * dd, Math.sin(ang) * dd * .92, 3.6 * (1 - af * .5), 0, Math.PI * 2);
            c.fillStyle = 'rgba(214,86,86,' + Math.max(0, 1 - af).toFixed(2) + ')'; c.fill();
          }
          /* 남은 막 — 빈 껍데기 */
          c.beginPath();
          c.ellipse(0, 0, Rr * (1 + af * .10), Rr * .92 * (1 + af * .10), 0, 0, Math.PI * 2);
          c.fillStyle = 'rgba(255,255,255,.10)'; c.fill();
          c.strokeStyle = 'rgba(24,19,34,' + (.65 - af * .25).toFixed(2) + ')';
          c.lineWidth = 2.2; c.setLineDash([7, 5]); c.stroke();
          c.setLineDash([]);
        } else {
          c.beginPath();
          for (var i = 0; i <= 28; i++) {
            var a = i / 28 * Math.PI * 2;
            var rr2 = Rr * (1 - crn * (.34 - .10 * Math.sin(a * 7)));
            var x = Math.cos(a) * rr2, y = Math.sin(a) * rr2 * (.92 - .02 * crn);
            i ? c.lineTo(x, y) : c.moveTo(x, y);
          }
          c.closePath();
          c.fillStyle = '#d65656'; c.fill();
          c.strokeStyle = INK; c.lineWidth = 2.6 - swl * .9; c.lineJoin = 'round'; c.stroke();
          /* 가운데 오목한 자리 — 부풀수록 메워진다 */
          if (!crn) {
            c.beginPath(); c.ellipse(0, 0, R * .45, R * .40, 0, 0, Math.PI * 2);
            c.fillStyle = 'rgba(120,30,30,' + (.35 * (1 - swl)).toFixed(3) + ')'; c.fill();
          }
          /* 터지기 직전 — 막이 팽팽해 떨린다 */
          if (swl > .75) {
            c.save(); c.globalAlpha = (swl - .75) / .25;
            c.strokeStyle = '#ff8f8f'; c.lineWidth = 3; c.setLineDash([5, 6]);
            c.beginPath(); c.ellipse(0, 0, Rr + 4, Rr * .92 + 4, 0, 0, Math.PI * 2); c.stroke();
            c.restore(); c.setLineDash([]);
          }
        }
        c.restore();
        chip(c, cx1, cy + R + 32, '적혈구 (동물세포)', '#ffd6d6', 12);
        label(c, cx1, cy + R + 56,
          st.sel !== 'hypo' ? (st.sel === 'iso' ? '모양이 변하지 않는다' : '쪼그라든다')
            : !popped ? '물이 들어와 부푼다'
            : af < .6 ? '터졌다 — 용혈' : '남은 막 — 적혈구 그림자',
          'rgba(190,214,240,.85)', 12);
        if (st.sel === 'hypo' && af >= .9) label(c, cx1, cy + R + 74, '무대를 누르면 다시 봅니다',
          'rgba(150,178,210,.65)', 11);

        /* ---- 식물세포 — 저장액은 벽이 휘고, 등장액은 얇은 틈, 고장액은 원형질분리 ---- */
        var W = Math.min(w * .30, 220), H = W * (CH / CW) * 1.7;
        var bow = st.bow * W * .035;
        drawBigCell(c, cx2, cy, W, H, st.p, chl,
                    { gap: st.p > .4 ? '#efeccd' : '#dbe9d2', bow: bow });
        if (st.bow > .05) {
          /* 안에서 벽을 미는 힘(팽압)과, 벽이 되미는 힘 */
          var pu = (.55 + .45 * Math.sin(t * 2)) * st.bow;
          [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(function (v) {
            var half = v[0] ? W / 2 + bow : H / 2 + bow;
            var ex = cx2 + v[0] * (half - 4), ey = cy + v[1] * (half - 4);
            var sx2 = cx2 + v[0] * (half - 30), sy2 = cy + v[1] * (half - 24);
            c.save(); c.globalAlpha = pu;
            c.strokeStyle = '#3f8ad0'; c.lineWidth = 3; c.lineCap = 'round';
            c.beginPath(); c.moveTo(sx2, sy2); c.lineTo(ex, ey); c.stroke();
            c.beginPath(); c.arc(ex, ey, 3.6, 0, Math.PI * 2); c.fillStyle = '#3f8ad0'; c.fill();
            /* 벽이 되미는 짧은 화살표 */
            c.strokeStyle = '#7a5c2e'; c.lineWidth = 2.6;
            c.beginPath();
            c.moveTo(cx2 + v[0] * (half + 13), cy + v[1] * (half + 13));
            c.lineTo(cx2 + v[0] * (half + 4), cy + v[1] * (half + 4));
            c.stroke();
            c.restore();
          });
          c.save(); c.globalAlpha = st.bow;
          label(c, cx2, cy - 9, '팽압', 'rgba(45,110,170,.95)', 12);
          label(c, cx2, cy + 9, '↔ 세포벽이 되민다', 'rgba(122,92,46,.95)', 10.5);
          c.restore();
        }
        if (st.sel === 'iso') label(c, cx2, cy, '막과 벽 사이에 힘이 없다', 'rgba(90,120,95,.9)', 11);
        chip(c, cx2, cy + H / 2 + 28, '검정말 잎세포 (식물세포)', '#dff3d6', 12);
        label(c, cx2, cy + H / 2 + 52,
          st.sel === 'hypo' ? '팽윤 — 세포벽이 있어 터지지 않는다'
            : st.sel === 'iso' ? '모양이 변하지 않는다' : '원형질분리',
          'rgba(190,214,240,.85)', 12);

        /* 물의 이동 화살표 */
        var dir = st.sel === 'hypo' ? 1 : st.sel === 'hyper' ? -1 : 0;
        if (dir) {
          [cx1 - R - 34, cx2 - W / 2 - bow - 34].forEach(function (bx) {
            for (var i2 = 0; i2 < 4; i2++) {
              var ph = (t * .7 + i2 / 4) % 1;
              var xx = dir > 0 ? bx + ph * 30 : bx + 30 - ph * 30;
              c.beginPath(); c.arc(xx, cy - 14 + i2 * 9, 3.2, 0, Math.PI * 2);
              c.fillStyle = 'rgba(140,200,255,' + (.85 - Math.abs(ph - .5)) + ')'; c.fill();

          });
        }
        chip(c, w / 2, 26,
          SOL.filter(function (s) { return s.k === st.sel; })[0].n + ' 에 넣었을 때', '#fff8e6', 13.5);
        var n = SOL.filter(function (s) { return D.tonic[s.k]; }).length;

        '<p>교과서 41쪽과 43쪽. 같은 용액에 넣어도 <b>세포벽</b>이 있는 식물세포와 없는 동물세포는 ' +
        '다르게 변합니다.</p></div>';

        b.addEventListener('click', function () {

        '<table class="dat"><tr><th>용액</th><th>적혈구</th><th>식물세포</th></tr>' +
        '<tr><td>저장액</td><td>부풀다가 터진다 (용혈)</td><td>팽윤. 터지지 않는다</td></tr>' +
        '<tr><td>등장액</td><td>변화 없음</td><td>변화 없음</td></tr>' +
        '<tr><td>고장액</td><td>쪼그라든다</td><td>원형질분리</td></tr></table>' +
        '<p class="muted" style="margin-top:8px">등장액, 고장액, 저장액은 <b>세포 안의 용액과 비교해</b> ' +
        '삼투압이 같은지, 높은지, 낮은지로 정합니다.</p>';
      panel.appendChild(tb);
      E.quiz(panel, Q, sync);

      function sync() {
        var s = SOL.filter(function (x) { return x.k === st.sel; })[0];
        desc.innerHTML = '<div class="why"><b>' + s.n + '</b> — ' + s.d + '</div>';
        var all = SOL.every(function (x) { return D.tonic[x.k]; });
        var qok = !!(D._ans[Q.id] && D._ans[Q.id].ok);
        E.gate(all && qok, all ? '확인 문항을 풀어야 넘어갑니다' : '세 용액을 모두 눌러 보세요');
      }
      D.tonic[st.sel] = 1; E.save();
      st.p = st.pT; st.bow = st.bT;
      sync();
    }
  };
}

          fieldBg(c, cx, cy, R);
          c.translate(cx - FIELD_W / 2 * ppu, cy - FIELD_H / 2 * ppu);
          c.scale(ppu, ppu);
          drawField(c, cells, {

          sel.addEventListener('change', function () {
            D._ans[o[0]] = { v: sel.value }; E.save(); sync();
          });

         무엇에 대해 쓰는 것인지 멀어진다. 무대에 잎 A/B/C 시야가 떠 있으니 보면서 쓴다 */
      E.write(panel, {
        id: 'os_w3',
        title: '결과 및 정리 2',
        q: '잎 C의 세포에서 일어난 변화를 <b>세포막을 통한 물의 이동</b>으로 설명해 보자.',
        ph: '어느 쪽 용액의 삼투압이 더 높은지, 물이 어느 쪽으로 이동했는지, 그 결과 세포가 어떻게 되었는지 써 보세요.',
        model: '10 % 소금물은 세포 안의 용액보다 삼투압이 높은 <b>고장액</b>이다. 소금은 세포막을 그대로 ' +
          '통과하지 못하므로, 삼투가 일어나 <b>물이 세포막을 통해 세포 밖으로</b> 빠져나간다. ' +
          '그 결과 세포질의 부피가 줄어들어 <b>세포막이 세포벽에서 떨어지는 원형질분리</b>가 일어난다. ' +
          '세포벽에는 물과 용질이 지나갈 수 있는 틈이 있으므로, 세포막이 물러난 자리는 바깥에 있던 ' +
          '소금물로 채워진다.',

      var tip = E.el('div', { cls: 'card' });

        '<p>잎 A는 검정말이 살던 물에 잠겨 있던 그대로입니다. 그 물도 세포 안보다 묽지만, ' +
        '세포는 이미 <b>팽윤 상태</b>여서 흡수력이 0에 가깝습니다. 그래서 물의 <b>순 이동이 거의 없습니다.</b></p>' +
        '<p>잎 B의 증류수는 그보다 더 묽은 저장액이므로 물이 세포 안으로 들어옵니다. ' +
        '다만 세포벽이 버텨 주어 부피가 크게 늘지 못하므로 <b>겉모습은 잎 A와 크게 다르지 않습니다.</b></p>';
      panel.appendChild(tip);

      function sync() {
        var got = 0, all = 0, ok = true;
        ROWS.forEach(function (r) {
          [['os_mv' + r.k, r.mv], ['os_sp' + r.k, r.sp]].forEach(function (o) {

              '세포 안과 밖에서 다를 때 <b>물</b>이 이동합니다. 잎 C에서는 물이 세포 밖으로 빠져나가 ' +

}

/* 짚신벌레 — 수축포 둘이 물을 받아 차다가 몸 밖으로 팍 비운다.
   저장액에서는 물이 많이 들어와 빠르게, 고장액에서는 느리게 뛴다. */
function drawParamecium(c, cx, cy, s, t, fast) {
  var per = fast ? 1.5 : 5.2;                 /* 한 번 차고 비우는 데 걸리는 시간 */
  var ph = (t % per) / per;
  var fill = ph < .86 ? ph / .86 : 0;         /* 차다가 뚝 비운다 */
  var spurt = ph >= .86 ? (ph - .86) / .14 : 0;
  c.save(); c.translate(cx, cy); c.scale(s / 150, s / 150);
  /* 들어오는 물 */
  var nDrop = fast ? 10 : 2;
  for (var i = 0; i < nDrop; i++) {
    var a = (i / nDrop) * Math.PI * 2 + .3;
    var q = ((t * (fast ? .9 : .35) + i / nDrop) % 1);
    var rOut = 150 - q * 46;
    c.beginPath();
    c.arc(Math.cos(a) * rOut * .92, Math.sin(a) * rOut * .52, 4, 0, Math.PI * 2);
    c.fillStyle = 'rgba(140,200,255,' + (.9 - Math.abs(q - .5) * 1.2).toFixed(2) + ')'; c.fill();
  }
  /* 몸통 — 슬리퍼 모양 */
  c.beginPath();
  c.moveTo(-104, 4);
  c.bezierCurveTo(-96, -44, -20, -58, 34, -46);
  c.bezierCurveTo(86, -34, 108, -6, 100, 16);
  c.bezierCurveTo(92, 40, 30, 52, -22, 44);
  c.bezierCurveTo(-72, 36, -110, 26, -104, 4);
  c.closePath();
  c.fillStyle = 'rgba(24,19,34,.28)';
  c.save(); c.translate(4, 6); c.fill(); c.restore();
  c.fillStyle = '#cfe6f6'; c.fill();
  c.strokeStyle = INK; c.lineWidth = 4; c.lineJoin = 'round'; c.stroke();
  /* 섬모 */
  c.strokeStyle = 'rgba(24,19,34,.55)'; c.lineWidth = 2.2; c.lineCap = 'round';
  for (var k = 0; k < 26; k++) {
    var u = k / 26 * Math.PI * 2;
    var px = Math.cos(u) * 100, py = Math.sin(u) * 48 - 2;
    var wv = Math.sin(t * (fast ? 7 : 3) + k * .7) * 4;
    c.beginPath(); c.moveTo(px, py);
    c.lineTo(px * 1.13 + wv, py * 1.20 + wv * .4);
    c.stroke();
  }
  /* 핵 */
  c.beginPath(); c.ellipse(-6, -2, 20, 13, -.1, 0, Math.PI * 2);
  c.fillStyle = '#9fbcd2'; c.fill(); c.strokeStyle = 'rgba(24,19,34,.6)'; c.lineWidth = 2.4; c.stroke();
  /* 수축포 둘 — 차올랐다가 팍 */
  [[-58, -12], [58, 8]].forEach(function (v, idx) {
    var r = 6 + fill * 20;
    c.beginPath(); c.arc(v[0], v[1], r, 0, Math.PI * 2);
    c.fillStyle = 'rgba(110,190,245,.85)'; c.fill();
    c.strokeStyle = INK; c.lineWidth = 3; c.stroke();
    /* 방사관 */
    c.strokeStyle = 'rgba(70,140,200,.75)'; c.lineWidth = 2;
    for (var m = 0; m < 6; m++) {
      var aa = m / 6 * Math.PI * 2 + idx;
      c.beginPath();
      c.moveTo(v[0] + Math.cos(aa) * (r + 2), v[1] + Math.sin(aa) * (r + 2));
      c.lineTo(v[0] + Math.cos(aa) * (r + 13), v[1] + Math.sin(aa) * (r + 13));
      c.stroke();
    }
    /* 비우는 순간 — 몸 밖으로 뿜는다 */
    if (spurt > 0) {
      var sgn = v[0] < 0 ? -1 : 1;
      for (var n2 = 0; n2 < 5; n2++) {
        var dd = 26 + spurt * 58 + n2 * 7;
        c.beginPath();
        c.arc(v[0] + sgn * dd, v[1] - 18 - n2 * 3, 4.4 * (1 - spurt * .6), 0, Math.PI * 2);
        c.fillStyle = 'rgba(110,190,245,' + (1 - spurt).toFixed(2) + ')'; c.fill();
      }
    }
  });
  /* 이름표는 몸통 바로 아래. 더 내리면 폰에서 용액 칩과 겹친다 */
  c.strokeStyle = 'rgba(45,110,170,.6)'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(58, 26); c.lineTo(34, 62); c.stroke();
  label(c, 0, 74, '수축포', 'rgba(45,110,170,.95)', 16);
  c.restore();
}

/* U자관 — 왼쪽 저농도, 오른쪽 고농도. 시간이 지나며 오른쪽 수면이 높아진다.
   빈 공간(관 속)을 한 경로로 만들고, 그 안에 액체를 채운다. */
function drawUTube(c, cx, cy, s, t) {
  var k = (Math.sin(t * .5 - Math.PI / 2) + 1) / 2;        /* 0 → 1 왕복 */
  var W = s * 1.7, H = s * 1.5, tw = s * .36;
  var x1 = -W / 2, x2 = x1 + tw, x4 = W / 2, x3 = x4 - tw;
  var top = -H / 2, bot = H / 2, mid = bot - tw;           /* 아래 가로관의 윗면 */

  c.save();
  c.translate(cx, cy);

  /* 관 속 빈 공간 */
  c.beginPath();
  c.moveTo(x1, top); c.lineTo(x1, bot); c.lineTo(x4, bot); c.lineTo(x4, top);
  c.lineTo(x3, top); c.lineTo(x3, mid); c.lineTo(x2, mid); c.lineTo(x2, top);
  c.closePath();
  c.fillStyle = 'rgba(200,225,250,.07)'; c.fill();
  c.strokeStyle = 'rgba(190,222,250,.65)'; c.lineWidth = 2; c.stroke();

  /* 액체 */
  var y0 = top + H * .30;
  var yL = y0 + k * H * .11, yR = y0 - k * H * .11;
  c.save();
  c.beginPath();
  c.moveTo(x1, top); c.lineTo(x1, bot); c.lineTo(x4, bot); c.lineTo(x4, top);
  c.lineTo(x3, top); c.lineTo(x3, mid); c.lineTo(x2, mid); c.lineTo(x2, top);
  c.closePath();
  c.clip();
  c.fillStyle = 'rgba(110,175,235,.34)';
  c.fillRect(x1, yL, tw, bot - yL);
  c.fillRect(x3, yR, tw, bot - yR);
  c.fillRect(x1, mid, W, tw);
  /* 수면 */
  c.strokeStyle = 'rgba(190,225,255,.85)'; c.lineWidth = 1.6;
  c.beginPath(); c.moveTo(x1, yL); c.lineTo(x2, yL); c.stroke();
  c.beginPath(); c.moveTo(x3, yR); c.lineTo(x4, yR); c.stroke();
  c.restore();

  /* 설탕 분자 — 왼쪽은 드문드문, 오른쪽은 빽빽하게 */
  var rs = 12345;
  function rnd() { rs = (rs * 9301 + 49297) % 233280; return rs / 233280; }
  function sugar(n, xa, ya) {
    for (var i = 0; i < n; i++) {
      var xx = xa + 5 + rnd() * (tw - 10);
      var yy = ya + 8 + rnd() * (bot - 6 - ya - 8);
      c.beginPath(); c.arc(xx, yy, 3.4, 0, Math.PI * 2);
      c.fillStyle = 'rgba(255,206,120,.95)'; c.fill();
    }
  }
  sugar(6, x1, yL);
  sugar(16, x3, yR);

  /* 반투과성막 */
  c.save();
  c.beginPath(); c.moveTo(0, mid); c.lineTo(0, bot);
  c.setLineDash([4, 3]);
  c.strokeStyle = '#ffd9a0'; c.lineWidth = 2.6; c.stroke();
  c.restore();
  label(c, 0, bot + 18, '반투과성막', '#ffd9a0', 11);

  /* 물이 왼쪽에서 오른쪽으로 옮겨 간다 */
  var ax = x1 + tw + ((t * .5) % 1) * (x3 - x2);
  c.beginPath(); c.arc(ax, mid + tw / 2, 3.4, 0, Math.PI * 2);
  c.fillStyle = 'rgba(150,205,255,.95)'; c.fill();
  label(c, 0, mid - 12, '물', '#8fd0ff', 11);

  label(c, x1 + tw / 2, yL - 14, '저농도', '#9fd0f5', 11);
  label(c, x3 + tw / 2, yR - 14, '고농도', '#ffbd8a', 11);
  c.restore();
}

    if (o.small) label(c, x, y + R + 18, o.title + ' ' + (o.now || labels[idx]), idx ? '#ffd23f' : 'rgba(220,232,245,.95)', 11);
    else label(c, x - R - 26, y, o.title, 'rgba(220,232,245,.95)', 11.5, 'right');
  }
  /* 손잡이 — 눈금과 같은 각도 규칙(위쪽이 0). 예전에는 -π/2 를 한 번 더 빼서 90° 어긋나 있었다 */
  var ka = a0 + (a1 - a0) * (o.vis != null ? o.vis : idx) / (n - 1);
  c.save(); c.translate(x, y); c.rotate(ka);
  rr(c, -7, -R + 8, 14, R - 14, 6); c.fillStyle = '#3b4757'; c.fill(); c.strokeStyle = INK; c.lineWidth = 2.5; c.stroke();
  c.beginPath(); c.arc(0, -R + 16, 4, 0, Math.PI * 2); c.fillStyle = '#ffd23f'; c.fill();
  c.restore();
  c.beginPath(); c.arc(x, y, 10, 0, Math.PI * 2); c.fillStyle = '#fff8e6'; c.fill(); c.strokeStyle = INK; c.lineWidth = 2.5; c.stroke();
  c.restore();
  /* 검사가 「손잡이가 고른 눈금을 가리키는가」를 볼 수 있게, 방금 그린 각도로 끝점을 돌려준다.
     국소 (0, -(R-16)) 을 rotate(ka) 한 자리다 */
  return { x: x + Math.sin(ka) * (R - 16), y: y - Math.cos(ka) * (R - 16) };
}

/* 피펫 — 끝(x,y)이 아래. 몸통은 위로. o={hi, fill(0~1 든 양), col} */
function drawPipette(c, x, y, sc, o) {
  o = o || {};
  c.save(); c.translate(x, y); c.scale(sc, sc);
  var lw = 2.6 / sc;
  c.fillStyle = 'rgba(0,0,0,.35)';
  c.beginPath(); c.moveTo(0 + 5, 0 + 5); c.lineTo(-4 + 5, -30 + 5); c.lineTo(-9 + 5, -120 + 5); c.lineTo(9 + 5, -120 + 5); c.lineTo(4 + 5, -30 + 5); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(0, 0); c.lineTo(-4, -30); c.lineTo(-9, -120); c.lineTo(9, -120); c.lineTo(4, -30); c.closePath();
  c.fillStyle = '#e6f2fb'; c.fill(); c.strokeStyle = o.hi ? '#ff5c5c' : INK; c.lineWidth = o.hi ? lw * 1.3 : lw; c.lineJoin = 'round'; c.stroke();
  if (o.fill > 0) {
    c.save(); c.beginPath(); c.moveTo(0, 0); c.lineTo(-4, -30); c.lineTo(-9, -120); c.lineTo(9, -120); c.lineTo(4, -30); c.closePath(); c.clip();
    c.fillStyle = o.col || SUP[1]; c.fillRect(-10, -o.fill * 90 - 4, 20, o.fill * 90 + 4);
    c.restore();
  }
  /* 고무 꼭지 */
  c.beginPath(); c.ellipse(0, -132, 15, 16, 0, 0, Math.PI * 2);
  c.fillStyle = o.hi ? '#ffd23f' : '#ff9f43'; c.fill(); c.strokeStyle = INK; c.lineWidth = lw; c.stroke();
  c.restore();
}

/* 산소 주사기 — 끝(x,y)이 왼쪽 아래. o={hi, k(0~1 눌린 정도)} */
function drawSyringe(c, x, y, sc, o) {
  o = o || {};
  c.save(); c.translate(x, y); c.scale(sc, sc); c.rotate(-.6);
  var lw = 2.6 / sc;
  c.fillStyle = 'rgba(0,0,0,.35)'; rr(c, 5, -10 + 5, 26, 20, 3); c.fill(); rr(c, 30 + 5, -16 + 5, 90, 32, 6); c.fill();
  rr(c, 0, -3, 30, 6, 2); c.fillStyle = '#8fa4bd'; c.fill(); c.strokeStyle = INK; c.lineWidth = lw; c.stroke();
  rr(c, 30, -16, 90, 32, 6); c.fillStyle = 'rgba(230,242,251,.9)'; c.fill(); c.strokeStyle = o.hi ? '#ff5c5c' : INK; c.lineWidth = o.hi ? lw * 1.3 : lw; c.stroke();
  var k = o.k || 0;
  c.fillStyle = 'rgba(191,224,242,.8)'; rr(c, 32, -13, (1 - k) * 84, 26, 4); c.fill();
  rr(c, 32 + (1 - k) * 84, -18, 8, 36, 2); c.fillStyle = '#3b4757'; c.fill(); c.strokeStyle = INK; c.lineWidth = lw; c.stroke();
  rr(c, 40 + (1 - k) * 84, -4, 60, 8, 3); c.fillStyle = '#3b4757'; c.fill(); c.stroke();
  rr(c, 98 + (1 - k) * 84, -14, 8, 28, 3); c.fillStyle = '#ffd23f'; c.fill(); c.stroke();
