}

/* 세포소기관 — 확대 창 안에 그린다. (x,y) 가운데, R 창 반지름 */
function drawOrganelle(c, k, x, y, R, t) {
  c.save();
  var r = E.rng(k === 'nuc' ? 3 : k === 'mito' ? 5 : k === 'mem' ? 7 : 11);
  if (k === 'nuc') {
    c.beginPath(); c.ellipse(x, y, R * .62, R * .56, .2, 0, Math.PI * 2);
    c.fillStyle = '#b48ab0'; c.fill(); c.strokeStyle = INK; c.lineWidth = 3; c.stroke();
    c.beginPath(); c.ellipse(x, y, R * .55, R * .49, .2, 0, Math.PI * 2); c.strokeStyle = 'rgba(24,19,34,.5)'; c.lineWidth = 1.6; c.stroke();
    for (var i = 0; i < 14; i++) {
      var a = r() * 6.28, d = r() * R * .42;
      c.beginPath(); c.moveTo(x + Math.cos(a) * d, y + Math.sin(a) * d);
      c.quadraticCurveTo(x + Math.cos(a + .5) * d * .8, y + Math.sin(a + .5) * d * .8, x + Math.cos(a + 1) * d * .6, y + Math.sin(a + 1) * d * .6);
      c.strokeStyle = '#6a3d6a'; c.lineWidth = 2; c.stroke();
    }
    c.beginPath(); c.arc(x + R * .14, y - R * .08, R * .16, 0, Math.PI * 2); c.fillStyle = '#7a4b6e'; c.fill(); c.strokeStyle = INK; c.lineWidth = 2; c.stroke();
  } else if (k === 'mito') {
    for (var j = 0; j < 3; j++) {
      var ox = x + (j - 1) * R * .5, oy = y + (j % 2 ? -R * .3 : R * .25), ang = j * .7 - .5;
      c.save(); c.translate(ox, oy); c.rotate(ang);
      c.beginPath(); c.ellipse(0, 0, R * .42, R * .2, 0, 0, Math.PI * 2);
      c.fillStyle = '#e0866f'; c.fill(); c.strokeStyle = INK; c.lineWidth = 2.6; c.stroke();
      c.beginPath(); c.ellipse(0, 0, R * .36, R * .14, 0, 0, Math.PI * 2); c.strokeStyle = '#a33d2a'; c.lineWidth = 1.6; c.stroke();
      for (var m = -2; m <= 2; m++) {
        c.beginPath(); c.moveTo(m * R * .12, -R * .13); c.quadraticCurveTo(m * R * .12 + R * .05, 0, m * R * .12, R * .12);
        c.strokeStyle = '#a33d2a'; c.lineWidth = 1.8; c.stroke();
      }
      c.restore();
    }
  } else if (k === 'mem') {
    for (var q = 0; q < 6; q++) {
      var qx = x + (r() - .5) * R * 1.1, qy = y + (r() - .5) * R * 1.1, qa = r() * 3;
      c.save(); c.translate(qx, qy); c.rotate(qa);
      c.beginPath(); c.moveTo(-R * .28, 0); c.quadraticCurveTo(-R * .1, -R * .16, R * .1, -R * .04); c.quadraticCurveTo(R * .25, R * .06, R * .3, -R * .02);
      c.strokeStyle = INK; c.lineWidth = 5; c.lineCap = 'round'; c.stroke();
      c.strokeStyle = '#f0cf82'; c.lineWidth = 2.6; c.stroke();
      c.restore();
    }
  } else {
    for (var p = 0; p < 26; p++) {
      var px = x + (r() - .5) * R * 1.3, py = y + (r() - .5) * R * 1.3;
      c.beginPath(); c.arc(px, py, R * .06, 0, Math.PI * 2); c.fillStyle = '#6f8fc9'; c.fill(); c.strokeStyle = INK; c.lineWidth = 1.6; c.stroke();
      c.beginPath(); c.arc(px + R * .03, py - R * .06, R * .04, 0, Math.PI * 2); c.fillStyle = '#9fb6e0'; c.fill(); c.stroke();
    }
  }
  c.restore();
}
/* 확대 창 — 굵은 검은 고리. 안에 fn(c) 를 그린다 */
function zoomRing(c, zx, zy, R, k, fn) {
  c.save();
  c.translate(zx, zy); c.scale(k, k); c.translate(-zx, -zy);
  c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.arc(zx + 5, zy + 5, R, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(zx, zy, R, 0, Math.PI * 2); c.fillStyle = '#fff8e6'; c.fill();
  c.save(); c.clip(); fn(c); c.restore();
  c.beginPath(); c.arc(zx, zy, R, 0, Math.PI * 2); c.strokeStyle = INK; c.lineWidth = 3; c.stroke();
  c.restore();
}

         '효소는 온도가 낮으면 작용이 느려지므로, 차가운 완충액을 쓰고 얼음에 담가 ' +
         '<b>세포소기관이 온전한 채로</b> 갈라질 때까지 버티게 합니다. ' +
         '<span class="muted">이 까닭은 교과서에는 없고, 실제 실험실에서 지키는 원칙입니다.</span>',
    bad: {
      0: '세포막을 깨는 것은 막대가 하는 일입니다. 온도와는 관계가 없습니다.',
      2: '온도가 낮다고 소기관의 무게가 달라지지는 않습니다.',
      3: '증발 때문이 아닙니다. 효소 작용을 생각해 보세요.'
    }
  };
  return {
    id: 'grind', chap: '파쇄액 만들기', name: '조직 파쇄',
    guide: '간 조직을 균질기에 넣고 <b>차가운 완충액</b>을 부은 뒤, ' +
           '<span class="hl">막대를 위아래로 끌어</span> 세포를 부숩니다. 다 갈면 얼음통에 담급니다.',
    mount: function (stage, panel) {
      var G = D.grind;
      var st = { g: G.g, rod: 0, drag: null, tPour: -9, tDrop: -9, tIce: -9, tNow: 0, done: 0 };
      var cv = E.canvas(stage), M = {};
      cv.on(function (c, w, h, t) {
        E.dbg = { n: 'grind', M: M, st: st, G: G };
        st.tNow = t;
        /* 균질기(국소 높이 170 + 막대 머리 40)가 무대 높이를 거의 다 쓴다 */
        var s = Math.min(w * .30 / 130, (h - 92) / 225);
        M.hx = w * .40; M.hy = h - 46; M.s = s;
        var pk = t - st.tPour, tilt = pk >= 0 && pk < .5 ? -Math.sin(pk / .5 * Math.PI) * .8 : 0;
        drawHomog(c, M.hx, M.hy, s, {
          tissue: G.tissue ? 1 : 0, liquid: G.buffer, grind: st.g, ice: G.ice,
          rod: G.tissue && G.buffer ? st.rod : null, hi: G.tissue && G.buffer && st.g < 1 && !st.drag
        });
        chip(c, M.hx, M.hy + 20, '균질기', '#fff8e6', 11.5);
        M.rodX = M.hx; M.rodY = M.hy - (170 + 40) * s + st.rod * s;
        if (G.tissue && G.buffer && st.g < 1 && !st.drag) E.grab(c, M.rodX, M.rodY, 22 * s, t);

        /* 간 조직 — 왼쪽 위. 누르면 떨어져 들어간다 */
        var bs = Math.min(1.6, Math.max(.8, s * .9));
        if (!G.tissue) {
          M.tx = w * .13; M.ty = h * .22;
          c.save(); c.translate(M.tx, M.ty); c.scale(bs, bs);
          c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(5, 5, 30, 20, .2, 0, Math.PI * 2); c.fill();
          c.beginPath(); c.ellipse(0, 0, 30, 20, .2, 0, Math.PI * 2); c.fillStyle = '#8f3d3d'; c.fill();
          c.strokeStyle = '#ff5c5c'; c.lineWidth = 3 / bs; c.stroke();
          c.beginPath(); c.ellipse(-8, -5, 10, 5, .2, 0, Math.PI * 2); c.fillStyle = 'rgba(255,255,255,.25)'; c.fill();
          c.restore();
          chip(c, Math.max(M.tx, w < 600 ? 62 : 90), M.ty + 26 * bs + 14, w < 600 ? '간 조직 — 누르기' : '간 조직 — 눌러서 넣기', '#ffd23f', 11);
        } else if (t - st.tDrop < .5 && st.tDrop > 0) {
          /* 떨어지는 조각 */
          var kk = ease((t - st.tDrop) / .5);
          var fx = w * .13 + (M.hx - w * .13) * kk, fy = h * .22 + (M.hy - 60 * s - h * .22) * kk * kk;
          c.save(); c.translate(fx, fy); c.scale(bs * (1 - kk * .5), bs * (1 - kk * .5));
          c.beginPath(); c.ellipse(0, 0, 30, 20, .2, 0, Math.PI * 2); c.fillStyle = '#8f3d3d'; c.fill(); c.strokeStyle = INK; c.lineWidth = 2.6 / bs; c.stroke();
          c.restore();
        }
        /* 완충액 병 — 오른쪽 위. 조직을 넣은 뒤 차례 */
        M.bx = w * .80; M.by = Math.max(56 * bs, h * .26); M.bs = bs;
        drawBottle(c, M.bx, M.by, '#bfe0f2', G.tissue && !G.buffer, tilt, bs);
        if (tilt < -0.25) pourStream(c, M.bx, M.by, bs, tilt, M.hx + 8 * s, M.hy - 170 * s + 6, M.hy - 78 * s, '#bfe0f2');
        chip(c, M.bx, M.by + 40 * bs + 18, '차가운 완충액', G.tissue && !G.buffer ? '#ffd23f' : '#fff8e6', 11);
        /* 얼음통 — 오른쪽 아래. 다 간 뒤 차례 */
        var is = Math.min(1.4, Math.max(.7, s * .8));
        M.ix = w * .80; M.iy = Math.max(M.by + 40 * bs + 60 + 30 * is, h - 40 - 18 * is); M.is = is;
        if (!G.ice) {
          c.save(); c.translate(M.ix, M.iy); c.scale(is, is);
          c.fillStyle = 'rgba(0,0,0,.35)'; rr(c, -40 + 5 / is, -28 + 5 / is, 80, 46, 8); c.fill();
          rr(c, -40, -28, 80, 46, 8); c.fillStyle = '#9fd3f0'; c.fill(); c.strokeStyle = st.g >= 1 ? '#ff5c5c' : INK; c.lineWidth = 3 / is; c.stroke();
          c.fillStyle = '#e8f7ff';
          [[-24, -22], [-4, -26], [18, -20], [8, -34], [-14, -36]].forEach(function (p) {
            rr(c, p[0] - 7, p[1] - 6, 14, 12, 3); c.fill(); c.strokeStyle = INK; c.lineWidth = 1.8 / is; c.stroke();
          });
          c.restore();
          chip(c, M.ix, M.iy + 18 * is + 16, st.g >= 1 ? '얼음통 — 눌러서 담그기' : '얼음통', st.g >= 1 ? '#ffd23f' : '#fff8e6', 11);
          if (st.g >= 1) E.grab(c, M.ix, M.iy, 44 * is, t);
        }
        /* 갈기 진행 막대 */
        if (G.tissue && G.buffer) {
          var bw = Math.min(200, w * .30), bx0 = M.hx - bw / 2, by0 = Math.max(32, M.hy - 225 * s - 30);
          c.save();
          rr(c, bx0, by0, bw, 12, 6); c.fillStyle = '#fff8e6'; c.fill();
          c.save(); rr(c, bx0, by0, bw, 12, 6); c.clip();
          c.fillStyle = st.g >= 1 ? '#5fd68a' : '#ff9f43'; c.fillRect(bx0, by0, bw * st.g, 12); c.restore();
          c.strokeStyle = INK; c.lineWidth = 2.5; c.stroke(); c.restore();
          label(c, M.hx, by0 - 12, st.g >= 1 ? '파쇄액이 됐다' : '파쇄 ' + Math.round(st.g * 100) + ' %', 'rgba(220,232,245,.9)', 11);
        }
        E.hint(stage, !G.tissue ? '간 조직을 눌러 균질기에 넣으세요'
          : !G.buffer ? '완충액 병을 눌러 부으세요'
          : st.g < 1 ? '막대를 잡고 위아래로 끌어 세포를 부수세요'
          : !G.ice ? '얼음통을 눌러 담그세요' : '파쇄액이 준비되었습니다');
      });

      /* 손맛 — 조직은 톡 떨어지고, 막대는 오르내릴 때마다 딸깍, 다 갈리면 폭죽 */
      E.drag(cv.cv, {
        start: function (ev) {
          var p = cv.pt(ev);
          if (!G.tissue) {
            if (E.dist(p.x, p.y, M.tx, M.ty) < 40 * (M.bs || 1) + 10) {
              G.tissue = 1; E.save(); st.tDrop = st.tNow; E.buzz(12); E.beep('thud'); E.kick();
              E.toast('간 조직을 넣었다. 이제 완충액.', 'good'); sync();
            }
            return;
          }
          if (!G.buffer) {
            if (E.dist(p.x, p.y, M.bx, M.by) < 50 * (M.bs || 1) + 10) {
              G.buffer = 1; E.save(); st.tPour = st.tNow; E.buzz(12); E.beep('whoosh');
              E.toast('차가운 완충액을 부었다. 막대로 부숴라.', 'good'); sync();
            }
            return;
          }
          if (st.g >= 1) {
            if (!G.ice && E.dist(p.x, p.y, M.ix, M.iy) < 50 * (M.is || 1) + 10) {
              G.ice = 1; E.save(); st.tIce = st.tNow; E.buzz(14); E.beep('snap'); E.kick();
              E.burst(M.hx, M.hy - 40 * M.s, '#9fd3f0', 12, 2.4);
              E.toast('얼음에 담갔다. 효소가 느려진다.', 'good'); sync();
            } else if (E.dist(p.x, p.y, M.hx, M.hy - 100 * M.s) < 110 * M.s) {
              E.toast(G.ice ? '파쇄액이 됐다. 「다음」으로 가라.' : '이미 다 부쉈다. 얼음통에 담가라.');
            }
            return;
          }
          if (E.dist(p.x, p.y, M.rodX, M.rodY) < 40 * M.s + 10) st.drag = { y0: p.y, r0: st.rod, acc: 0, last: st.rod };
        },
        move: function (ev) {
          if (!st.drag || st.g >= 1) return;
          var p = cv.pt(ev);
          var nr = E.clamp(st.drag.r0 + (p.y - st.drag.y0) / M.s, 0, 60);
          st.drag.acc += Math.abs(nr - st.drag.last); st.drag.last = nr;
          st.rod = nr;
          E.detent(st, 'tk', st.rod, 12);
          if (st.drag.acc > 30) {
            st.drag.acc = 0;
            st.g = Math.min(1, st.g + .07); G.g = st.g; E.save();
            if (st.g >= 1) {
              E.buzz(20); E.beep('good'); E.kick();
              E.burst(M.hx, M.hy - 80 * M.s, null, 14, 2.6);
              E.pop(M.hx, M.hy - 200 * M.s, '파쇄됐다!', '#127a5a', true);
              E.toast('됐다. 얼음통에 담가라.', 'good');
            }
            sync();
          }
        },
        end: function () { st.drag = null; }
      });

      panel.innerHTML =
        '<div class="card"><h3>과정 1</h3>' +
        '<p>간 조직을 균질기에 넣고 <b>차가운 완충액</b>을 부은 뒤 막대로 세포를 부수어 <b>세포 파쇄액</b>을 만든다. ' +
        '파쇄액은 얼음통에 담가 둔다.</p></div>' +
        '<div class="card"><h3>왜 이렇게 할까</h3>' +
        '<p>세포막만 부수고 <b>소기관은 온전하게</b> 남겨야 갈라낼 수 있습니다. 너무 세게 갈면 소기관까지 부서집니다. ' +
        '파쇄액에는 핵, 마이토콘드리아, 막 조각, 라이보솜이 <b>섞여</b> 있습니다.</p>' +
        '<p class="muted">차가운 완충액과 얼음통은 교과서에 없는 실험실의 원칙입니다. 교과서는 「세포나 조직을 파쇄한 뒤」라고만 씁니다.</p></div>';
      var ck = E.el('div', { cls: 'card' });
      ck.appendChild(E.el('h3', { text: '진행' }));
      var l1 = E.el('div', { cls: 'chk' }, E.el('span', { cls: 'bx' }), E.el('span', { text: '간 조직 넣기' }));
      var l2 = E.el('div', { cls: 'chk' }, E.el('span', { cls: 'bx' }), E.el('span', { text: '차가운 완충액 붓기' }));
      var l3 = E.el('div', { cls: 'chk' }, E.el('span', { cls: 'bx' }), E.el('span', { text: '막대로 부수기' }));
      var l4 = E.el('div', { cls: 'chk' }, E.el('span', { cls: 'bx' }), E.el('span', { text: '얼음통에 담그기' }));
      ck.appendChild(l1); ck.appendChild(l2); ck.appendChild(l3); ck.appendChild(l4);
      var row = E.el('div', { cls: 'btnrow' });
      var rb = E.el('button', { cls: 'btn ghost', type: 'button', text: '다시 하기' });
      rb.addEventListener('click', function () {
        D.grind = G = { tissue: 0, buffer: 0, g: 0, ice: 0 }; st.g = 0; st.rod = 0; st.done = 0; E.save(); sync();
      });
      row.appendChild(rb); ck.appendChild(row); panel.appendChild(ck);
      E.quiz(panel, Q, sync);

      function sync() {
        l1.classList.toggle('done', !!G.tissue);
        l2.classList.toggle('done', !!G.buffer);
        l3.classList.toggle('done', st.g >= 1);
        l4.classList.toggle('done', !!G.ice);
        var all = G.tissue && G.buffer && st.g >= 1 && G.ice;
        var qok = !!(D._ans[Q.id] && D._ans[Q.id].ok);
        E.gate(all && qok, all ? '확인 문항을 풀어야 넘어갑니다'
          : !G.tissue ? '간 조직을 넣으세요' : !G.buffer ? '완충액을 부으세요'
          : st.g < 1 ? '막대로 세포를 부수세요' : '얼음통에 담그세요');
      }
      sync();
    }
  };
}

/* ================================================================
   장면 4. 튜브에 담고 균형 맞추기
   ================================================================ */
function scTube() {
  var Q = {
    id: 'ch_balance',
    q: '파쇄액이 든 튜브 A 의 <b>맞은편에 물이 든 튜브 B</b>를 같은 무게로 넣는 까닭은?',
    opts: [
      '물이 파쇄액에 조금씩 섞여 들어가 소기관이 잘 갈라지는 농도로 맞춰 주기 때문에',
      '튜브 B 에도 세포소기관이 조금 들어가 파쇄액과 함께 네 분획으로 갈라지기 때문에',
      '두 튜브를 나란히 비교해 파쇄액의 색이 얼마나 탁한지 확인하려고',
      '빠르게 도는 로터의 무게가 한쪽으로 쏠리지 않게 균형을 맞추려고'
    ],
    a: 3,
    why: '원심분리기는 아주 빠르게 돕니다. 마주 보는 자리의 무게가 다르면 로터가 한쪽으로 쏠려 ' +
         '<b>기계가 흔들리고 축이 상합니다.</b> 그래서 맞은편에 <b>같은 무게</b>의 튜브를 넣어 균형을 맞춥니다. ' +
         '교과서 27쪽의 간이 원심분리 기구에서 빈 모세관을 함께 넣는 것과 같은 까닭입니다.',
    bad: {
      0: '튜브 B 의 물은 튜브 A 와 섞이지 않습니다. 따로 든 채 돕니다.',
      1: '튜브 B 에는 파쇄액이 없습니다. 무게만 맞추는 것입니다.',
      2: '색을 비교하려는 것이 아닙니다. 무게를 생각해 보세요.'
    }
  };
  return {
    id: 'tube', chap: '파쇄액 만들기', name: '튜브 균형 맞추기',
    guide: '파쇄액을 튜브 A 에 <b>' + TUBE_ML + ' mL</b> 담고, 맞은편 튜브 B 에는 물을 넣어 ' +
           '<span class="hl">저울이 수평이 되게</span> 맞춥니다.',
    mount: function (stage, panel) {
      var T = D.tube;
      var st = { tilt: 0, sp: null, pourA: -9, pourB: -9, tNow: 0, done: 0, visA: T.a, visB: T.b };
      var cv = E.canvas(stage), M = {};
      function targetTilt() { return E.clamp((T.b - T.a) * .035, -.22, .22); }
      st.tilt = targetTilt();
      cv.on(function (c, w, h, t) {
        E.dbg = { n: 'tube', M: M, st: st, T: T };
        st.tNow = t;
        /* 저울(국소 폭 260, 높이 150 + 접시 위 튜브 150*ts)이 무대를 채운다 */
        var s = Math.min(w * .62 / 280, (h - 130) / 175);
        M.sx = w * .40; M.sy = h - 20; M.s = s;
        var ts = s * .62;
        var pans = drawBalance(c, M.sx, M.sy, s, st.tilt);
        M.pa = pans[0]; M.pb = pans[1]; M.ts = ts;
        var pkA = t - st.pourA, pkB = t - st.pourB;
        drawTube(c, M.pa.x, M.pa.y, ts, { liquid: st.visA / TUBE_ML * .85, col: SUP[0], cap: T.a >= TUBE_ML, capCol: '#c0553f' });
        drawTube(c, M.pb.x, M.pb.y, ts, { liquid: st.visB / TUBE_ML * .85, col: '#bfe0f2', cap: T.a >= TUBE_ML && T.b === T.a, capCol: '#4f97cc' });
        chip(c, M.pa.x, M.pa.y - TH * ts - 18, 'A 파쇄액 ' + T.a + ' mL', T.a >= TUBE_ML ? '#5fd68a' : '#fff8e6', 11);
        chip(c, M.pb.x, M.pb.y - TH * ts - 18, 'B 물 ' + T.b + ' mL', T.a >= TUBE_ML && T.b === T.a ? '#5fd68a' : T.b > T.a ? '#ff9f9f' : '#fff8e6', 11);
        /* 수평 표시 */
        var lvl = Math.abs(st.tilt) < .004 && T.a >= TUBE_ML && T.b === T.a;
        chip(c, M.sx, M.sy - 120 * s - 34, lvl ? '수평' : T.b > T.a ? 'B 가 무겁다' : T.a > T.b ? 'A 가 무겁다' : '비어 있다',
          lvl ? '#5fd68a' : '#fff8e6', 12);

        /* 오른쪽 기둥 — 위에 파쇄액 비커, 아래에 물병 */
        var bks = Math.min(1.1, Math.max(.55, s * .55));
        M.kx = Math.min(w * .86, w - 50 * bks - 10); M.ky = Math.max(100 * bks + 10, h * .40); M.ks = bks;
        var tiltA = pkA >= 0 && pkA < .5 ? -Math.sin(pkA / .5 * Math.PI) * .55 : 0;
        c.save(); c.translate(M.kx, M.ky); c.rotate(tiltA); c.translate(-M.kx, -M.ky);
        drawBeaker(c, M.kx, M.ky, bks, { liquid: .7 - T.a / TUBE_ML * .4, col: SUP[0], hi: T.a < TUBE_ML });
        c.restore();
        if (tiltA < -.2) pourStream(c, M.kx - 20 * bks, M.ky - 60 * bks, bks, tiltA, M.pa.x + 6 * ts, M.pa.y - TH * ts + 4, M.pa.y - st.visA / TUBE_ML * .85 * (TH - 14) * ts, SUP[0]);
        chip(c, Math.min(M.kx, w - 44), M.ky + 18, T.a < TUBE_ML && w >= 600 ? '파쇄액 — 눌러서 붓기' : '파쇄액', T.a < TUBE_ML ? '#ffd23f' : '#fff8e6', 10.5);
        var bs = Math.min(1.5, Math.max(.8, s * .75));
        M.bx = Math.min(w * .86, w - 24 * bs - 10); M.by = Math.min(h - 40 * bs - 24, M.ky + 60 + 50 * bs); M.bs = bs;
        var tiltB = pkB >= 0 && pkB < .45 ? -Math.sin(pkB / .45 * Math.PI) * .9 : 0;
        drawBottle(c, M.bx, M.by, '#bfe0f2', T.a >= TUBE_ML && T.b < T.a, tiltB, bs);
        if (tiltB < -.25) pourStream(c, M.bx, M.by, bs, tiltB, M.pb.x + 6 * ts, M.pb.y - TH * ts + 4, M.pb.y - st.visB / TUBE_ML * .85 * (TH - 14) * ts, '#bfe0f2');
        chip(c, Math.min(M.bx, w - 40), Math.min(h - 14, M.by + 40 * bs + 16), T.a >= TUBE_ML && T.b < T.a && w >= 600 ? '물 — 눌러서 1 mL' : '물', T.a >= TUBE_ML && T.b < T.a ? '#ffd23f' : '#fff8e6', 10.5);

        E.hint(stage, T.a < TUBE_ML ? '비커를 눌러 파쇄액을 A 에 ' + TUBE_ML + ' mL 담으세요 (' + T.a + ' mL)'
          : T.b < T.a ? '물병을 눌러 B 에 물을 넣으세요 (' + T.b + ' mL)'
          : T.b > T.a ? '물이 너무 많습니다. 비우고 다시' : '수평입니다. 균형이 맞았습니다');
      });

      function springTilt() {
        if (st.sp) st.sp.stop();
        st.sp = E.spring(st.tilt, targetTilt(), function (v) { st.tilt = v; }, { k: 90, d: 7 });
      }
      E.drag(cv.cv, {
        start: function (ev) {
          var p = cv.pt(ev);
          if (E.dist(p.x, p.y, M.kx, M.ky - 50 * M.ks) < 60 * M.ks + 10) {
            if (T.a >= TUBE_ML) { E.toast('A 는 찼다. 이제 B 에 물을 넣어라.'); return; }
            T.a = Math.min(TUBE_ML, T.a + 2); E.save(); st.pourA = st.tNow; E.buzz(10); E.beep('whoosh');
            E.spring(st.visA, T.a, function (v) { st.visA = v; }, { k: 160, d: 9 });
            springTilt();
            if (T.a >= TUBE_ML) { E.beep('snap'); E.pop(M.pa.x, M.pa.y - TH * M.ts - 40, TUBE_ML + ' mL', '#127a5a', true); }
            sync(); return;
          }
          if (E.dist(p.x, p.y, M.bx, M.by) < 50 * M.bs + 10) {
            if (T.a < TUBE_ML) { E.toast('먼저 A 에 파쇄액을 담아라.', 'bad'); return; }
            T.b = T.b + 1; E.save(); st.pourB = st.tNow; E.buzz(10); E.beep('whoosh');
            E.spring(st.visB, T.b, function (v) { st.visB = v; }, { k: 160, d: 9 });
            springTilt();
            if (T.b === T.a) { E.beep('snap'); E.kick(); E.pop(M.sx, M.sy - 120 * M.s - 60, '수평!', '#127a5a', true); E.burst(M.sx, M.sy - 120 * M.s, null, 12, 2.4); }
            else if (T.b > T.a) E.toast('너무 넣었다. B 가 무겁다. 비우고 다시.', 'bad');
            sync();
          }
        }
      });

      panel.innerHTML =
        '<div class="card"><h3>과정 2</h3>' +
        '<p>파쇄액을 원심분리 튜브 A 에 <b>' + TUBE_ML + ' mL</b> 담고, 맞은편에 넣을 튜브 B 에는 ' +
        '<b>같은 무게</b>가 되도록 물을 넣는다. 저울이 수평이면 됐다.</p></div>' +
        '<div class="card"><h3>교과서 27쪽과 같은 까닭</h3>' +
        '<p>간이 원심분리 기구에서 <b>빈 모세관을 함께 넣는 것</b>은 균형을 맞추기 위해서입니다. ' +
        '진짜 원심분리기도 같습니다. 무게가 안 맞으면 기계가 흔들리고 망가집니다.</p></div>';
      var ck = E.el('div', { cls: 'card' });
      ck.appendChild(E.el('h3', { text: '진행' }));
      var l1 = E.el('div', { cls: 'chk' }, E.el('span', { cls: 'bx' }), E.el('span', { text: 'A 에 파쇄액 ' + TUBE_ML + ' mL' }));
      var l2 = E.el('div', { cls: 'chk' }, E.el('span', { cls: 'bx' }), E.el('span', { text: 'B 에 물 — 저울 수평' }));
      ck.appendChild(l1); ck.appendChild(l2);
      var warn = E.el('div'); ck.appendChild(warn);
      var row = E.el('div', { cls: 'btnrow' });
      var rb = E.el('button', { cls: 'btn ghost', type: 'button', text: 'B 비우고 다시' });
      rb.addEventListener('click', function () {
        T.b = 0; st.done = 0; E.save();
        E.spring(st.visB, 0, function (v) { st.visB = v; }, { k: 120, d: 12 });
        springTilt(); sync();
      });
      row.appendChild(rb); ck.appendChild(row); panel.appendChild(ck);
      E.quiz(panel, Q, sync);

      function sync() {
        var okA = T.a >= TUBE_ML, ok = okA && T.b === T.a;
        l1.classList.toggle('done', okA);
        l2.classList.toggle('done', ok);
        warn.innerHTML = T.b > T.a
          ? '<div class="why bad">B 가 <b>' + T.b + ' mL</b> 로 A 보다 무겁습니다. <b>B 비우고 다시</b>를 누르세요.</div>' : '';
        var qok = !!(D._ans[Q.id] && D._ans[Q.id].ok);
        E.gate(ok && qok, ok ? '확인 문항을 풀어야 넘어갑니다'
          : !okA ? 'A 에 파쇄액을 ' + TUBE_ML + ' mL 담으세요' : T.b > T.a ? 'B 를 비우고 다시 맞추세요' : 'B 에 물을 넣어 수평을 맞추세요');
      }
      sync();
    }
  };
}

/* ================================================================
   장면 5. 로터에 꽂기
   ================================================================ */
function scRotor() {
  var Q = {
    id: 'ch_opposite',
    q: '튜브 A 와 B 를 로터의 <b>마주 보는 자리</b>에 꽂는 까닭은?',
    opts: [
      '무게가 같은 두 튜브가 마주 보아야 무게 중심이 축 위에 놓이기 때문에',
      '마주 보아야 도는 동안 두 튜브의 액이 서로 섞여 농도가 고르게 되기 때문에',
      '옆자리에 꽂으면 도는 동안 튜브끼리 부딪쳐 깨질 수 있기 때문에',

    a: 0,
    why: '무게가 같은 두 튜브를 <b>축을 사이에 두고 마주 보게</b> 두어야 회전할 때 무게 중심이 축 위에 놓입니다. ' +
         '옆자리에 두면 무게가 한쪽으로 쏠려, 아무리 무게를 맞춰도 로터가 흔들립니다.',
    bad: {
      1: '두 튜브의 액은 섞이지 않습니다. 따로 든 채 돕니다.',
      2: '튜브는 자리 안에 들어 있어 부딪치지 않습니다. 문제는 무게의 쏠림입니다.',
      3: '로터의 모든 자리는 같은 속도로 돕니다.'
    }
  };
  return {
    id: 'rotor', chap: '원심분리', name: '로터에 꽂기',
    guide: '튜브 A 를 로터에 꽂고, 튜브 B 는 <span class="hl">A 의 맞은편</span>에 꽂습니다. 그다음 뚜껑을 닫습니다.',
    mount: function (stage, panel) {
      var R = D.rotor;
      var st = { drag: null, lidK: R.lid ? 1 : 0, sp: null, tNow: 0, tPut: {} };
      var cv = E.canvas(stage), M = { slots: [] };
      cv.on(function (c, w, h, t) {
        E.dbg = { n: 'rotor', M: M, st: st, R: R };
        st.tNow = t;
        var s = Math.min(w * .58 / 300, (h - 44) / 300);
        M.rx = w * .40; M.ry = h * .50; M.s = s;
        var slots = [];
        for (var i = 0; i < SLOT_N; i++) slots.push({ tube: R.a === i ? { col: SUP[0], capCol: '#c0553f' } : R.b === i ? { col: '#bfe0f2', capCol: '#4f97cc' } : null });
        var hi = R.a >= 0 && R.b < 0 ? (R.a + 3) % SLOT_N : -1;
        M.slots = drawRotor(c, M.rx, M.ry, s, { ang: 0, slots: slots, lid: st.lidK, hi: hi });
        chip(c, M.rx, Math.min(h - 14, M.ry + (ROTOR_R + 14) * s + 18), '원심분리기 로터 (위에서 본 모습)', '#fff8e6', 11);
        /* 자리 글자 — A, B */
        M.slots.forEach(function (p) {
          if (R.a === p.i) label(c, p.x, p.y, 'A', '#fff8e6', 13);
          if (R.b === p.i) label(c, p.x, p.y, 'B', '#fff8e6', 13);
        });
        if (hi >= 0) { var hp = M.slots[hi]; E.target(c, hp.x, hp.y, 60 * s, 60 * s, t); }
        /* 오른쪽 기둥 — 튜브 A(위), B(아래), 뚜껑(맨 아래) */
        var ts = Math.min(s * .55, (h - 60) / 2 / (TH + 40));
        M.ts = ts;
        var col = w * .84;
        M.ta = { x: col, y: Math.min(h * .48, TH * ts + 40) };
        M.tb = { x: col, y: Math.min(h - 30, M.ta.y + TH * ts + 44) };
        if (R.a < 0) {
          var pa = st.drag && st.drag.k === 'a' ? st.drag.p : M.ta;
          drawTube(c, pa.x, pa.y, ts, { liquid: .85, col: SUP[0], cap: 1, capCol: '#c0553f', hi: !!st.drag && st.drag.k === 'a' });
          if (!st.drag) { chip(c, pa.x, pa.y - TH * ts - 16, 'A — 끌어서 꽂기', '#ffd23f', 10.5); E.grab(c, pa.x, pa.y - TH * ts / 2, 30 * ts, t); }
        }
        if (R.b < 0) {
          var pb = st.drag && st.drag.k === 'b' ? st.drag.p : M.tb;
          drawTube(c, pb.x, pb.y, ts, { liquid: .85, col: '#bfe0f2', cap: 1, capCol: '#4f97cc', hi: !!st.drag && st.drag.k === 'b' });
          if (!st.drag) { chip(c, pb.x, pb.y - TH * ts - 16, R.a >= 0 ? 'B — 맞은편에' : 'B', R.a >= 0 ? '#ffd23f' : '#fff8e6', 10.5); if (R.a >= 0) E.grab(c, pb.x, pb.y - TH * ts / 2, 30 * ts, t); }
        }
        /* 뚜껑 — 둘 다 꽂힌 뒤 오른쪽 아래에. 누르면 닫힌다 */
        if (R.a >= 0 && R.b >= 0 && !R.lid) {
          var ls = s * .5;
          M.lid = { x: col, y: h - 40 - 60 * ls, r: 70 * ls };
          c.save();
          c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(M.lid.x + 5, M.lid.y + 5, 70 * ls, 40 * ls, 0, 0, Math.PI * 2); c.fill();
          c.beginPath(); c.ellipse(M.lid.x, M.lid.y, 70 * ls, 40 * ls, 0, 0, Math.PI * 2); c.fillStyle = 'rgba(191,224,242,.85)'; c.fill(); c.strokeStyle = INK; c.lineWidth = 2.8; c.stroke();
          c.beginPath(); c.ellipse(M.lid.x, M.lid.y, 14 * ls, 8 * ls, 0, 0, Math.PI * 2); c.fillStyle = '#3b4757'; c.fill(); c.stroke();
          c.restore();
          chip(c, M.lid.x, M.lid.y + 40 * ls + 16, '뚜껑 — 눌러서 닫기', '#ffd23f', 10.5);
          E.grab(c, M.lid.x, M.lid.y, 50 * ls, t);
        } else M.lid = null;
        E.hint(stage, R.a < 0 ? '튜브 A 를 끌어 로터의 한 자리에 꽂으세요'
          : R.b < 0 ? '튜브 B 를 A 의 맞은편 자리에 꽂으세요'
          : !R.lid ? '뚜껑을 눌러 닫으세요' : '뚜껑을 닫았습니다. 돌릴 준비가 됐습니다');
      });
      function nearSlot(p) {
        var best = null, bd = 1e9;
        M.slots.forEach(function (q) { var d = E.dist(p.x, p.y, q.x, q.y); if (d < bd) { bd = d; best = q; } });
        return bd < 36 * M.s ? best : null;
      }
      E.drag(cv.cv, {
        start: function (ev) {
          var p = cv.pt(ev);
          if (M.lid && E.dist(p.x, p.y, M.lid.x, M.lid.y) < M.lid.r + 10) {
            R.lid = 1; E.save(); E.buzz(14); E.beep('snap'); E.kick();
            if (st.sp) st.sp.stop();
            st.sp = E.spring(0, 1, function (v) { st.lidK = v; }, { k: 140, d: 12 });
            E.toast('뚜껑을 닫았다.', 'good'); sync(); return;
          }
          if (R.a < 0 && Math.abs(p.x - M.ta.x) < 30 * M.ts + 10 && p.y < M.ta.y + 10 && p.y > M.ta.y - TH * M.ts - 20) { st.drag = { k: 'a', p: p }; E.beep('tick'); return; }
          if (R.b < 0 && Math.abs(p.x - M.tb.x) < 30 * M.ts + 10 && p.y < M.tb.y + 10 && p.y > M.tb.y - TH * M.ts - 20) {
            if (R.a < 0) { E.toast('A 부터 꽂아라.', 'bad'); return; }
            st.drag = { k: 'b', p: p }; E.beep('tick'); return;
          }
        },
        move: function (ev) {
          if (!st.drag) return;
          var p = cv.pt(ev), q = nearSlot(p);
          var want = st.drag.k === 'b' ? (R.a + 3) % SLOT_N : -1;
          if (q && (want < 0 ? q.i !== R.a : q.i === want)) {
            p = { x: p.x + (q.x - p.x) * .5, y: p.y + (q.y - p.y) * .5 + TH * M.ts * .5 };
            if (st.drag.near !== q.i) { E.beep('tick'); E.buzz(6); }
            st.drag.near = q.i;
          } else st.drag.near = -1;
          st.drag.p = p;

        end: function (ev) {
          if (!st.drag) return;
          var g = st.drag; st.drag = null;
          var p = cv.pt(ev), q = nearSlot({ x: p.x, y: p.y });
          if (!q) { E.toast('로터의 자리에 꽂아라.', 'bad'); return; }
          if (g.k === 'a') {
            R.a = q.i; E.save(); E.buzz(14); E.beep('snap'); E.kick();
            E.burst(q.x, q.y, null, 10, 2.2); E.toast('A 를 꽂았다. B 는 맞은편에.', 'good'); sync(); return;
          }
          var want = (R.a + 3) % SLOT_N;
          if (q.i === R.a) { E.toast('그 자리는 A 가 있다.', 'bad'); return; }
          if (q.i !== want) { E.buzz(40); E.toast('옆자리가 아니라 맞은편이다. 무게가 쏠린다.', 'bad'); return; }
          R.b = q.i; E.save(); E.buzz(16); E.beep('snap'); E.kick();
          E.burst(q.x, q.y, null, 12, 2.4); E.pop(M.rx, M.ry - (ROTOR_R + 40) * M.s, '균형!', '#127a5a', true);
          E.toast('B 를 맞은편에 꽂았다. 뚜껑을 닫아라.', 'good'); sync();
        }
      });

      panel.innerHTML =
        '<div class="card"><h3>과정 3</h3>' +
        '<p>튜브 A 와 B 를 로터의 <b>마주 보는 자리</b>에 꽂고 <b>뚜껑을 닫는다.</b></p></div>' +
        '<div class="card"><h3>왜 마주 보게</h3>' +
        '<p>무게가 같은 두 튜브가 축을 사이에 두고 마주 보아야 회전할 때 <b>무게 중심이 축 위에</b> 놓입니다. ' +
        '옆자리에 두면 무게가 한쪽으로 쏠립니다.</p></div>';
      var ck = E.el('div', { cls: 'card' });
      ck.appendChild(E.el('h3', { text: '진행' }));
      var l1 = E.el('div', { cls: 'chk' }, E.el('span', { cls: 'bx' }), E.el('span', { text: 'A 꽂기' }));
      var l2 = E.el('div', { cls: 'chk' }, E.el('span', { cls: 'bx' }), E.el('span', { text: 'B 를 맞은편에' }));
      var l3 = E.el('div', { cls: 'chk' }, E.el('span', { cls: 'bx' }), E.el('span', { text: '뚜껑 닫기' }));
      ck.appendChild(l1); ck.appendChild(l2); ck.appendChild(l3);

        var qok = !!(D._ans[Q.id] && D._ans[Q.id].ok);
        E.gate(all && qok, all ? '확인 문항을 풀어야 넘어갑니다'
          : R.a < 0 ? '튜브 A 를 꽂으세요' : R.b < 0 ? '튜브 B 를 맞은편에 꽂으세요' : '뚜껑을 닫으세요');
      }
      sync();
    }
  };
}

/* ================================================================
   원심분리기 — 6장면(첫 회전)과 8장면(세 번 더)이 같은 기계를 쓴다.
   무대: 왼쪽 확대 창(튜브 A 속), 가운데 로터(위에서 본 모습, 돈다), 오른쪽 기둥(속도 다이얼, 시간 다이얼, 시작 단추).
   상층액을 옮길 차례면 오른쪽 기둥이 피펫으로 바뀐다.
   ================================================================ */
var SPIN_MS = 3000, DEC_MS = 1400;
function pelletsSoFar() {
  var out = [];
  for (var i = 0; i < D.frac.dec; i++) out.push(STEPS[i]);
  return out;
}
/* 튜브 A 의 지금 상태 — 상층액 색은 옮긴 횟수, 침전은 돌린 횟수와 옮긴 횟수의 차 */
function tubeNow(vis, spinning) {
  var F = D.frac;
  /* 돌리는 중에는 아직 F.spun 이 안 올랐다. 그때도 침전이 모이는 것이 보여야 한다 */
  var hasPellet = F.spun > F.dec || !!spinning;
  var ci = Math.min(STEPS.length - 1, F.spun > F.dec ? F.dec : F.spun);
  return { liquid: .82, col: SUP[Math.min(4, F.dec)], pellet: hasPellet ? (vis == null ? 1 : vis) : 0,
           pcol: hasPellet ? STEPS[ci].col : null, cap: 1, capCol: '#c0553f' };
}
function centrifugeScene(cfg) {
  var Q = cfg.Q;
  return {
    id: cfg.id, chap: cfg.chap, name: cfg.name, guide: cfg.guide,
    mount: function (stage, panel) {
      var F = D.frac;
      var st = { gi: 0, ti: 0, run: 0, spinAt: -1e9, decAt: -1e9, ang: 0, drag: null, pel: F.spun > F.dec ? 1 : 0,
                 sp: null, tNow: 0, last: performance.now(), msg: '', tRes: -9, visG: 0, visT: 0 };
      var cv = E.canvas(stage), M = {};
      function running() { return performance.now() - st.spinAt < SPIN_MS; }
      function decanting() { return performance.now() - st.decAt < DEC_MS; }
      /* 네 번째 회전이 끝난 직후 run 이 참인 프레임이 한 번 더 그려지면 STEPS[4] 가 없다 — 마지막 단계로 막는다 */
      function need() { return STEPS[Math.min(F.spun, STEPS.length - 1)]; }
      function phase() {
        /* 'spin' 돌릴 차례, 'dec' 옮길 차례, 'done' 이 장면 끝.
           옮기기가 없는 장면(6장면)은 회전이 끝나면 곧 done — 피펫은 7장면의 일이다 */
        if (!cfg.decant) return F.spun >= cfg.to ? 'done' : 'spin';
        if (F.spun > F.dec) return 'dec';
        if (F.spun >= cfg.to) return 'done';
        return 'spin';
      }
      var tick = setInterval(function () {
        var now = performance.now(), dt = (now - st.last) / 1000; st.last = now;
        if (running()) st.ang += dt * (2 + st.gi * 6);
        st.visG += (st.gi - st.visG) * .25; st.visT += (st.ti - st.visT) * .25;
      }, 40);

      cv.on(function (c, w, h, t) {
        E.dbg = { n: cfg.id, M: M, st: st, F: F, phase: phase() };
        st.tNow = t;
        var ph = phase(), run = running(), dec = decanting();
        /* 로터 — 가운데, 무대 높이의 대부분 */
        var s = Math.min(w * .44 / 300, (h - 60) / 300);
        M.rx = w * .46; M.ry = h * .50; M.s = s;
        var slots = [];
        for (var i = 0; i < SLOT_N; i++) slots.push({ tube: D.rotor.a === i ? { col: SUP[Math.min(4, F.dec)], capCol: '#c0553f' } : D.rotor.b === i ? { col: '#bfe0f2', capCol: '#4f97cc' } : null });
        drawRotor(c, M.rx, M.ry, s, { ang: st.ang, slots: slots, lid: 1 });
        /* 회전 중 잔상 고리 */
        if (run) {
          c.save(); c.globalAlpha = .35; c.strokeStyle = '#ffd23f'; c.lineWidth = 6; c.setLineDash([30, 22]); c.lineDashOffset = -t * 300;
          c.beginPath(); c.arc(M.rx, M.ry, (ROTOR_R + 26) * s, 0, Math.PI * 2); c.stroke(); c.restore();
        }
        var prog = run ? (performance.now() - st.spinAt) / SPIN_MS : 0;
        var np = need();
        if (run) ringClock(c, M.rx, M.ry, Math.min(46, 30 * s + 10), prog, tTxt(Math.round(prog * STOPS_T[st.ti])), null);
        chip(c, M.rx, Math.min(h - 14, M.ry + (ROTOR_R + 14) * s + 18),
          run ? gTxt(STOPS_G[st.gi]) + ', ' + tTxt(STOPS_T[st.ti]) + ' 회전 중' : '원심분리기', run ? '#ffd23f' : '#fff8e6', 11);

        /* 확대 창 — 왼쪽. 튜브 A 속. 돌리는 동안 침전이 모인다 */
        var R = Math.min(72, w * .11, h * .18), zx = w * .13, zy = Math.min(h * .34, 30 + R);
        M.zx = zx; M.zy = zy; M.R = R;
        var pelVis = st.pel;
        if (run) {
          /* 맞게 맞췄으면 돌수록 침전이 모이고, 틀렸으면 안 모이거나 두 색이 뒤섞인다 */
          var right = STOPS_G[st.gi] === np.g && STOPS_T[st.ti] === np.min;
          pelVis = right ? Math.pow(prog, 1.6) : STOPS_G[st.gi] > np.g ? Math.pow(prog, 1.6) : prog * .12;
        }
        var tubeS = R * 2 / TH * .9;
        zoomRing(c, zx, zy, R, popK(t - st.tRes), function (c2) {
          var o = tubeNow(pelVis, run);
          if (run && STOPS_G[st.gi] > np.g) o.pcol = '#9a6a5c';           /* 뒤섞인 침전 — 탁한 갈색 */
          o.cap = 0;
          if (dec) {
            var dk = ease((performance.now() - st.decAt) / DEC_MS);
            o.liquid = .82 * (1 - dk * .92);
          }
          drawTube(c2, zx, zy + R * .78, tubeS, o);
        });
        chip(c, zx, zy - R - 18, '튜브 A 확대', '#fff8e6', 11);
        chip(c, zx, zy + R + 20, ph === 'dec' ? '침전 ' + STEPS[F.dec].short : F.dec >= 1 && ph !== 'dec' ? '상층액만 남음' : '섞여 있음',
          ph === 'dec' ? STEPS[F.dec].col : '#fff8e6', 11);

        /* 침전 선반 — 왼쪽 아래. 지금까지 얻은 침전 튜브들 */
        var got = pelletsSoFar();
        if (got.length) {
          var rs = Math.min(s * .34, (h - zy - R - 70) / (TH + 30));
          var gap = Math.max(26 * rs * 1.4, 30);
          M.rack = [];
          got.forEach(function (sp, i) {
            var x = w * .05 + i * gap + 14 * rs, y = h - 30;
            drawTube(c, x, y, rs, { liquid: .25, col: sp.col, pellet: 1, pcol: sp.col, cap: 1, capCol: sp.col });
            M.rack.push({ k: sp.k, x: x, y: y });
            label(c, x, y + 12, String(i + 1), '#fff8e6', 9.5);      /* 이름은 9장면에서 붙인다. 여기서는 번호만 */
          });
          label(c, w * .05 + 14 * rs, h - 30 - (TH + 16) * rs - 10, '침전', 'rgba(220,232,245,.9)', 10.5, 'left');
        }

        /* 오른쪽 기둥 */
        var dR = Math.max(22, Math.min(44, w * .055, h * .09));
        var small = dR < 30;
        var col = Math.min(w * .84, w - dR - (small ? 24 : 36));
        M.dR = dR;
        /* 다이얼 둘과 시작 단추가 세로로 — 제목이 다이얼 아래에 붙으므로 그만큼 벌린다 */
        M.g = { x: col, y: dR + 30 }; M.t = { x: col, y: dR * 3 + (small ? 76 : 86) };
        M.btn = { x: col, y: Math.min(h - 30, dR * 4 + (small ? 130 : 142)), r: Math.max(20, Math.min(30, dR * .8)) };
        if (ph === 'spin' || run) {
          /* 눈금은 좁은 자리라 만 단위로 줄여 쓰고, 지금 값은 교과서 표기 그대로 제목 옆에 적는다 */
          M.gKnob = drawDial(c, M.g.x, M.g.y, dR, st.gi, ['0', '1천', '2만', '8만', '15만'],
            { vis: st.visG, hi: !run && !st.gi, small: small, title: '속도', now: st.gi ? gTxt(STOPS_G[st.gi]) : '0' });
          M.tKnob = drawDial(c, M.t.x, M.t.y, dR, st.ti, ['0', '10분', '20분', '60분', '3시간'],
            { vis: st.visT, hi: !run && st.gi > 0 && !st.ti, small: small, title: '시간', now: tTxt(STOPS_T[st.ti]) });
          /* 시작 단추 */
          var ready = st.gi > 0 && st.ti > 0 && !run;
          c.save();
          c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.arc(M.btn.x + 4, M.btn.y + 4, M.btn.r, 0, Math.PI * 2); c.fill();
          c.beginPath(); c.arc(M.btn.x, M.btn.y, M.btn.r, 0, Math.PI * 2);
          c.fillStyle = run ? '#ff5c5c' : ready ? '#5fd68a' : '#c7d1dc'; c.fill(); c.strokeStyle = INK; c.lineWidth = 3; c.stroke();
          c.restore();
          label(c, M.btn.x, M.btn.y, run ? '회전' : '시작', '#181322', 12.5);
          if (ready) E.grab(c, M.btn.x, M.btn.y, M.btn.r + 6, t);
          M.pip = null;
        } else if (ph === 'dec') {
          /* 피펫 — 끝이 튜브 확대 창 쪽을 향해 대기. 누르면 상층액을 빨아 새 튜브로 */
          var ps = Math.min(1.6, Math.max(.8, s * .9));
          M.pip = { x: col, y: h * .46 + 60 * ps, s: ps };
          var nts = Math.min(s * .4, (h - M.pip.y - 60) / (TH + 20));
          /* 새 튜브를 그릴 자리가 없으면 피펫도 제자리에서 붓는다(빈 자리에 붓던 것) */
          var mouthY = nts > .2 ? h - 20 - TH * nts - 4 : M.pip.y;
          var dk2 = dec ? (performance.now() - st.decAt) / DEC_MS : 0;
          var px = M.pip.x, py = M.pip.y;
          if (dec) {
            /* 앞 반은 확대 창(튜브 A)으로 내려가 빨고, 뒤 반은 새 튜브 입까지 가서 붓는다 */
            var k1 = ease(Math.min(1, dk2 * 2)), k2 = ease(Math.max(0, dk2 * 2 - 1));
            px = M.pip.x + (zx - M.pip.x) * k1; py = M.pip.y + (zy + R * .2 - M.pip.y) * k1;
            if (k2 > 0) { px = zx + (col - zx) * k2; py = zy + R * .2 + (mouthY - zy - R * .2) * k2; }
          }
          var pour = dec ? Math.max(0, dk2 * 2 - 1) : 0;             /* 새 튜브는 뒤 반에서만 찬다 */
          drawPipette(c, px, py, ps, { hi: !dec, fill: dec ? Math.sin(Math.min(1, dk2) * Math.PI) : 0, col: SUP[Math.min(4, F.dec + 1)] });
          if (!dec) { chip(c, Math.min(M.pip.x, w - (w < 600 ? 44 : 100)), Math.min(h - 14, M.pip.y + 22), w < 600 ? '피펫 — 누르기' : '피펫 — 눌러서 상층액 옮기기', '#ffd23f', 10.5); E.grab(c, M.pip.x, M.pip.y - 60 * ps, 40 * ps, t); }
          if (nts > .2) {
            drawTube(c, col, h - 20, nts, { liquid: .82 * pour, col: SUP[Math.min(4, F.dec + 1)], cap: 0 });
            label(c, col, h - 20 - TH * nts - 12, '새 튜브', 'rgba(220,232,245,.9)', 10);
          }
        } else {
          M.pip = null;
          chip(c, Math.min(col, w - 76), h * .5, '이 장면은 끝났습니다', '#5fd68a', 11);
        }
        /* 결과 말 — 회전이 끝난 직후 */
        if (st.msg && t - st.tRes < 3) chip(c, M.rx, Math.max(22, M.ry - (ROTOR_R + 14) * s - 22), st.msg, st.msgOK ? '#5fd68a' : '#ff9f9f', 11.5);

        E.hint(stage, run ? '회전 중… (' + gTxt(STOPS_G[st.gi]) + ', ' + tTxt(STOPS_T[st.ti]) + ')'
          : dec ? '상층액을 옮기는 중…'
          : ph === 'dec' ? '피펫을 눌러 상층액만 새 튜브로 옮기세요 (침전은 그대로)'
          : ph === 'done' ? (cfg.doneHint || '다 됐습니다')
          : !st.gi ? '속도 다이얼을 맞추세요 (다음은 ' + np.n + ')'
          : !st.ti ? '시간 다이얼을 돌려 맞추세요' : '시작 단추를 누르세요');
      });

      /* 다이얼 — 가운데를 기준으로 각도를 재어 눈금에 붙인다. 눈금마다 딸깍 */
      function dialIdx(p, d) {
        var a = Math.atan2(p.y - d.y, p.x - d.x) + Math.PI / 2;
        if (a > Math.PI) a -= Math.PI * 2;
        var k = (a + Math.PI * .75) / (Math.PI * 1.5);
        return E.clamp(Math.round(k * 4), 0, 4);
      }
      function startSpin() {
        if (running()) return;
        if (!st.gi || !st.ti) { E.toast('속도와 시간을 먼저 맞춰라.', 'bad'); E.buzz(30); return; }
        st.spinAt = performance.now(); st.last = performance.now(); E.buzz(14); E.beep('whoosh'); E.kick();
        st.msg = '';
        clearTimeout(st.tm);
        st.tm = setTimeout(finishSpin, SPIN_MS);
        sync();
      }
      function finishSpin() {
        if (cv.dead) return;
        var np = need(), g = STOPS_G[st.gi], m = STOPS_T[st.ti];
        st.tRes = st.tNow;
        if (g === np.g && m === np.min) {
          F.spun++; E.save(); st.pel = 0;
          if (st.sp) st.sp.stop();
          st.sp = E.spring(0, 1, function (v) { st.pel = v; }, { k: 120, d: 9 });
          E.beep('good'); E.kick(); E.buzz(18);
          E.burst(M.zx, M.zy, np.col, 14, 2.6);
          E.pop(M.zx, M.zy - M.R - 30, np.short + ' 침전!', '#127a5a', true);
          st.msg = jo(np.n, '이', '가') + ' 가라앉았다'; st.msgOK = 1;
          E.toast(jo(np.short, '이', '가') + ' 가라앉았다.' + (cfg.decant ? ' 상층액을 옮겨라.' : ''), 'good');
        } else {
          F.bad = (F.bad || 0) + 1; E.save(); st.pel = 0;
          E.beep('bad'); E.buzz(50);
          if (g < np.g) { st.msg = '너무 느리다. 아무것도 안 가라앉았다'; E.toast('너무 느리다. ' + jo(np.short, '은', '는') + ' ' + gTxt(np.g) + '는 되어야 가라앉는다.', 'bad'); }
          else if (g > np.g) { st.msg = '너무 빠르다. 두 가지가 같이 가라앉아 안 갈라진다'; E.toast('너무 빠르다. ' + jo(np.short, '과', '와') + ' 그다음 것이 함께 가라앉아 갈라지지 않는다. 다시.', 'bad'); }
          else if (m < np.min) { st.msg = '시간이 모자라 덜 가라앉았다'; E.toast('시간이 모자라다. ' + tTxt(np.min) + ' 돌려라.', 'bad'); }
          else { st.msg = '너무 오래 돌렸다. 다음 것까지 가라앉는다'; E.toast('너무 오래 돌렸다. ' + tTxt(np.min) + '이면 된다.', 'bad'); }
          st.msgOK = 0;
        }
        sync();
      }
      function decant() {
        if (decanting() || running()) return;
        st.decAt = performance.now(); E.buzz(10); E.beep('whoosh');
        clearTimeout(st.tm2);
        st.tm2 = setTimeout(function () {
          if (cv.dead) return;
          F.dec++; E.save(); st.pel = 0;
          E.beep('snap'); E.kick();
          E.toast('상층액을 새 튜브로 옮겼다. 침전은 ' + (F.dec) + '번 튜브에.', 'good');
          if (F.dec < cfg.to) E.pop(M.rx, M.ry - (ROTOR_R + 40) * M.s, '다음은 ' + STEPS[F.spun].short, '#c2410c', false);
          st.gi = 0; st.ti = 0;
          sync();
        }, DEC_MS);
        sync();
      }
      E.drag(cv.cv, {
        start: function (ev) {
          var p = cv.pt(ev), ph = phase();
          if (ph === 'dec') {
            if (M.pip && E.dist(p.x, p.y, M.pip.x, M.pip.y - 60 * M.pip.s) < 70 * M.pip.s + 10) { decant(); return; }
            if (E.dist(p.x, p.y, M.zx, M.zy + M.R * .5) < M.R) { E.buzz(40); E.toast('침전을 건드리지 마라. 다시 섞인다.', 'bad'); }
            return;
          }
          if (ph !== 'spin' || running()) return;
          if (E.dist(p.x, p.y, M.btn.x, M.btn.y) < M.btn.r + 8) { startSpin(); return; }
          if (E.dist(p.x, p.y, M.g.x, M.g.y) < M.dR + 16) { st.drag = 'g'; setDial('g', p); return; }
          if (E.dist(p.x, p.y, M.t.x, M.t.y) < M.dR + 16) { st.drag = 't'; setDial('t', p); return; }
        },
        move: function (ev) { if (st.drag) setDial(st.drag, cv.pt(ev)); },
        end: function () { st.drag = null; }
      });
      function setDial(k, p) {
        var d = k === 'g' ? M.g : M.t, v = dialIdx(p, d);
        if (k === 'g') { if (v !== st.gi) { E.beep('tick'); E.buzz(6); } st.gi = v; }
        else { if (v !== st.ti) { E.beep('tick'); E.buzz(6); } st.ti = v; }
        sync();
      }

      panel.innerHTML = cfg.panel;
      var ck = E.el('div', { cls: 'card' });
      ck.appendChild(E.el('h3', { text: '진행' }));
      var lines = [];
      for (var i = cfg.from; i < cfg.to; i++) {
        var sp = STEPS[i];
        var d = E.el('div', { cls: 'chk' }, E.el('span', { cls: 'bx' }),
          E.el('span', { html: '<span style="color:' + sp.col + '">■</span> ' + gTxt(sp.g) + ' ' + tTxt(sp.min) + ' → ' + sp.short }));
        ck.appendChild(d); lines.push({ i: i, el: d });
      }
      var kv = E.el('div', { cls: 'kv' }, E.el('span', { text: '다이얼' })); var kvb = E.el('b'); kv.appendChild(kvb); ck.appendChild(kv);
      panel.appendChild(ck);
      if (Q) E.quiz(panel, Q, sync);

      function sync() {
        lines.forEach(function (l) {
          var done = cfg.decant ? F.dec > l.i : F.spun > l.i;
          l.el.classList.toggle('done', done);
        });
        kvb.textContent = (st.gi ? gTxt(STOPS_G[st.gi]) : '—') + ', ' + (st.ti ? tTxt(STOPS_T[st.ti]) : '—');
        var ok = cfg.decant ? F.dec >= cfg.to : F.spun >= cfg.to;
        var qok = !Q || !!(D._ans[Q.id] && D._ans[Q.id].ok);
        E.gate(ok && qok, ok ? '확인 문항을 풀어야 넘어갑니다' : cfg.gateMsg);
      }
      sync();
      this.unmount = function () { clearInterval(tick); clearTimeout(st.tm); clearTimeout(st.tm2); };
    }
  };
}

  var Q = {
    id: 'ch_decant',
    q: '상층액을 옮길 때 <b>침전을 건드리지 않고 위쪽 액만</b> 조심스럽게 빨아올리는 까닭은?',
    opts: [
      '침전이 피펫 끝을 막아 상층액이 올라오지 않고 도로 흘러내리기 때문에',
      '침전에는 쓸모없는 세포 찌꺼기만 들어 있어 그대로 버려야 하기 때문에',
      '침전을 섞으면 갈라낸 핵이 상층액에 들어가 다음 분획과 섞이기 때문에',
      '상층액이 침전보다 무거워 먼저 빨아올려야 흐트러지지 않기 때문에'
    ],
    a: 2,
    why: '이번 회전으로 갈라낸 것은 <b>침전(핵)</b>과 <b>상층액(나머지 소기관)</b>입니다. 침전을 건드려 다시 섞으면 ' +
         '핵이 상층액에 들어가고, 다음 회전에서 마이토콘드리아와 <b>함께 가라앉아</b> 분획이 섞입니다. ' +
         '그래서 위쪽 액만 조심스럽게 옮기고, 침전은 그 튜브에 남겨 이름표를 붙입니다.',
    bad: {
      0: '피펫이 막히는 것이 문제가 아닙니다. 갈라낸 것이 다시 섞이는 것이 문제입니다.',
      1: '침전에는 핵이 들어 있습니다. 세포 찌꺼기도 섞여 있지만 쓸모없는 것이 아닙니다.',
      3: '상층액이 위에 있는 것은 침전보다 <b>밀도가 작기</b> 때문입니다. 무거워서 먼저 빨아올리는 것이 아닙니다.'
    }
  };
  return {
    id: 'decant', chap: '원심분리', name: '상층액 옮기기',
    guide: '<b>피펫</b>으로 상층액만 새 튜브로 옮기고, 남은 침전 튜브에 ' +
           '<span class="hl">「핵」 이름표</span>를 붙입니다.',
    mount: function (stage, panel) {
      var F = D.frac;
      var st = { decAt: -1e9, drag: null, tNow: 0, tTag: -9, done: 0 };
      var cv = E.canvas(stage), M = {};
      function decanting() { return performance.now() - st.decAt < DEC_MS; }
      cv.on(function (c, w, h, t) {
        E.dbg = { n: 'decant', M: M, st: st, F: F };
        st.tNow = t;
        var s = Math.min(w * .16 / TW, (h - 80) / (TH + 40));
        /* 침전 튜브(왼쪽), 새 튜브(가운데) — 무대 높이 */
        M.ax = w * .24; M.ay = h - 40; M.s = s;
        M.nx = w * .52; M.ny = h - 40;
        var dec = decanting(), raw = dec ? (performance.now() - st.decAt) / DEC_MS : 0;
        var suck = dec ? ease(Math.min(1, raw * 2)) : 0, pour = dec ? ease(Math.max(0, raw * 2 - 1)) : 0;
        var moved = F.dec >= 1;
        drawTube(c, M.ax, M.ay, s, { liquid: moved ? .06 : .82 * (1 - suck * .92), col: SUP[0], pellet: 1, pcol: STEPS[0].col, cap: 0, hi: st.drag && st.drag.over });
        chip(c, M.ax, M.ay + 18, D.labels.nuc ? '침전 1 — 핵' : '침전 1', D.labels.nuc ? STEPS[0].col : '#fff8e6', 11.5);
        /* 이름표 자리 — 튜브 위 */
        M.slot = { x: M.ax, y: M.ay - TH * s - 26, w: Math.min(110, w * .2), h: 30 };
        if (!D.labels.nuc) {
          c.save(); c.setLineDash([6, 5]);
          rr(c, M.slot.x - M.slot.w / 2, M.slot.y - M.slot.h / 2, M.slot.w, M.slot.h, 9);
          c.fillStyle = st.drag && st.drag.over ? '#ffd23f' : 'rgba(255,248,230,.5)'; c.fill(); c.strokeStyle = INK; c.lineWidth = 2.5; c.stroke();
          c.restore();
          label(c, M.slot.x, M.slot.y, '?', '#181322', 13);
        } else {
          var pk = popK(t - st.tTag);
          c.save(); c.translate(M.slot.x, M.slot.y); c.scale(pk, pk); c.translate(-M.slot.x, -M.slot.y);
          chip(c, M.slot.x, M.slot.y, '핵', STEPS[0].col, 13); c.restore();
        }
        drawTube(c, M.nx, M.ny, s, { liquid: moved ? .78 : .78 * pour, col: SUP[1], cap: 0 });
        chip(c, M.nx, M.ny + 18, '새 튜브 — 상층액', moved ? '#5fd68a' : '#fff8e6', 11.5);
        /* 오른쪽 기둥 — 피펫(위), 이름표(아래) */
        var ps = Math.min(1.7, Math.max(.9, s * .9));
        var col = w * .84;
        M.pip = { x: col, y: Math.min(h * .40 + 60 * ps, h * .55), s: ps };
        var px = M.pip.x, py = M.pip.y;
        if (dec) {
          var k1 = suck, k2 = pour;
          px = M.pip.x + (M.ax + 4 - M.pip.x) * k1; py = M.pip.y + (M.ay - TH * s * .55 - M.pip.y) * k1;
          if (k2 > 0) { px = M.ax + 4 + (M.nx + 4 - M.ax - 4) * k2; py = M.ay - TH * s * .55 + (M.ny - TH * s - 10 - M.ay + TH * s * .55) * k2; }
        }
        if (!moved) {
          drawPipette(c, px, py, ps, { hi: !dec, fill: dec ? Math.sin(Math.min(1, raw) * Math.PI) : 0, col: SUP[1] });
          if (!dec) { chip(c, M.pip.x, Math.min(h - 14, M.pip.y + 22), '피펫 — 눌러서 옮기기', '#ffd23f', 10.5); E.grab(c, M.pip.x, M.pip.y - 60 * ps, 40 * ps, t); }
        }
        /* 이름표 */
        if (moved && !D.labels.nuc) {
          M.tag = st.drag ? st.drag.p : { x: col, y: Math.min(h - 40, h * .72) };
          c.save();
          c.fillStyle = 'rgba(0,0,0,.35)'; rr(c, M.tag.x - 46 + (st.drag ? 7 : 4), M.tag.y - 15 + (st.drag ? 7 : 4), 92, 30, 9); c.fill();
          rr(c, M.tag.x - 46, M.tag.y - 15, 92, 30, 9); c.fillStyle = '#fff8e6'; c.fill(); c.strokeStyle = INK; c.lineWidth = 2.5; c.stroke();
          c.beginPath(); c.arc(M.tag.x - 32, M.tag.y, 5.5, 0, Math.PI * 2); c.fillStyle = STEPS[0].col; c.fill(); c.strokeStyle = INK; c.lineWidth = 2; c.stroke();
          c.restore();
          label(c, M.tag.x + 6, M.tag.y, '핵', '#181322', 12.5);
          if (!st.drag) { chip(c, M.tag.x, M.tag.y + 30, '이름표 — 끌어서 붙이기', '#ffd23f', 10.5); E.grab(c, M.tag.x, M.tag.y, 34, t); }
        } else M.tag = null;
        E.hint(stage, !moved ? (dec ? '옮기는 중…' : '피펫을 눌러 상층액만 새 튜브로 옮기세요')
          : !D.labels.nuc ? '「핵」 이름표를 끌어 침전 튜브 위에 붙이세요' : '핵 분획을 얻었습니다. 상층액으로 다음 회전을 합니다');
      });
      E.drag(cv.cv, {
        start: function (ev) {
          var p = cv.pt(ev);
          if (F.dec < 1) {
            if (decanting()) return;
            if (E.dist(p.x, p.y, M.pip.x, M.pip.y - 60 * M.pip.s) < 70 * M.pip.s + 10) {
              st.decAt = performance.now(); E.buzz(10); E.beep('whoosh');
              clearTimeout(st.tm);
              st.tm = setTimeout(function () {
                if (cv.dead) return;
                F.dec = 1; E.save(); E.beep('snap'); E.kick();
                E.burst(M.nx, M.ny - TH * M.s * .5, SUP[1], 10, 2.2);
                E.toast('상층액을 옮겼다. 침전에 이름표를 붙여라.', 'good'); sync();
              }, DEC_MS);
              return;
            }
            if (E.dist(p.x, p.y, M.ax, M.ay - 20) < 40 * M.s) { E.buzz(40); E.toast('침전을 건드리지 마라. 다시 섞인다.', 'bad'); }
            return;
          }
          if (M.tag && E.dist(p.x, p.y, M.tag.x, M.tag.y) < 50) { st.drag = { p: p, over: 0 }; E.beep('tick'); }
        },
        move: function (ev) {
          if (!st.drag) return;
          var p = cv.pt(ev);
          var over = Math.abs(p.x - M.slot.x) < M.slot.w / 2 + 16 && Math.abs(p.y - M.slot.y) < M.slot.h / 2 + 16;
          if (over) p = { x: p.x + (M.slot.x - p.x) * .45, y: p.y + (M.slot.y - p.y) * .45 };
          if (over && !st.drag.over) { E.beep('tick'); E.buzz(6); }
          st.drag.over = over ? 1 : 0; st.drag.p = p;
        },
        end: function (ev) {
          if (!st.drag) return;
          var g = st.drag; st.drag = null;
          if (!g.over) { E.toast('침전 튜브 위 빈칸에 놓아라.', 'bad'); return; }
          D.labels.nuc = 1; E.save(); E.buzz(18); st.tTag = st.tNow;
          E.beep('snap'); E.kick(); E.burst(M.slot.x, M.slot.y, STEPS[0].col, 12, 2.4);
          E.pop(M.ax, M.ay - TH * M.s * .5, '핵 분획!', '#127a5a', true);
          E.toast('핵. 첫 분획이다.', 'good'); sync();
        }
      });

      panel.innerHTML =
        '<div class="card"><h3>과정 5</h3>' +
        '<p>회전이 끝나면 <b>상층액만</b> 피펫으로 새 튜브에 옮기고, 남은 침전에 이름표를 붙인다. ' +
        '상층액을 다시 원심분리기에 넣고 <b>속도를 올려</b> 돌린다.</p></div>' +
        '<div class="card"><h3>상층액에 남은 것</h3>' +
        '<p class="muted">핵이 빠진 상층액에는 아직 마이토콘드리아, 막 조각, 라이보솜이 섞여 있습니다. ' +
        '이제부터는 이 상층액이 다음 회전의 재료입니다.</p></div>';
      var ck = E.el('div', { cls: 'card' });
      ck.appendChild(E.el('h3', { text: '진행' }));
      var l1 = E.el('div', { cls: 'chk' }, E.el('span', { cls: 'bx' }), E.el('span', { text: '상층액 옮기기' }));
      var l2 = E.el('div', { cls: 'chk' }, E.el('span', { cls: 'bx' }), E.el('span', { text: '침전에 「핵」 이름표' }));
      ck.appendChild(l1); ck.appendChild(l2); panel.appendChild(ck);
      E.quiz(panel, Q, sync);
      function sync() {
        l1.classList.toggle('done', F.dec >= 1);
        l2.classList.toggle('done', !!D.labels.nuc);
        var all = F.dec >= 1 && D.labels.nuc;
        var qok = !!(D._ans[Q.id] && D._ans[Q.id].ok);
        E.gate(all && qok, all ? '확인 문항을 풀어야 넘어갑니다' : F.dec < 1 ? '상층액을 새 튜브로 옮기세요' : '「핵」 이름표를 붙이세요');
      }
      sync();
      this.unmount = function () { clearTimeout(st.tm); };
    }
  };
}

           '<span class="hl">이름표를 끌어</span> 붙이세요.',
    mount: function (stage, panel) {
      var st = { sel: 0, drag: null, tNow: 0, tPick: -9, pt: {}, done: 0 };
      var cv = E.canvas(stage), M = { tubes: [], tray: [] };
      cv.on(function (c, w, h, t) {
        E.dbg = { n: 'label', M: M, st: st };
        st.tNow = t;
        /* 확대 창(왼쪽) + 튜브 넷(가운데) + 이름표(오른쪽) */
        var R = Math.min(90, w * .13, h * .22), zx = w * .15, zy = Math.min(h * .40, 34 + R);

        label(c, zx, zy + R + 42, sel.size, 'rgba(220,232,245,.85)', 10.5);
        /* 튜브 넷 — 무대 높이의 대부분. 아래에 이름표 자리 */
        var s = Math.min(w * .09 / TW, (h - (w < 600 ? 138 : 110)) / (TH + 20));

        var dx9 = w < 600 ? .10 : .13;
        M.gap = w * dx9;                               /* 튜브 사이 간격 — 칸 판정이 이보다 넓으면 안 된다 */

        STEPS.forEach(function (sp, i) {

          var on = st.sel === i;

     엔진이 넘겨 주는 t 는 장면이 열린 뒤 흐른 시간이고 단위는 **초**다.
     sp 는 초당 몇 번 올라오는가이므로 0.45~1.15 쯤이면 눈에 자연스럽다.
     기포는 흰 알에 검은 테 — 만화 거품. */
  var n = Math.round((o.rate || 0) * 22);
  for (var i = 0; i < n; i++) {
    var seed = i * 12.9898;
    var fx = x + (((Math.sin(seed) * 43758.5) % 1 + 1) % 1 - 0.5) * (w - 10);
    var sp = 0.45 + (((Math.sin(seed * 1.7) * 43758.5) % 1 + 1) % 1) * 0.70;
    var up = ((t * sp * (0.4 + (o.rate || 0))) + i / n) % 1;
    var by = (y + h - r) - up * (h - r - (lvTop - y));
    var br = Math.max(1.6, Math.min(r * 0.32, 2.2 + (((Math.sin(seed * 2.3) * 43758.5) % 1 + 1) % 1) * 2.8));
    c.beginPath(); c.arc(fx, by, br, 0, Math.PI * 2);
    c.fillStyle = 'rgba(255,255,255,.95)'; c.fill();
    c.strokeStyle = INK; c.lineWidth = 1.4; c.stroke();
  }
  c.restore();
  /* 거품층 — 수면 위로 올라온 흰 거품 */
  if ((o.rate || 0) > 0.06) {
    var fh = Math.min(h * 0.26, (o.rate) * h * 0.30);
    c.save();
    c.beginPath();
    c.moveTo(x - ri, y); c.lineTo(x - ri, y + h - r); c.lineTo(x + ri, y + h - r); c.lineTo(x + ri, y); c.closePath();
    c.clip();
    for (var b = 0; b < 18; b++) {
      var bx = x - ri + 4 + (b * 7.3) % (w - 8);
      var byy = lvTop - fh * (((b * 37) % 100) / 100) + 3 + Math.sin(t * 3 + b) * 1.2;
      var bR = 2.6 + (b % 3) * 0.9;
      c.beginPath(); c.arc(bx, byy, bR, 0, Math.PI * 2);
      c.fillStyle = '#ffffff'; c.fill();
      c.strokeStyle = INK; c.lineWidth = 1.6; c.stroke();
    }
    c.restore();
  }
  /* 유리 외곽선 — 굵게. 고른 것은 노란 띠를 한 겹 더 */
  c.beginPath();
  c.moveTo(x - r, y);
  c.lineTo(x - r, y + h - r);
  c.arc(x, y + h - r, r, Math.PI, 0, true);
  c.lineTo(x + r, y);
  c.closePath();
  if (o.hi) { c.strokeStyle = '#ffd23f'; c.lineWidth = 7; c.stroke(); }
  c.strokeStyle = INK; c.lineWidth = 2.8; c.lineJoin = 'round'; c.stroke();
  /* 입구 띠 */
  rr(c, x - r - 3, y - 3, w + 6, 8, 3);
  c.fillStyle = '#cbd5e1'; c.fill(); c.strokeStyle = INK; c.lineWidth = 2.2; c.stroke();
  /* 반사 — 유리라는 걸 알리는 흰 줄 하나 */
  c.beginPath(); c.moveTo(x - r + 5, y + 14); c.lineTo(x - r + 5, y + h - r - 4);
  c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 2; c.lineCap = 'round'; c.stroke();
  c.restore();

  /* 이름표는 칩으로. 자리(o.lw)보다 길면 글자를 줄여 넣는다.
     좁은 화면에서 옆 시험관 이름과 겹쳐 읽을 수 없게 되던 것을 여기서 막는다. */
  if (o.label) chip(c, x, y + h + 18, o.label, o.hi ? '#ffd23f' : '#fff8e6', 12.5, o.lw);
  if (o.tag) chip(c, x, y + h + 42, o.tag, '#ffffff', 11, o.lw);
}

/* 눈금 있는 그래프 틀. 돌려주는 함수로 좌표를 옮긴다 */
function axes(c, w, h, o) {
  var pad = 52;
  var gx = pad + 8, gy = h - pad, gw = w - pad * 2 - 6, gh = h - pad * 2;
  c.save();
  /* 축은 굵은 검은 선. 그래프 바탕은 흰 종이 한 장 */
  rr(c, gx - 6, gy - gh - 10, gw + 12, gh + 16, 6);
  c.fillStyle = 'rgba(255,255,255,.75)'; c.fill();
  c.strokeStyle = INK; c.lineWidth = 2.6; c.lineCap = 'round'; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(gx, gy - gh); c.lineTo(gx, gy); c.lineTo(gx + gw, gy); c.stroke();
  label(c, gx + gw / 2, gy + 28, o.xl, INK, 12);
  c.save(); c.translate(gx - 32, gy - gh / 2); c.rotate(-Math.PI / 2);
  label(c, 0, 0, o.yl, INK, 12); c.restore();
  c.restore();
  return {
    gx: gx, gy: gy, gw: gw, gh: gh,
    X: function (v) { return gx + (v - o.x0) / (o.x1 - o.x0) * gw; },
    Y: function (v) { return gy - (v - (o.y0 || 0)) / ((o.y1 || 1) - (o.y0 || 0)) * gh; }
  };
}

function curve(c, A, f, x0, x1, col, wdt, dash) {
  c.save();
  if (dash) c.setLineDash(dash);
  c.beginPath();
  var step = (x1 - x0) / 160;
  for (var v = x0; v <= x1 + 1e-9; v += step) {
    var px = A.X(v), py = A.Y(f(v));
    v === x0 ? c.moveTo(px, py) : c.lineTo(px, py);
  }
  c.strokeStyle = col; c.lineWidth = wdt || 2.4; c.stroke();
  c.restore();
}

function dot(c, x, y, col, r, k) {
  c.beginPath(); c.arc(x, y, Math.max(1, (r || 6) * (k || 1)), 0, Math.PI * 2);
  c.fillStyle = col; c.fill();
  c.strokeStyle = INK; c.lineWidth = 2.2; c.stroke();
}

/* ---- 효소 덩어리와 조각 — 7장면과 12장면이 같이 쓴다 ----
   wp 는 활성부위가 일그러진 정도(0 은 멀쩡, 1 은 비경쟁적 억제제가 붙어 변형된 상태).
   12장면에서 홈이 눈앞에서 비틀리는 것이 비경쟁적 억제의 전부다. */
function enzymePath(c, cx, cy, s, wp) {
  var p = wp || 0;
  c.beginPath();
  c.moveTo(cx - 96 * s, cy + 40 * s);
  c.bezierCurveTo(cx - 120 * s, cy - 10 * s, cx - 80 * s, cy - 52 * s, cx - 40 * s, cy - 46 * s);
  /* 홈 (사다리꼴). p 가 커지면 한쪽으로 쏠리고 좁아진다 */
  c.lineTo(cx + (-26 + 11 * p) * s, cy - 46 * s);
  c.lineTo(cx + (-16 + 15 * p) * s, cy + (-16 + 7 * p) * s);
  c.lineTo(cx + (16 + 3 * p) * s, cy + (-16 - 5 * p) * s);
  c.lineTo(cx + (26 - 7 * p) * s, cy - 46 * s);
  c.lineTo(cx + 40 * s, cy - 46 * s);
  c.bezierCurveTo(cx + 80 * s, cy - 52 * s, cx + 120 * s, cy - 10 * s, cx + 96 * s, cy + 40 * s);
  c.closePath();
}
function subPath(c, x, y, s, shape) {
  c.beginPath();
  if (shape === 0) {           /* 홈과 같은 사다리꼴 */
    c.moveTo(x - 26 * s, y - 15 * s); c.lineTo(x - 16 * s, y + 15 * s);
    c.lineTo(x + 16 * s, y + 15 * s); c.lineTo(x + 26 * s, y - 15 * s);
  } else if (shape === 1) {    /* 둥근 것 */
    c.ellipse(x, y, 24 * s, 16 * s, 0, 0, Math.PI * 2);
  } else {                     /* 뾰족한 것 */
    c.moveTo(x - 24 * s, y + 15 * s); c.lineTo(x, y - 18 * s);
    c.lineTo(x + 24 * s, y + 15 * s);
  }
  c.closePath();
}
/* 활성부위 홈만 따로 — 비었을 때 어둡게 칠하고, 일그러졌을 때 모양을 보여 준다 */
function groovePath(c, cx, cy, s, wp) {
  var p = wp || 0;
  c.beginPath();
  c.moveTo(cx + (-26 + 11 * p) * s, cy - 46 * s);
  c.lineTo(cx + (-16 + 15 * p) * s, cy + (-16 + 7 * p) * s);
  c.lineTo(cx + (16 + 3 * p) * s, cy + (-16 - 5 * p) * s);
  c.lineTo(cx + (26 - 7 * p) * s, cy - 46 * s);
  c.closePath();
}
/* 색 있는 조각 하나 — 굵은 검은 선에 납작한 색 */
function drawPiece(c, x, y, s, shape, col, k) {
  c.save();
  c.translate(x, y); c.scale(k || 1, k || 1); c.translate(-x, -y);
  subPath(c, x, y, s, shape);
  c.fillStyle = col; c.fill();
  c.strokeStyle = INK; c.lineWidth = 2.6; c.lineJoin = 'round'; c.stroke();
  c.restore();
}

/* ---- 그래프 위에서 손으로 값 잡기 (온도, pH, 농도 공용) ----
   그래프 위를 좌우로 끌면 값이 한 칸씩 딸깍 넘어가고, 찍을 자리 가까이서는 자석처럼
   당겨 붙는다. 톡 누르면(안 끌고 놓으면) 그 자리에 점을 찍는다.
   논리값은 set() 으로 즉시 바꾸고, 그림은 st.vis 가 스프링으로 따라온다.
   o = { M(그래프 자리 — 그리기에서 매 프레임 채운다), get, set, min, max, step, targets,
         measure(v), area(p) 안에 있나 } */
function graphHand(cv, st, o) {
  function v2x(v, g) { return g.ox + g.gx + (v - g.x0) / (g.x1 - g.x0) * g.gw; }
  function x2v(px, g) { return g.x0 + (px - g.ox - g.gx) / g.gw * (g.x1 - g.x0); }
  function nearTarget(v, tol) {
    var best = null;
    o.targets.forEach(function (tv) { if (Math.abs(tv - v) <= tol && (best == null || Math.abs(tv - v) < Math.abs(best - v))) best = tv; });
    return best;
  }
  E.drag(cv.cv, {
    start: function (ev) {
      var p = cv.pt(ev), g = o.M();
      if (!g || !o.area(p, g)) { st.gd = null; return; }
      if (st.sp) { st.sp.stop(); st.sp = null; }
      st.vis = o.get();
      st.gd = { x0: p.x, v0: o.get(), moved: 0, g: g };
    },
    move: function (ev) {
      if (!st.gd) return;
      var p = cv.pt(ev), g = st.gd.g;
      st.gd.moved += Math.abs(p.x - st.gd.x0);
      var v = x2v(p.x, g);
      var tg = nearTarget(v, (o.max - o.min) * 0.03);
      if (tg != null) v = tg + (v - tg) * 0.3;                              /* 자석 */
      v = E.clamp(v, o.min, o.max);
      var q = Math.round(v / o.step) * o.step;
      E.detent(st, 'tk', q, o.step);                                       /* 톱니 */
      if (q !== o.get()) o.set(q);
      st.vis = v;
    },
    end: function (ev) {
      if (!st.gd) return;
      var p = cv.pt(ev), g = st.gd.g, moved = st.gd.moved; st.gd = null;
      var v = E.clamp(x2v(p.x, g), o.min, o.max);
      if (moved < 6) {
        /* 톡 — 그 자리로 옮기고, 찍을 자리면 점을 찍는다 */
        var tg = nearTarget(v, (o.max - o.min) * 0.05);
        var q = tg != null ? tg : Math.round(v / o.step) * o.step;
        var from = st.vis;
        o.set(q);
        st.sp = E.spring(from, q, function (x) { st.vis = x; }, { k: 260, d: 12, eps: .002 });
        if (tg != null) o.measure(tg, v2x(tg, g));
        else E.toast(o.miss, '');
        return;
      }
      /* 끌다 놓음 — 가까운 찍을 자리에 찰칵 붙는다 */
      var tg2 = nearTarget(o.get(), (o.max - o.min) * 0.04);
      if (tg2 != null) {
        var from2 = st.vis; o.set(tg2);
        st.sp = E.spring(from2, tg2, function (x) { st.vis = x; }, { k: 300, d: 11, v: (tg2 - from2) * 4, eps: .002 });
        E.beep('snap'); E.kick(); E.buzz(10);
      } else {
        st.vis = o.get();
      }
    }
  });
  return { v2x: v2x };
}

/* 슬라이더 한 줄을 패널에 만든다 */
function slider(panel, o) {
  var wrap = E.el('div', { cls: 'card' });
  wrap.innerHTML = '<h3>' + o.title + '</h3>' +
    '<div class="kv"><span>' + o.unitLabel + '</span><b id="' + o.id + 'v"></b></div>';
  var inp = E.el('input');
  inp.type = 'range'; inp.min = o.min; inp.max = o.max; inp.step = o.step || 1;
  inp.value = o.value; inp.className = 'field';
  inp.style.width = '100%';
  wrap.appendChild(inp);
  if (o.help) {
    var p = E.el('p', { cls: 'muted', html: o.help });
    wrap.appendChild(p);
  }
  panel.appendChild(wrap);
  var out = wrap.querySelector('#' + o.id + 'v');
  function show() { out.innerHTML = o.fmt(Number(inp.value)); }
  inp.addEventListener('input', function () { show(); o.onInput(Number(inp.value)); });
  show();
  /* 무대에서 값을 바꿨을 때 슬라이더가 따라오게 */
  inp.sync = function (v) { inp.value = v; show(); };
  return inp;
}

/* ================================================================
   장면 3. 시험관 준비 — 네 개에 서로 다른 것을 넣는다
   ================================================================ */
var TUBE_DEF = [
  { k: 'A', label: '증류수', tag: '대조군', chunk: null, fill: '#b9e3ff', pill: '#b9e3ff' },
  { k: 'B', label: '생감자', tag: '효소 있음', chunk: '#f2e2a8', fill: '#a9dcff', pill: '#f2e2a8' },
  { k: 'C', label: '삶은 감자', tag: '효소 변성', chunk: '#d3bf8f', fill: '#a9dcff', pill: '#d3bf8f' },
  { k: 'D', label: '이산화망가니즈', tag: '무기 촉매', chunk: '#3f4250', fill: '#a9dcff', pill: '#8b8fa0' }
];
/* 각 시험관의 상대 반응 속도 (실온 기준) */
var TUBE_RATE = { A: 0.02, B: 0.85, C: 0.02, D: 0.80 };

/* 시험관 네 개의 자리 — 준비와 관찰 장면이 같은 자리를 쓴다 */
function tubeSlots(w, h, top) {
  var n = TUBE_DEF.length;
  var gapW = Math.min(w / (n + 1), 130);
  var tw = Math.min(58, gapW * 0.52);
  /* 아래 이름표 둘(58)과 위 접시 줄(58)이 들어갈 자리를 빼고 남는 만큼만 — 무대가 아주 낮아도 겹치지 않게 */
  var th = Math.max(30, Math.min(h * 0.46, 200, h - (top ? 116 : 70)));
  var y = top ? Math.max(top, h * 0.5 - th * 0.55) : h / 2 - th * 0.6;
  /* 아래 이름표 두 줄(칩 둘)이 캔버스 안에 들어오게 */
  y = Math.min(y, h - th - 58);
  var out = [];
  for (var i = 0; i < n; i++) out.push({ x: (w - gapW * (n - 1)) / 2 + gapW * i, y: y, w: tw, h: th, lw: gapW - 6 });
  return out;
}

function scPrep() {
  return {
    id: 'prep', chap: '탐구 1 무엇이 빠르게 하나', name: '시험관 준비',
    guide: '시험관 네 개에 <b>3 % 과산화수소수 5 mL</b> 씩을 넣었습니다. ' +
           '이제 위 접시의 재료를 <span class="hl">끌어다 시험관에 넣으세요.</span> 하나씩.',
    mount: function (stage, panel) {
      /* st.hold 끌고 있는 재료, st.pop 막 넣은 시각(장면 시계), st.home 접시 자리 */
      var st = { hold: null, pop: {}, home: {}, tNow: 0 };
      var M = {};
      var cv = E.canvas(stage);
      cv.on(function (c, w, h, t) {
        E.dbg = { n: 'prep', M: M, st: D.tubes };
        st.tNow = t;
        var n = TUBE_DEF.length;
        /* 접시 줄 — 재료가 알약(칩)으로 놓여 있다. 위쪽 한 줄 */
        var trayY = 24;
        var slots = tubeSlots(w, h, trayY + 34);
        M.slots = slots;
        /* 시험관 */
        var next = null;
        for (var i = 0; i < n; i++) {
          var d = TUBE_DEF[i], put = D.tubes[d.k], s = slots[i];
          if (!put && next == null) next = i;
          drawTube(c, {
            x: s.x, y: s.y, w: s.w, h: s.h,
            fill: d.fill, chunk: put ? d.chunk : null, popAt: st.pop[d.k],
            rate: 0, t: t,
            label: d.k + ' ' + d.label,
            tag: put ? d.tag : '비어 있음',
            hi: !!(st.hold && st.hold.k === d.k), lw: s.lw
          });
        }
        /* 접시 — 알약 네 개를 가운데 정렬. 폭이 좁으면 글자를 줄인다 */
        var size = w < 480 ? 11 : 12.5;
        c.font = '900 ' + size + 'px "Malgun Gothic","맑은 고딕",sans-serif';
        var widths = TUBE_DEF.map(function (d) { return c.measureText(d.label).width + 34; });
        var total = widths.reduce(function (a, b) { return a + b; }, 0) + 8 * (n - 1);
        var x = (w - total) / 2;
        M.tray = [];
        for (var j = 0; j < n; j++) {
          var dj = TUBE_DEF[j], cx = x + widths[j] / 2;
          M.tray.push({ k: dj.k, x: cx, y: trayY, w: widths[j] });
          st.home[dj.k] = { x: cx, y: trayY };
          x += widths[j] + 8;
          if (D.tubes[dj.k]) {
            /* 빈 접시 자국 */
            c.save(); c.setLineDash([5, 4]); c.strokeStyle = INK; c.lineWidth = 1.6;
            rr(c, cx - widths[j] / 2, trayY - 12, widths[j], 24, 12); c.stroke(); c.restore();
            continue;
          }
          if (st.hold && st.hold.k === dj.k) continue;     /* 손에 들려 있다 */
          /* 고리를 먼저, 알약을 그 위에 — 좁은 화면에서 손 그림이 옆 알약 글자를 가리지 않게 */
          if (next === j && !st.hold) E.grab(c, cx, trayY, 12, t);
          pill(c, cx, trayY, dj, size);
        }
        /* 놓을 자리 — 다음 재료의 시험관 (하나에만) */
        if (!st.hold && next != null) {
          var ns = slots[next];
          E.target(c, ns.x, ns.y + ns.h * 0.5, ns.w + 18, ns.h * 0.8, t);
        }
        /* 손에 든 것 — 시험관 가까이면 자석처럼 당긴다 */
        if (st.hold) {
          var hd = TUBE_DEF.filter(function (d) { return d.k === st.hold.k; })[0];
          var hs = slots[TUBE_DEF.indexOf(hd)];
          var hx = st.hold.x, hy = st.hold.y;
          var dx = hs.x - hx, dy = (hs.y + hs.h * 0.3) - hy, dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 70) { hx += dx * 0.45; hy += dy * 0.45; }
          st.hold.vx = hx; st.hold.vy = hy;
          pill(c, hx, hy, hd, size, 1.12);
        }
        var left = TUBE_DEF.filter(function (d) { return !D.tubes[d.k]; }).length;
        E.hint(stage, left ? (TUBE_DEF[next].label + '를 끌어다 ' + TUBE_DEF[next].k + ' 시험관에 넣으세요')
                           : '넷 다 넣었습니다. 다음 장면에서 관찰합니다');
      });
      function pill(c, x, y, d, size, k) {
        c.save();
        c.translate(x, y); c.scale(k || 1, k || 1); c.translate(-x, -y);
        var r = chip(c, x + 6, y, d.label, d.pill, size);
        /* 왼쪽에 색 알 하나 — 무엇인지 한눈에 */
        c.beginPath(); c.arc(x + 6 - r.w / 2 - 8, y, 6, 0, 7);
        c.fillStyle = d.chunk || '#ffffff'; c.fill(); c.lineWidth = 2; c.strokeStyle = INK; c.stroke();
        c.restore();
      }

      /* 손맛 — 접시의 알약을 집어 시험관에 넣는다. 맞는 시험관 가까이면 당겨 붙고,
         놓으면 찰칵 + 무대가 툭 + 거품 파편. 다른 시험관이면 사수가 잡는다. */
      E.drag(cv.cv, {
        start: function (ev) {
          var p = cv.pt(ev);
          if (!M.tray) return;
          for (var i = 0; i < M.tray.length; i++) {
            var tr = M.tray[i];
            if (D.tubes[tr.k]) continue;
            if (Math.abs(p.x - tr.x) < tr.w / 2 + 8 && Math.abs(p.y - tr.y) < 20) {
              st.hold = { k: tr.k, x: p.x, y: p.y }; E.beep('pick'); return;
            }
          }
        },
        move: function (ev) {
          if (!st.hold) return;
          var p = cv.pt(ev); st.hold.x = p.x; st.hold.y = p.y;
        },
        end: function (ev) {
          if (!st.hold) return;
          var p = cv.pt(ev), k = st.hold.k; st.hold = null;
          /* 어느 시험관 위에 놓았나 */
          var over = null;
          (M.slots || []).forEach(function (s, i) {
            if (Math.abs(p.x - s.x) < s.lw / 2 && p.y > s.y - 16 && p.y < s.y + s.h + 12) over = i;
          });
          if (over == null) return;                                   /* 허공 — 접시로 돌아간다 */
          var d = TUBE_DEF[over];
          if (d.k !== k) {
            var mine = TUBE_DEF.filter(function (x) { return x.k === k; })[0];
            E.toast('거긴 ' + d.k + ' 다. ' + mine.label + '는 ' + k + ' 시험관에 넣어라.', 'bad');
            return;
          }
          if (D.tubes[k]) return;
          put(k);
          var s = M.slots[over];
          E.burst(s.x, s.y + s.h * 0.45, null, 12, 2.4);
        }
      });

      function put(k) {
        D.tubes[k] = 1; E.save();
        st.pop[k] = st.tNow;
        E.beep('snap'); E.kick(); E.buzz(14);
        var left = TUBE_DEF.filter(function (d) { return !D.tubes[d.k]; }).length;
        var d = TUBE_DEF.filter(function (x) { return x.k === k; })[0];
        E.toast(left ? ('넣었다. ' + k + ' 에 ' + d.label + '.') : '넷 다 넣었다. 이제 관찰이다.', 'good');
        paintBtns(); sync();
      }

      var box = E.el('div', { cls: 'card' });
      box.innerHTML = '<h3>넣을 것</h3>' +
        '<p class="muted">네 시험관 모두 과산화수소수의 양과 농도는 같습니다. ' +
        '<b>넣는 것 하나만 다르게</b> 하는 것이 이 실험의 조건입니다. ' +
        '무대에서 끌어 넣거나, 아래 단추로 넣어도 됩니다.</p>';
      var row = E.el('div', { cls: 'btnrow' });
      var btns = {};
      TUBE_DEF.forEach(function (d) {
        var b = E.el('button', { cls: 'btn', type: 'button', text: d.k + ' ' + d.label });
        b.addEventListener('click', function () { if (!D.tubes[d.k]) put(d.k); });
        btns[d.k] = b;
        row.appendChild(b);
      });
      function paintBtns() {
        TUBE_DEF.forEach(function (d) {
          if (D.tubes[d.k]) { btns[d.k].disabled = true; btns[d.k].classList.add('done'); }
        });
      }
      paintBtns();
      box.appendChild(row);
      panel.appendChild(box);

      var why = E.el('div', { cls: 'card' });
      why.innerHTML = '<h3>왜 이 네 가지인가</h3>' +
        '<div class="kv"><span>A 증류수</span><b>아무것도 넣지 않은 것과 같다 — 비교의 기준</b></div>' +
        '<div class="kv"><span>B 생감자</span><b>카탈레이스가 살아 있다</b></div>' +
        '<div class="kv"><span>C 삶은 감자</span><b>같은 감자인데 끓여서 효소가 변성되었다</b></div>' +
        '<div class="kv"><span>D 이산화망가니즈</span><b>단백질이 아닌 무기 촉매</b></div>' +
        '<p class="muted" style="margin-top:8px">B 와 C 를 비교하면 <b>감자라서</b> 빨라진 것이 아니라 ' +
        '<b>감자 안의 효소 때문</b>이라는 것을 가려낼 수 있습니다. ' +
        'B 와 D 를 비교하면 효소와 무기 촉매의 차이를 볼 수 있습니다.</p>';
      panel.appendChild(why);

      function sync() {
        var all = TUBE_DEF.every(function (d) { return D.tubes[d.k]; });
        E.gate(all, '네 시험관에 넣을 것을 모두 넣으세요');
      }
      sync();
    }
  };
}

    mount: function (stage, panel) {
      D.observed = 1; E.save();
      /* st.seen 눌러 본 시험관, st.at 누른 시각 — 판정과는 무관한 손맛. 넘어가는 조건은 문항 둘 */
      var st = { seen: {}, at: {}, tNow: 0 };
      var M = {};
      var cv = E.canvas(stage);
      cv.on(function (c, w, h, t) {
        E.dbg = { n: 'observe', M: M, st: st.seen };
        st.tNow = t;
        var n = TUBE_DEF.length;
        var slots = tubeSlots(w, h);
        M.slots = slots;
        var seenN = 0, next = null;
        for (var i = 0; i < n; i++) {
          var d = TUBE_DEF[i], s = slots[i], seen = !!st.seen[d.k];
          if (seen) seenN++; else if (next == null) next = i;
          drawTube(c, {
            x: s.x, y: s.y, w: s.w, h: s.h,
            fill: d.fill, chunk: d.chunk, rate: TUBE_RATE[d.k], t: t,
            label: d.k + ' ' + d.label, tag: d.tag,
            hi: seen && TUBE_RATE[d.k] > 0.3, lw: s.lw
          });
          /* 본 것에는 위에 판정 딱지 — 막 붙은 것은 0.3초 커졌다 제자리 */
          if (seen) {
            var k = popK(t - (st.at[d.k] || 0));
            var busy = TUBE_RATE[d.k] > 0.3;
            c.save();
            c.translate(s.x, s.y - 22); c.scale(k, k); c.translate(-s.x, -(s.y - 22));
            chip(c, s.x, s.y - 22, busy ? '매우 활발' : '거의 없음', busy ? '#5fd68a' : '#ffffff', 11.5, s.lw);
            c.restore();
          }
        }
        if (next != null) E.grab(c, slots[next].x, slots[next].y + slots[next].h * 0.45, slots[next].w * 0.7, t);
        /* 전에는 이 문장을 캔버스 아래(h-26)에 그렸다. 캔버스가 낮아지자 **시험관 이름표와 겹쳐
           글자가 뭉갰다.** 안내 띠에 쓴다 — 다른 장면과도 같은 자리다. */
        E.hint(stage, seenN < n ? ('시험관을 하나씩 눌러 기포를 비교하세요 (' + seenN + '/4)')
                                : '같은 시간 동안 B 와 D 에서만 기포가 활발하게 올라옵니다');
      });

      /* 손맛 — 시험관을 톡 누르면 판정 딱지가 튀어나온다. 넷 다 보면 큰 글자 */
      E.drag(cv.cv, {
        start: function (ev) {
          var p = cv.pt(ev);
          (M.slots || []).forEach(function (s, i) {
            if (Math.abs(p.x - s.x) < s.lw / 2 && p.y > s.y - 30 && p.y < s.y + s.h + 12) st.tap = i;
          });
        },
        end: function () {
          if (st.tap == null) return;
          var i = st.tap; st.tap = null;
          var d = TUBE_DEF[i], s = M.slots[i];
          if (st.seen[d.k]) return;
          st.seen[d.k] = 1; st.at[d.k] = st.tNow;
          E.beep('pick'); E.buzz(10);
          E.ripple(s.x, s.y + s.h * 0.4, TUBE_RATE[d.k] > 0.3 ? 'rgba(18,160,106,.9)' : 'rgba(24,19,34,.6)');
          var all = TUBE_DEF.every(function (x) { return st.seen[x.k]; });
          if (all) {
            E.beep('good');
            E.pop(s.x, s.y - 40, 'B 와 D 만!', '#127a5a', true);
            E.toast('B 와 D 만 활발하다. 하나는 감자, 하나는 검은 가루다. 문항 둘을 풀어라.', 'good');
          }
        }
      });

      panel.innerHTML =
        '<div class="card"><h3>관찰 결과</h3>' +
        '<table class="dat"><tr><th>시험관</th><th>넣은 것</th><th>기포</th></tr>' +
        '<tr><td>A</td><td>증류수</td><td>거의 없음</td></tr>' +
        '<tr><td>B</td><td>생감자</td><td><b>매우 활발</b></td></tr>' +
        '<tr><td>C</td><td>삶은 감자</td><td>거의 없음</td></tr>' +
        '<tr><td>D</td><td>이산화망가니즈</td><td><b>매우 활발</b></td></tr></table>' +
        '<p class="muted" style="margin-top:8px">A 에서도 아주 느리게는 분해가 일어납니다. ' +
        '눈에 띄지 않을 뿐입니다.</p></div>';

      var h1 = E.el('div'); panel.appendChild(h1); E.quiz(h1, Q, sync);
      var h2 = E.el('div'); panel.appendChild(h2); E.quiz(h2, Q2, sync);

      function sync() {
        var a = !!(D._ans[Q.id] && D._ans[Q.id].ok);
        var b = !!(D._ans[Q2.id] && D._ans[Q2.id].ok);
        if (a && b) {
          E.note('탐구 1 촉매 비교',
                 'A 증류수 거의 없음 / B 생감자 매우 활발 / C 삶은 감자 거의 없음 / D 이산화망가니즈 매우 활발\n' +
                 'B 와 C 의 차이 → 반응을 빠르게 한 것은 감자가 아니라 감자 안의 효소(카탈레이스)\n' +
                 'D → 효소가 아닌 무기 촉매도 같은 반응의 촉매가 될 수 있다');
        }
        E.gate(a && b, '확인 문항 두 개를 모두 풀어야 넘어갑니다');
      }
      sync();
    }
  };
}

/* ================================================================
   장면 5. 다시 넣어 보기 — 효소는 소모되지 않는다
   ================================================================ */
function scReuse() {
  var Q = {
    id: 'q_reuse',
    q: '과산화수소수를 <b>세 번</b> 더 넣었는데도 그때마다 기포가 다시 활발하게 났다. 이것이 뜻하는 것은?',
    opts: [
      '감자 조각이 조금씩 녹아 새로운 효소가 계속 나오고 있다',
      '효소는 반응에 쓰이고 나서도 소모되거나 변형되지 않아 다시 쓰인다',
      '과산화수소가 감자를 분해하고 있어서 기포가 나는 것이다',
      '반응이 거듭될수록 활성화에너지가 점점 더 낮아지고 있다'
    ],
    a: 1,
    why: '효소는 기질과 결합해 <b>효소기질복합체</b>를 만들고, 기질이 생성물로 바뀌면 ' +
         '<b>생성물과 분리되어 원래 모습 그대로 남습니다.</b> 그래서 같은 효소가 반응을 몇 번이고 다시 촉매합니다. ' +
         '적은 양의 효소로 많은 양의 기질을 처리할 수 있는 까닭이 여기에 있습니다.',
    bad: {
      0: '감자 조각은 그대로 남아 있습니다. 조각이 줄어들지 않는데도 반응이 계속되는 것이 요점입니다.',
      2: '분해되는 것은 감자가 아니라 <b>과산화수소</b>입니다. 나오는 기포는 과산화수소에서 나온 산소입니다.',
      3: '활성화에너지는 효소가 있을 때 낮아진 그 값으로 유지됩니다. 반응을 되풀이한다고 더 낮아지지는 않습니다.'
    }
  };
  return {
    id: 'reuse', chap: '탐구 1 무엇이 빠르게 하나', name: '다시 넣어 보기',
    guide: '기포가 잦아든 시험관 B 에 <span class="hl">과산화수소수를 다시 넣어</span> 보세요. ' +
           '감자 조각은 그대로 둔 채입니다.',
    mount: function (stage, panel) {
      /* 엔진이 주는 t 는 장면이 열린 뒤 흐른 **초**다.
         단추를 누른 시각도 같은 시계로 재야 하므로 pending 을 걸어 두고
         다음 그리기에서 그때의 t 를 받아 적는다. */
      var st = { pending: false, boostAt: null, pourAt: null };
      var M = {};
      var cv = E.canvas(stage);
      cv.on(function (c, w, h, t) {
        E.dbg = { n: 'reuse', M: M, st: D.reuse };
        if (st.pending) { st.boostAt = t; st.pourAt = t; st.pending = false; }
        var th = Math.min(h * 0.5, 220), tw = Math.min(64, w * 0.13);
        var ty = Math.min(h / 2 - th * 0.6, h - th - 58);
        var decay = st.boostAt == null ? 0 : Math.max(0, 1 - (t - st.boostAt) / 6);
        var rate = st.boostAt == null ? 0.04 : Math.max(0.04, 0.9 * decay);
        M.tube = { x: w / 2, y: ty, w: tw, h: th };
        drawTube(c, { x: w / 2, y: ty, w: tw, h: th,
                      fill: '#a9dcff', chunk: '#f2e2a8',
                      rate: rate, t: t, label: 'B 생감자', tag: '넣은 횟수 ' + D.reuse + '회', hi: true });
        /* 붓는 병 — 시험관 왼쪽 위에서 기울어져 있다. 막 부었으면 0.8초 동안 물줄기 */
        var bx = w / 2 - tw * 1.6, by = ty + 34;
        var pouring = st.pourAt != null && t - st.pourAt < 0.8;
        c.save();
        c.translate(bx, by); c.rotate(pouring ? 0.9 : 0.35);
        rr(c, -14, -44, 28, 48, 6); c.fillStyle = '#eef6fb'; c.fill(); c.lineWidth = 2.6; c.strokeStyle = INK; c.stroke();
        rr(c, -9, -60, 18, 18, 3); c.fillStyle = '#cbd5e1'; c.fill(); c.stroke();
        rr(c, -10, -22, 20, 22, 3); c.fillStyle = '#a9dcff'; c.fill();
        c.restore();
        if (pouring) {
          c.save(); c.strokeStyle = '#4cc9f0'; c.lineWidth = 5; c.lineCap = 'round';
          c.beginPath(); c.moveTo(bx + 18, by - 22); c.quadraticCurveTo(w / 2 - 6, by - 10, w / 2, ty + th * 0.3); c.stroke();
          c.restore();
        }
        if (rate <= 0.2) E.grab(c, w / 2, ty + th * 0.45, tw * 0.75, t);
        E.hint(stage, rate > 0.2 ? '기포가 다시 활발합니다. 감자 조각은 그대로입니다'
                                 : '시험관을 톡 눌러 과산화수소수를 다시 부으세요 (' + D.reuse + '/3)');
      });

      /* 손맛 — 시험관을 톡 누르면 병이 기울어져 붓는다. 무대가 툭, 거품 파편 */
      E.drag(cv.cv, {
        start: function (ev) {
          var p = cv.pt(ev), tb = M.tube;
          st.tap = !!(tb && Math.abs(p.x - tb.x) < tb.w * 1.2 && p.y > tb.y - 40 && p.y < tb.y + tb.h + 20);
        },
        end: function () { if (st.tap) { st.tap = false; pour(); } }
      });
      function pour() {
        D.reuse++; E.save();
        st.pending = true;
        E.beep('whoosh'); E.kick(); E.buzz(12);
        if (M.tube) E.burst(M.tube.x, M.tube.y + M.tube.h * 0.3, null, 12, 2.4);
        E.toast(D.reuse >= 3 ? '세 번째도 부글거린다. 감자는 그대로다.' : (D.reuse + '회째. 다시 부글거린다. 감자 조각은 그대로다.'), 'good');
        drawLog(); sync();
      }

      var box = E.el('div', { cls: 'card' });
      box.innerHTML = '<h3>다시 넣기</h3>' +
        '<p class="muted">감자 조각은 꺼내지 않습니다. 과산화수소수만 새로 넣습니다. 무대의 시험관을 눌러도 됩니다.</p>';
      var btn = E.el('button', { cls: 'btn', type: 'button', text: '과산화수소수 5 mL 더 넣기' });
      var log = E.el('div', { cls: 'muted' });
      function drawLog() {
        log.innerHTML = D.reuse ? ('지금까지 <b>' + D.reuse + '회</b> 더 넣었고, ' +
                                   '그때마다 기포가 다시 활발했습니다.') : '';
      }
      btn.addEventListener('click', pour);
      box.appendChild(E.el('div', { cls: 'btnrow' }, btn));
      box.appendChild(log);
      panel.appendChild(box);
      drawLog();

      var note = E.el('div', { cls: 'card' });
      note.innerHTML = '<h3>촉매의 정의를 다시 보면</h3>' +
        '<p>촉매는 <b>활성화에너지를 변화시켜 반응 속도에 영향을 주는 물질</b>입니다. ' +
        '정의 안에 "반응하면서 소모된다"는 말이 없습니다. ' +
        '효소도 촉매이므로 <b>반응에서 소모되거나 변형되지 않습니다.</b></p>';
      panel.appendChild(note);
      E.quiz(panel, Q, sync);

      function sync() {
        var qok = !!(D._ans[Q.id] && D._ans[Q.id].ok);
        if (D.reuse >= 3 && qok) {
          E.note('효소의 재사용', '감자 조각을 그대로 둔 채 과산화수소수를 ' + D.reuse +
                 '회 더 넣었고 그때마다 기포가 다시 활발했다. 효소는 반응에서 소모되거나 변형되지 않는다.');
        }
        E.gate(D.reuse >= 3 && qok,
               D.reuse < 3 ? '과산화수소수를 세 번 이상 더 넣어 보세요' : '확인 문항을 풀어야 넘어갑니다');
      }
      sync();
    }
  };
}

    q: '효소를 넣었을 때 그래프에서 <b>달라지지 않는 것</b>은 무엇인가?',
    opts: [

      '반응 속도',
      '반응할 수 있는 반응물의 수'

         '따라서 <b>두 에너지의 차이도 변하지 않습니다.</b> 활성화에너지가 낮아지면 그 문턱을 넘을 수 있는 ' +

      2: '활성화에너지가 낮아졌으므로 반응 속도는 빨라집니다.',
      3: '문턱이 낮아지면 그것을 넘을 수 있는 반응물의 수가 늘어납니다. 이것이 속도가 빨라지는 까닭입니다.'
